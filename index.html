                                <div className="border-t border-slate-200 dark:border-slate-800 my-1 pt-1">
                                    <button onClick={() => { setCurrentTask(null); setTaskModalOpen(true); setIsMobileMenuOpen(false); }} className="w-full flex items-center justify-start space-x-3 bg-sky-500 hover:bg-sky-600 text-white px-4 py-3 rounded-lg text-sm font-bold">
                                        <Icon name="plus" className="w-4 h-4" />
                                        <span>Add Task</span>
                                    </button>
                                </div>
                            </div>
                        )}
                    </header>

                    <main ref={mainRef} onScroll={handleScroll} className={`flex-1 overflow-y-auto p-4 sm:p-6 max-w-7xl w-full mx-auto z-10 relative scroll-smooth ${activeTab === 'tasks' ? 'flex flex-col min-h-0' : 'space-y-6'}`}>
                        {activeTab === 'dashboard' && (
                            <DashboardView
                                projects={projects}
                                tasks={filteredTasks}
                                setActiveTab={setActiveTab}
                                selectedProjectId={selectedProjectId}
                                setSelectedProjectId={setSelectedProjectId}
                                onTaskClick={handleDashboardTaskClick}
                                onTogglePin={handleTogglePin}
                                onToggleComplete={handleToggleComplete}
                            />
                        )}
                        {activeTab === 'projects' && (
                            <ProjectsView
                                projects={projects}
                                tasks={filteredTasks}
                                selectedProjectDetail={selectedProjectDetail}
                                setSelectedProjectDetail={setSelectedProjectDetail}
                                onEditProject={(p) => { setCurrentProject(p); setProjectModalOpen(true); }}
                                onNewProject={() => { setCurrentProject(null); setProjectModalOpen(true); }}
                                onNewTaskForProject={(projectId) => { setCurrentTask({ projectId, title: '', quadrant: 'do-first', recurring: 'none' }); setTaskModalOpen(true); }}
                                onToggleComplete={handleToggleComplete}
                                onTogglePin={handleTogglePin}
                                onEditTask={(t) => { setCurrentTask(t); setTaskModalOpen(true); }}
                            />
                        )}
                        {activeTab === 'tasks' && (
                            <TasksMatrixView
                                projects={projects}
                                tasks={filteredTasks}
                                onEditTask={(t) => { setCurrentTask(t); setTaskModalOpen(true); }}
                                onDuplicateTask={handleDuplicateTask}
                                onTogglePin={handleTogglePin}
                                onToggleComplete={handleToggleComplete}
                                onDeleteTask={(id) => {
                                    const t = tasks.find(x => x.id === id);
                                    if (t && !window.confirm(`Delete "${t.title}"? This can be undone with Ctrl+Z until you leave the app.`)) return;
                                    updateTasksWithHistory(tasks.filter(x => x.id !== id), 'Task deleted.');
                                }}
                                highlightedTaskId={highlightedTaskId}
                            />
                        )}
                        {activeTab === 'calendar' && (
                            <CalendarView
                                tasks={filteredTasks}
                                projects={projects}
                                onEditTask={(t) => { setCurrentTask(t); setTaskModalOpen(true); }}
                                onNewTaskForDate={(dateStr) => { setCurrentTask({ dueDate: dateStr, title: '', quadrant: 'do-first', recurring: 'none' }); setTaskModalOpen(true); }}
                                onToggleComplete={handleToggleComplete}
                            />
                        )}
                        {activeTab === 'pomodoro' && (
                            <PomodoroView
                                tasks={filteredTasks.filter(t => t.status !== 'Completed')}
                                selectedTaskId={selectedTaskId}
                                setSelectedTaskId={setSelectedTaskId}
                                pomoCycle={pomoCycle}
                                isWorkPhase={isWorkPhase}
                                timeLeft={timeLeft}
                                isRunning={isRunning}
                                toggleTimer={toggleTimer}
                                resetTimer={resetTimer}
                                customMinutes={customMinutes}
                                setCustomMinutes={(val) => {
                                    setCustomMinutes(val);
                                    if (!isRunning && isWorkPhase) setTimeLeft(val * 60);
                                }}
                                formatSeconds={formatSeconds}
                                wakeLockEnabled={wakeLockEnabled}
                                setWakeLockEnabled={setWakeLockEnabled}
                            />
                        )}

                        <footer className="pt-6 pb-2 flex flex-wrap items-center justify-center gap-x-4 gap-y-1 text-[11px] text-slate-400 dark:text-slate-600">
                            <span>Action Plan — a free, local-only productivity app.</span>
                            <button type="button" onClick={() => { setLegalTab('privacy'); setLegalModalOpen(true); }} className="underline hover:text-sky-500 transition-colors">Privacy Policy</button>
                            <button type="button" onClick={() => { setLegalTab('terms'); setLegalModalOpen(true); }} className="underline hover:text-sky-500 transition-colors">Terms of Use</button>
                            <button type="button" onClick={() => { setLegalTab('disclaimer'); setLegalModalOpen(true); }} className="underline hover:text-sky-500 transition-colors">Disclaimer</button>
                        </footer>
                    </main>

                    {/* Scroll to Top Button */}
                    <button
                        onClick={scrollToTop}
                        aria-label="Back to top"
                        tabIndex={showTopBtn ? 0 : -1}
                        aria-hidden={!showTopBtn}
                        className={`fixed bottom-6 right-6 z-40 p-3 rounded-full bg-sky-500 hover:bg-sky-600 text-white shadow-xl transition-all duration-300 transform btn-press ${showTopBtn ? 'translate-y-0 opacity-100' : 'translate-y-16 opacity-0 pointer-events-none'}`}
                        title="Back to Top"
                    >
                        <Icon name="arrow-up" className="w-5 h-5" />
                    </button>

                    {/* Local Data Notice (this app does not use cookies) */}
                    {!cookieAccepted && (
                        <div role="status" className="fixed bottom-4 left-4 right-4 md:left-auto md:right-4 md:w-80 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 p-5 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 z-50 flex flex-col gap-3 animate-fade-in-up">
                            <div className="flex items-center gap-2 font-bold text-sm">
                                <Icon name="cookie" className="w-4 h-4 text-amber-500" /> Your data stays on this device
                            </div>
                            <p className="text-xs text-slate-500 dark:text-slate-400">
                                This app doesn't use cookies or send your tasks anywhere. Everything is saved in this browser's local storage, on this device only.{' '}
                                <button type="button" onClick={() => { setLegalTab('privacy'); setLegalModalOpen(true); }} className="text-sky-500 hover:underline font-semibold">Learn more</button>
                            </p>
                            <button
                                onClick={() => { setCookieAccepted(true); localStorage.setItem('cookie_accepted', 'true'); }}
                                className="bg-sky-500 hover:bg-sky-600 px-4 py-2 rounded-xl text-white text-xs font-bold transition w-full text-center btn-press"
                            >
                                Got it!
                            </button>
                        </div>
                    )}

                    {/* Modals */}
                    {taskModalOpen && (
                        <TaskModal
                            task={currentTask}
                            projects={projects}
                            defaultProjectId={selectedProjectId !== 'all' ? selectedProjectId : (selectedProjectDetail?.id || projects[0]?.id)}
                            onClose={() => setTaskModalOpen(false)}
                            onOpenProjectModal={() => { setTaskModalOpen(false); setCurrentProject(null); setProjectModalOpen(true); }}
                            onCompleteTask={() => {
                                if (currentTask?.id) {
                                    handleToggleComplete(currentTask.id);
                                    setTaskModalOpen(false);
                                }
                            }}
                            onSave={(savedTask) => {
                                if (currentTask && currentTask.id) {
                                    updateTasksWithHistory(
                                        tasks.map(t => t.id === savedTask.id ? normalizeTask({ ...t, ...savedTask }) : t),
                                        'Task updated.'
                                    );
                                } else {
                                    const newTask = normalizeTask({
                                        ...savedTask,
                                        id: 't_' + Math.random().toString(36).substring(2, 11),
                                        status: 'Not Started'
                                    });
                                    updateTasksWithHistory([...tasks, newTask], 'Task created.');
                                }
                                setTaskModalOpen(false);
                            }}
                            onDuplicate={() => {
                                if (currentTask?.id) {
                                    handleDuplicateTask(currentTask);
                                    setTaskModalOpen(false);
                                }
                            }}
                        />
                    )}

                    {projectModalOpen && (
                        <ProjectModal
                            project={currentProject}
                            onClose={() => setProjectModalOpen(false)}
                            onSave={(savedP) => {
                                if (currentProject) {
                                    setProjects(prev => prev.map(p => p.id === savedP.id ? savedP : p));
                                    showToast('Project updated successfully.');
                                } else {
                                    setProjects(prev => [...prev, { ...savedP, id: 'p_' + Math.random().toString(36).substring(2, 11) }]);
                                    showToast('Project created.');
                                }
                                setProjectModalOpen(false);
                            }}
                            onDelete={currentProject?.id ? () => handleDeleteProject(currentProject.id) : null}
                        />
                    )}

                    {shareModalOpen && (
                        <div className="fixed inset-0 z-50 bg-white/80 dark:bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setShareModalOpen(false)}>
                            <div role="dialog" aria-modal="true" aria-labelledby="share-modal-title" onClick={(e) => e.stopPropagation()} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 animate-fade-in-up">
                                <div className="flex items-center justify-between">
                                    <h3 id="share-modal-title" className="text-sm font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                        <Icon name="share-2" className="w-4 h-4 text-sky-500" />
                                        Export Backup
                                    </h3>
                                    <button onClick={() => setShareModalOpen(false)} aria-label="Close" className="p-1 rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-slate-200 transition btn-press">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>
                                <p className="text-xs text-slate-600 dark:text-slate-400">
                                    Native share isn’t available here. Download a CSV backup instead.
                                </p>
                                <button
                                    onClick={exportCSVBlob}
                                    className="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold btn-press"
                                >
                                    <Icon name="download" className="w-4 h-4" />
                                    Download CSV
                                </button>
                            </div>
                        </div>
                    )}

                    {clearModalOpen && (
                        <div className="fixed inset-0 z-50 bg-white/80 dark:bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => { setClearModalOpen(false); setClearConfirmText(''); }}>
                            <div role="dialog" aria-modal="true" aria-labelledby="clear-modal-title" onClick={(e) => e.stopPropagation()} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5 animate-fade-in-up">
                                <div className="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                                    <div className="flex items-center space-x-2 text-rose-500">
                                        <Icon name="alert-triangle" className="w-5 h-5" />
                                        <h3 id="clear-modal-title" className="text-sm font-bold uppercase tracking-wider text-slate-900 dark:text-slate-100">Clear All Saved Data</h3>
                                    </div>
                                    <button onClick={() => { setClearModalOpen(false); setClearConfirmText(''); }} aria-label="Close" className="p-1 rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-slate-200 transition btn-press">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>
                                <p className="text-xs text-slate-700 dark:text-slate-300">Remove all saved projects and tasks? This deletes everything stored in this browser and can't be undone. Export a CSV backup first if you want to keep a copy.</p>
                                <div className="space-y-1.5">
                                    <label htmlFor="clear-confirm-input" className="block text-slate-600 dark:text-slate-400 text-xs font-semibold">
                                        Type <span className="text-rose-500 font-bold font-mono">CLEAR</span> to confirm:
                                    </label>
                                    <input
                                        id="clear-confirm-input"
                                        type="text"
                                        value={clearConfirmText}
                                        onChange={(e) => setClearConfirmText(e.target.value)}
                                        placeholder="Type CLEAR"
                                        className="w-full bg-slate-100 dark:bg-slate-850 border border-slate-300 dark:border-slate-750 rounded-xl px-4 py-2.5 text-xs font-mono uppercase focus:border-rose-500"
                                    />
                                </div>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => { setClearModalOpen(false); setClearConfirmText(''); }} className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-850 hover:bg-slate-200 dark:hover:bg-slate-700 btn-press">Cancel</button>
                                    <button
                                        disabled={clearConfirmText.trim().toUpperCase() !== 'CLEAR'}
                                        onClick={handleClearAllData}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 btn-press transition ${
                                            clearConfirmText.trim().toUpperCase() === 'CLEAR'
                                                ? 'bg-rose-600 hover:bg-rose-500 text-white'
                                                : 'bg-slate-200 dark:bg-slate-800 text-slate-400 cursor-not-allowed'
                                        }`}
                                    >
                                        <Icon name="trash-2" className="w-3.5 h-3.5" />
                                        Delete All Data
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {legalModalOpen && (
                        <LegalModal activeTab={legalTab} setActiveTab={setLegalTab} onClose={() => setLegalModalOpen(false)} />
                    )}
                </div>
            );
        }

        // ---------------- VIEWS ----------------

        function DashboardView({ projects, tasks, setActiveTab, selectedProjectId, setSelectedProjectId, onTaskClick, onTogglePin, onToggleComplete }) {
            const activeTasks = tasks.filter(t => t.status !== 'Completed');
            const pinnedTasks = tasks.filter(t => t.isPinned);
            const completedTasks = tasks.filter(t => t.status === 'Completed').length;
            const totalFocusMins = tasks.reduce((acc, t) => acc + (t.focusMinutes || 0), 0);
            const completionRate = tasks.length ? Math.round((completedTasks / tasks.length) * 100) : 0;

            return (
                <div className="space-y-6 animate-fade-in-up">
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 md:p-8 shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-6 card-lift">
                        <div className="space-y-2 w-full md:w-auto">
                            <select
                                value={selectedProjectId}
                                onChange={(e) => setSelectedProjectId(e.target.value)}
                                className="bg-slate-100 dark:bg-slate-800 text-sky-600 dark:text-sky-400 text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wider border border-slate-300 dark:border-slate-700 cursor-pointer outline-none focus:ring-2 focus:ring-sky-500 transition-shadow"
                            >
                                <option value="all">All Active Projects</option>
                                {projects.map(p => <option key={p.id} value={p.id}>Project: {p.name}</option>)}
                            </select>
                            <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 dark:text-slate-100 tracking-tight mt-2">Daily Overview</h2>
                            <p className="text-slate-600 dark:text-slate-400 text-xs max-w-xl">
                                {activeTasks.length === 0 ? "You're all caught up! Enjoy your day." : `You have ${activeTasks.length} active tasks remaining.`}
                            </p>
                        </div>
                        <div className="flex flex-col items-end gap-3 shrink-0 bg-slate-50 dark:bg-slate-850 p-4 rounded-xl border border-slate-200 dark:border-slate-750 w-full md:w-auto">
                            <div className="text-right flex items-center space-x-4">
                                <div>
                                    <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Completion Rate</div>
                                    <div className="text-3xl font-extrabold text-slate-900 dark:text-slate-100">{completionRate}%</div>
                                </div>
                                <div className="w-12 h-12 rounded-full border-[4px] border-slate-200 dark:border-slate-700 flex items-center justify-center relative">
                                    <svg className="absolute inset-0 w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                        <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#38bdf8" strokeWidth="4" strokeDasharray={`${completionRate}, 100`} className="transition-all duration-1000 ease-out" />
                                    </svg>
                                    <Icon name="check-circle" className="w-5 h-5 text-sky-500 relative z-10" />
                                </div>
                            </div>
                            <div className="flex gap-4 text-xs font-semibold text-slate-600 dark:text-slate-400">
                                <div>Completed: <span className="text-emerald-600 dark:text-emerald-400">{completedTasks}</span></div>
                                <div>Focus Time: <span className="text-sky-600 dark:text-sky-400">{totalFocusMins}m</span></div>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="space-y-4">
                            <div className="flex items-center justify-between">
                                <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                    <Icon name="pin" className="w-4 h-4 text-sky-500" />
                                    Pinned Priority Tasks
                                </h3>
                                <button onClick={() => setActiveTab('tasks')} className="text-xs font-semibold text-sky-600 dark:text-sky-400 hover:underline hover:text-sky-500 transition-colors">View Matrix →</button>
                            </div>
                            {pinnedTasks.length === 0 ? (
                                <div className="bg-white/50 dark:bg-slate-900/50 border border-dashed border-slate-200 dark:border-slate-800 rounded-xl p-8 text-center">
                                    <Icon name="pin-off" className="w-8 h-8 text-slate-300 dark:text-slate-600 mb-3 mx-auto" />
                                    <p className="text-sm text-slate-600 dark:text-slate-400 font-medium">No pinned tasks.</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {pinnedTasks.map(task => (
                                        <TaskCard key={task.id} task={task} project={projects.find(p => p.id === task.projectId)} onClick={() => onTaskClick(task.id)} onTogglePin={() => onTogglePin(task.id)} onToggleComplete={() => onToggleComplete(task.id)} />
                                    ))}
                                </div>
                            )}
                        </div>
                        <div className="space-y-4">
                            <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                <Icon name="zap" className="w-4 h-4 text-amber-500" />
                                Recent Activity
                            </h3>
                            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 shadow-sm">
                                {activeTasks.slice(0, 5).map(task => (
                                    <div key={task.id} className="flex items-center justify-between py-3 border-b border-slate-100 dark:border-slate-800 last:border-0 group">
                                        <div className="flex-1 min-w-0 pr-4">
                                            <button type="button" className="text-sm font-bold text-slate-800 dark:text-slate-200 hover:text-sky-500 transition-colors block truncate w-full text-left" onClick={() => onTaskClick(task.id)}>{task.title}</button>
                                            <div className="flex items-center gap-2 mt-1 flex-wrap">
                                                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 flex items-center gap-1">
                                                    <Icon name="timer" className="w-3 h-3" />{task.focusMinutes || 0}m
                                                </span>
                                                {task.dueDate && <span className="text-[10px] text-slate-400">{task.dueDate} {task.dueTime}</span>}
                                            </div>
                                        </div>
                                        <button onClick={() => onToggleComplete(task.id)} aria-label={`Mark "${task.title}" as complete`} className="w-6 h-6 rounded-md border-2 border-slate-300 dark:border-slate-600 hover:border-emerald-500 hover:bg-slate-50 dark:hover:bg-slate-800 transition flex items-center justify-center btn-press shrink-0" />
                                    </div>
                                ))}
                                {activeTasks.length === 0 && <p className="text-xs text-slate-500 text-center py-4">No active tasks.</p>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ProjectsView({ projects, tasks, selectedProjectDetail, setSelectedProjectDetail, onEditProject, onNewProject, onNewTaskForProject, onToggleComplete, onTogglePin, onEditTask }) {
            if (selectedProjectDetail) {
                const projectTasks = tasks.filter(t => t.projectId === selectedProjectDetail.id);
                return (
                    <div className="space-y-6 animate-fade-in-up">
                        <button onClick={() => setSelectedProjectDetail(null)} className="text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 flex items-center gap-1.5 transition-colors">
                            <Icon name="arrow-left" className="w-3.5 h-3.5" /> Back to Projects
                        </button>
                        <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-2xl shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <div className="flex items-center gap-2 mb-1">
                                    <span className="text-[10px] font-bold px-2 py-0.5 rounded border" style={{ backgroundColor: `${selectedProjectDetail.color || '#38bdf8'}20`, borderColor: selectedProjectDetail.color || '#38bdf8' }}>{selectedProjectDetail.code}</span>
                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border uppercase ${selectedProjectDetail.status === 'Active' ? 'bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-500/20 dark:text-emerald-400' : 'bg-slate-100 text-slate-600 dark:bg-slate-800'}`}>{selectedProjectDetail.status}</span>
                                </div>
                                <h2 className="text-2xl font-extrabold text-slate-900 dark:text-slate-100">{selectedProjectDetail.name}</h2>
                                <p className="text-sm text-slate-600 dark:text-slate-400 mt-1">{selectedProjectDetail.description}</p>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => onEditProject(selectedProjectDetail)} className="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs font-semibold transition btn-press">Edit</button>
                                <button onClick={() => onNewTaskForProject(selectedProjectDetail.id)} className="px-3 py-1.5 rounded-lg bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold flex items-center gap-1.5 transition btn-press">
                                    <Icon name="plus" className="w-3.5 h-3.5" /> Add Task
                                </button>
                            </div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {projectTasks.length === 0 ? (
                                <div className="col-span-full text-center p-8 border border-dashed border-slate-300 dark:border-slate-700 rounded-xl text-slate-500">No tasks in this project yet.</div>
                            ) : projectTasks.map(t => (
                                <TaskCard key={t.id} task={t} project={selectedProjectDetail} onClick={() => onEditTask(t)} onTogglePin={() => onTogglePin(t.id)} onToggleComplete={() => onToggleComplete(t.id)} />
                            ))}
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-6 animate-fade-in-up">
                    <div className="flex items-center justify-between">
                        <h2 className="text-lg font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                            <Icon name="folder-kanban" className="w-5 h-5 text-sky-500" />
                            Projects & Areas
                        </h2>
                        <button onClick={onNewProject} className="flex items-center space-x-1.5 bg-slate-900 dark:bg-slate-800 hover:bg-slate-800 dark:hover:bg-slate-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition btn-press">
                            <Icon name="plus" className="w-4 h-4" />
                            <span>New Project</span>
                        </button>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                        {projects.map(project => {
                            const pTasks = tasks.filter(t => t.projectId === project.id);
                            const activeCount = pTasks.filter(t => t.status !== 'Completed').length;
                            const compCount = pTasks.length - activeCount;
                            const prog = pTasks.length ? Math.round((compCount / pTasks.length) * 100) : 0;
                            const barColor = project.color || '#38bdf8';
                            return (
                                <div
                                    key={project.id}
                                    role="button"
                                    tabIndex={0}
                                    aria-label={`Open project: ${project.name}`}
                                    onClick={() => setSelectedProjectDetail(project)}
                                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSelectedProjectDetail(project); } }}
                                    className="group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 cursor-pointer card-lift shadow-sm hover:border-sky-300 dark:hover:border-slate-600 relative overflow-hidden flex flex-col h-full">
                                    <div className="flex justify-between items-start mb-3">
                                        <span className="text-[10px] font-bold px-2 py-0.5 rounded border uppercase" style={{ backgroundColor: `${barColor}20`, borderColor: barColor }}>{project.code}</span>
                                        <button onClick={(e) => { e.stopPropagation(); onEditProject(project); }} aria-label={`Edit project: ${project.name}`} className="text-slate-400 hover:text-sky-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 p-1 transition btn-press">
                                            <Icon name="edit-3" className="w-4 h-4" />
                                        </button>
                                    </div>
                                    <h3 className="text-base font-extrabold text-slate-900 dark:text-slate-100 mb-1">{project.name}</h3>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mb-4 flex-1">{project.description}</p>
                                    <div className="space-y-2 mt-auto">
                                        <div className="flex items-center justify-between text-[11px] font-semibold">
                                            <span className="text-slate-600 dark:text-slate-300">{activeCount} active · {pTasks.length} total</span>
                                            <span className="text-slate-500">{prog}%</span>
                                        </div>
                                        <div className="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                                            <div
                                                className="h-full rounded-full transition-all duration-1000 ease-out"
                                                style={{
                                                    width: prog > 0 ? `${Math.max(prog, 3)}%` : '0%',
                                                    backgroundColor: barColor,
                                                    minWidth: prog > 0 ? '6px' : 0
                                                }}
                                            />
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                        {projects.length === 0 && (
                            <div className="col-span-full text-center p-10 border border-dashed border-slate-300 dark:border-slate-700 rounded-2xl text-slate-500 text-sm">No projects yet. Create one to get started.</div>
                        )}
                    </div>
                </div>
            );
        }

        function TasksMatrixView({ projects, tasks, onEditTask, onDuplicateTask, onTogglePin, onToggleComplete, onDeleteTask, highlightedTaskId }) {
            const getTasksByQuad = (quad) => tasks.filter(t => (t.quadrant || 'do-first') === quad && t.status !== 'Completed');

            const renderQuadrant = (id, title, desc, icon, bgClass, borderClass, textClass) => {
                const quadTasks = getTasksByQuad(id);
                return (
                    <div className={`matrix-quad rounded-2xl p-4 border ${borderClass} ${bgClass} shadow-sm`}>
                        <div className="flex items-center justify-between mb-3 shrink-0">
                            <div className="flex items-center space-x-2">
                                <div className={`p-1.5 rounded-lg bg-white/50 dark:bg-slate-900/50 ${textClass}`}>
                                    <Icon name={icon} className="w-4 h-4" />
                                </div>
                                <div>
                                    <h3 className={`text-sm font-extrabold ${textClass}`}>{title}</h3>
                                    <p className="text-[10px] text-slate-600 dark:text-slate-400">{desc}</p>
                                </div>
                            </div>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/60 dark:bg-slate-900/60 border ${textClass}`}>{quadTasks.length}</span>
                        </div>
                        <div className="matrix-quad-body space-y-3 pr-1">
                            {quadTasks.length === 0 ? (
                                <div className="py-8 flex items-center justify-center text-xs text-slate-400 border-2 border-dashed border-slate-300/50 dark:border-slate-700/50 rounded-xl">Empty</div>
                            ) : quadTasks.map(t => (
                                <TaskCard
                                    key={t.id}
                                    task={t}
                                    project={projects.find(p => p.id === t.projectId)}
                                    onClick={() => onEditTask(t)}
                                    onTogglePin={() => onTogglePin(t.id)}
                                    onToggleComplete={() => onToggleComplete(t.id)}
                                    onDuplicate={() => onDuplicateTask(t)}
                                    onDelete={() => onDeleteTask(t.id)}
                                    highlighted={highlightedTaskId === t.id}
                                />
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="animate-fade-in-up flex flex-col gap-3 shrink-0">
                    <div className="shrink-0 flex items-center justify-between">
                        <div>
                            <h2 className="text-lg font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                <Icon name="grid" className="w-5 h-5 text-sky-500" />
                                Tasks Matrix
                            </h2>
                            <p className="text-xs text-slate-500 mt-0.5 hidden sm:block">Eisenhower method — quadrants expand to show their tasks.</p>
                        </div>
                    </div>
                    <div className="matrix-grid">
                        {renderQuadrant('do-first', 'Do First', 'Urgent & Important', 'alert-circle', 'bg-rose-50/50 dark:bg-rose-950/10', 'border-rose-200 dark:border-rose-900/30', 'text-rose-700 dark:text-rose-400')}
                        {renderQuadrant('schedule', 'Schedule', 'Important, Not Urgent', 'calendar-clock', 'bg-sky-50/50 dark:bg-sky-950/10', 'border-sky-200 dark:border-sky-900/30', 'text-sky-700 dark:text-sky-400')}
                        {renderQuadrant('delegate', 'Delegate', 'Urgent, Not Important', 'users', 'bg-amber-50/50 dark:bg-amber-950/10', 'border-amber-200 dark:border-amber-900/30', 'text-amber-700 dark:text-amber-400')}
                        {renderQuadrant('eliminate', 'Eliminate', 'Neither', 'trash-2', 'bg-slate-100/50 dark:bg-slate-900/30', 'border-slate-200 dark:border-slate-800', 'text-slate-700 dark:text-slate-400')}
                    </div>
                </div>
            );
        }

        function CalendarView({ tasks, projects, onEditTask, onNewTaskForDate, onToggleComplete }) {
            const [viewMode, setViewMode] = useState('month');
            const [currentDate, setCurrentDate] = useState(new Date());
            const [dayFocus, setDayFocus] = useState(new Date());

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const weekdayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

            const startOfMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const endOfMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
            const startDay = startOfMonth.getDay();
            const daysInMonth = endOfMonth.getDate();
            const days = [];
            for (let i = 0; i < startDay; i++) days.push(null);
            for (let i = 1; i <= daysInMonth; i++) days.push(new Date(currentDate.getFullYear(), currentDate.getMonth(), i));

            const isToday = (d) => {
                if (!d) return false;
                const t = new Date();
                return d.getDate() === t.getDate() && d.getMonth() === t.getMonth() && d.getFullYear() === t.getFullYear();
            };

            const goToday = () => {
                const now = new Date();
                setCurrentDate(now);
                setDayFocus(now);
                setViewMode('day');
            };

            const dayStr = getLocalDateStr(dayFocus);
            const dayTasks = tasks
                .filter(t => t.dueDate === dayStr && t.status !== 'Completed')
                .sort((a, b) => (a.dueTime || '99:99').localeCompare(b.dueTime || '99:99'));

            const shiftDay = (delta) => {
                const d = new Date(dayFocus);
                d.setDate(d.getDate() + delta);
                setDayFocus(d);
                setCurrentDate(d);
            };

            const taskColor = (t) => {
                const p = projects.find(proj => proj.id === t.projectId);
                return p?.color || t.color || '#38bdf8';
            };

            if (viewMode === 'day') {
                return (
                    <div className="space-y-5 animate-fade-in-up">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-3 flex-wrap">
                                <h2 className="text-xl font-extrabold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                    <Icon name="calendar-days" className="w-5 h-5 text-sky-500" />
                                    {weekdayNames[dayFocus.getDay()]}, {monthNames[dayFocus.getMonth()]} {dayFocus.getDate()}
                                </h2>
                                {isToday(dayFocus) && (
                                    <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-sky-500 text-white">Today</span>
                                )}
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => shiftDay(-1)} className="p-2 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition btn-press">
                                    <Icon name="chevron-left" className="w-4 h-4" />
                                </button>
                                <button onClick={goToday} className="px-3 py-1 rounded-lg border border-slate-300 dark:border-slate-700 text-xs font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition btn-press">Today</button>
                                <button onClick={() => shiftDay(1)} className="p-2 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition btn-press">
                                    <Icon name="chevron-right" className="w-4 h-4" />
                                </button>
                                <button onClick={() => setViewMode('month')} className="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition text-xs font-bold border border-slate-200 dark:border-slate-700 btn-press">
                                    Month view
                                </button>
                                <button onClick={() => onNewTaskForDate(dayStr)} className="px-3 py-1.5 rounded-lg bg-sky-500 hover:bg-sky-600 transition text-white text-xs font-bold flex items-center gap-1 btn-press">
                                    <Icon name="plus" className="w-3.5 h-3.5" /> Add
                                </button>
                            </div>
                        </div>

                        <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm">
                            {dayTasks.length === 0 ? (
                                <div className="p-12 text-center text-slate-500 text-sm">
                                    <Icon name="calendar-off" className="w-10 h-10 mx-auto mb-3 text-slate-300 dark:text-slate-600" />
                                    No tasks scheduled for this day.
                                    <div className="mt-4">
                                        <button onClick={() => onNewTaskForDate(dayStr)} className="text-sky-500 font-semibold text-xs hover:underline hover:text-sky-600 transition">Create a task for {dayStr}</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {dayTasks.map(t => {
                                        const p = projects.find(proj => proj.id === t.projectId);
                                        const color = taskColor(t);
                                        return (
                                            <div
                                                key={t.id}
                                                role="button"
                                                tabIndex={0}
                                                aria-label={`Open task: ${t.title}`}
                                                onClick={() => onEditTask(t)}
                                                onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onEditTask(t); } }}
                                                className="flex items-start gap-4 p-4 hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition group"
                                            >
                                                <div className="w-16 shrink-0 text-right pt-0.5">
                                                    <span className="text-xs font-mono font-bold text-slate-500 group-hover:text-sky-500 transition-colors">{t.dueTime || 'All day'}</span>
                                                </div>
                                                <div className="w-1 self-stretch rounded-full shrink-0" style={{ backgroundColor: color }} />

                                                {/* In-view Task Completion Toggle */}
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); onToggleComplete(t.id); }}
                                                    aria-label={`Mark "${t.title}" as complete`}
                                                    className="w-5 h-5 mt-0.5 shrink-0 rounded border-2 border-slate-300 dark:border-slate-600 hover:border-emerald-500 hover:bg-emerald-50 dark:hover:bg-emerald-900/30 flex items-center justify-center transition btn-press"
                                                    title="Mark Complete"
                                                >
                                                    {t.status === 'Completed' && <Icon name="check" className="w-3 h-3 text-emerald-500" />}
                                                </button>

                                                <div className="flex-1 min-w-0">
                                                    <div className="text-sm font-bold text-slate-900 dark:text-slate-100 group-hover:text-sky-600 dark:group-hover:text-sky-400 transition-colors">{t.title}</div>
                                                    {t.description && <p className="text-xs text-slate-500 mt-0.5 line-clamp-2">{t.description}</p>}
                                                    <div className="flex gap-2 mt-1.5">
                                                        {p && <span className="text-[9px] font-bold uppercase px-1.5 py-0.5 rounded border" style={{ color: color, borderColor: `${color}40`, backgroundColor: `${color}10` }}>{p.code}</span>}
                                                        {t.recurring && t.recurring !== 'none' && <Icon name="repeat" className="w-3 h-3 text-sky-500" />}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-6 animate-fade-in-up">
                    <div className="flex items-center justify-between flex-wrap gap-3">
                        <div className="flex items-center gap-3">
                            <h2 className="text-xl font-extrabold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                <Icon name="calendar" className="w-5 h-5 text-sky-500" />
                                {monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}
                            </h2>
                            <button onClick={goToday} className="px-3 py-1 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-bold text-slate-700 dark:text-slate-300 transition btn-press">
                                Today
                            </button>
                        </div>
                        <div className="flex items-center space-x-2">
                            <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1))} className="p-2 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition btn-press">
                                <Icon name="chevron-left" className="w-4 h-4" />
                            </button>
                            <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1))} className="p-2 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition btn-press">
                                <Icon name="chevron-right" className="w-4 h-4" />
                            </button>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm">
                        <div className="grid grid-cols-7 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50">
                            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                                <div key={day} className="p-3 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">{day}</div>
                            ))}
                        </div>
                        <div className="grid grid-cols-7 auto-rows-[minmax(100px,auto)]">
                            {days.map((date, idx) => {
                                if (!date) return <div key={`empty-${idx}`} className="p-2 border-r border-b border-slate-100 dark:border-slate-800/50 bg-slate-50/50 dark:bg-slate-950/20" />;
                                const dateStr = getLocalDateStr(date);
                                const dayTasks = tasks.filter(t => t.dueDate === dateStr && t.status !== 'Completed');
                                const isCurrentDay = isToday(date);
                                return (
                                    <div
                                        key={dateStr}
                                        className={`p-2 border-r border-b border-slate-100 dark:border-slate-800/50 min-h-[110px] group relative transition-colors ${isCurrentDay ? 'bg-sky-50/30 dark:bg-sky-950/20' : 'hover:bg-slate-50 dark:hover:bg-slate-800/30'}`}
                                    >
                                        <div className="flex justify-between items-start mb-2">
                                            <button
                                                onClick={() => { setDayFocus(date); setViewMode('day'); }}
                                                className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full transition-transform btn-press ${isCurrentDay ? 'bg-sky-500 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}`}
                                            >
                                                {date.getDate()}
                                            </button>
                                            <button onClick={() => onNewTaskForDate(dateStr)} className="opacity-0 group-hover:opacity-100 p-1 text-slate-400 hover:text-sky-500 transition-opacity btn-press" title="Add task">
                                                <Icon name="plus" className="w-3.5 h-3.5" />
                                            </button>
                                        </div>
                                        <div className="space-y-1.5 max-h-[140px] overflow-y-auto">
                                            {dayTasks.map(t => {
                                                const color = taskColor(t);
                                                return (
                                                    <div
                                                        key={t.id}
                                                        role="button"
                                                        tabIndex={0}
                                                        aria-label={`Open task: ${t.title}`}
                                                        onClick={() => onEditTask(t)}
                                                        onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onEditTask(t); } }}
                                                        className="text-[10px] font-semibold truncate px-2 py-1.5 rounded-lg border cursor-pointer bg-white dark:bg-slate-800 hover:shadow-sm transition-all"
                                                        style={{ borderColor: color, borderLeftWidth: '3px' }}
                                                    >
                                                        <span className="text-slate-800 dark:text-slate-200">
                                                            {t.dueTime && <span className="mr-1 text-slate-400">{t.dueTime}</span>}
                                                            {t.title}
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function PomodoroView({ tasks, selectedTaskId, setSelectedTaskId, pomoCycle, isWorkPhase, timeLeft, isRunning, toggleTimer, resetTimer, customMinutes, setCustomMinutes, formatSeconds, wakeLockEnabled, setWakeLockEnabled }) {
            const breakMins = pomoCycle === 7 ? 15 : 5;
            const progressPercent = isWorkPhase
                ? ((customMinutes * 60 - timeLeft) / (customMinutes * 60)) * 100
                : ((breakMins * 60 - timeLeft) / (breakMins * 60)) * 100;

            const cycleDots = [];
            for (let i = 0; i < 4; i++) {
                const step = i * 2;
                cycleDots.push(
                    <div key={i} className={`w-3 h-3 rounded-full border-2 transition-colors ${pomoCycle > step ? 'bg-sky-500 border-sky-500' : pomoCycle === step ? 'border-sky-500 animate-pulse' : 'border-slate-300 dark:border-slate-700'}`} />
                );
            }

            return (
                <div className="flex items-center justify-center min-h-[calc(100vh-140px)] animate-fade-in-up p-4">
                    <div className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-slate-200 dark:border-slate-800 p-8 rounded-3xl shadow-2xl max-w-md w-full flex flex-col items-center">
                        <div className="text-center mb-6">
                            <h2 className="text-xl font-extrabold text-slate-900 dark:text-slate-100 flex items-center justify-center gap-2">
                                <Icon name="timer" className="w-5 h-5 text-sky-500" /> Focus Timer
                            </h2>
                            <p className="text-xs text-slate-500 mt-1 uppercase tracking-widest font-bold">
                                {isWorkPhase ? 'Focus Session' : (pomoCycle === 7 ? 'Long Break' : 'Short Break')}
                            </p>
                        </div>
                        
                        <div className="relative w-56 h-56 flex items-center justify-center mb-8">
                            <svg className="absolute inset-0 w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" strokeWidth="3" className="text-slate-200 dark:text-slate-800 transition-colors" />
                                <circle cx="50" cy="50" r="45" fill="none" stroke={isWorkPhase ? '#38bdf8' : '#34d399'} strokeWidth="5" strokeLinecap="round" strokeDasharray={`${Math.max(0, Math.min(100, progressPercent)) * 2.827}, 282.7`} className="transition-all duration-1000 ease-linear" />
                            </svg>
                            <div className="text-5xl font-mono font-extrabold text-slate-900 dark:text-slate-100 relative z-10 tracking-tighter">
                                {formatSeconds(timeLeft)}
                            </div>
                        </div>

                        <div className="flex justify-center gap-4 mb-8">{cycleDots}</div>

                        <div className="flex flex-col items-center justify-center w-full gap-4">
                            <div className="flex items-center justify-center gap-4">
                                <button
                                    onClick={toggleTimer}
                                    className={`w-14 h-14 rounded-full flex items-center justify-center shadow-lg transition-transform hover:scale-105 active:scale-95 text-white ${isRunning ? 'bg-amber-500 hover:bg-amber-600' : 'bg-sky-500 hover:bg-sky-600'}`}
                                >
                                    <Icon name={isRunning ? 'pause' : 'play'} className="w-6 h-6 ml-0.5" />
                                </button>
                                <button
                                    onClick={resetTimer}
                                    className="w-12 h-12 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-transform hover:scale-105 active:scale-95 shadow-sm"
                                    title="Reset Timer"
                                >
                                    <Icon name="rotate-ccw" className="w-5 h-5" />
                                </button>
                            </div>

                            <div className="w-full mt-4 space-y-4">
                                <div className="space-y-1">
                                    <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Link to Task</label>
                                    <select
                                        value={selectedTaskId}
                                        onChange={(e) => setSelectedTaskId(e.target.value)}
                                        className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs font-semibold focus:border-sky-500 outline-none transition-colors"
                                    >
                                        <option value="">No specific task</option>
                                        {tasks.map(t => <option key={t.id} value={t.id}>{t.title}</option>)}
                                    </select>
                                </div>

                                <div className="flex items-center justify-between px-2">
                                    <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5 cursor-pointer group">
                                        <div className={`w-4 h-4 rounded border flex items-center justify-center transition-colors ${wakeLockEnabled ? 'bg-sky-500 border-sky-500' : 'border-slate-300 dark:border-slate-600 group-hover:border-sky-400'}`}>
                                            {wakeLockEnabled && <Icon name="check" className="w-2.5 h-2.5 text-white" />}
                                        </div>
                                        <input type="checkbox" checked={wakeLockEnabled} onChange={(e) => setWakeLockEnabled(e.target.checked)} className="hidden" />
                                        Keep Screen On
                                    </label>
                                    
                                    {!isRunning && isWorkPhase && (
                                        <div className="flex items-center gap-2">
                                            <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Mins:</label>
                                            <input 
                                                type="number" 
                                                value={customMinutes} 
                                                onChange={(e) => setCustomMinutes(Math.max(1, parseInt(e.target.value) || 25))}
                                                className="w-16 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 text-xs font-bold focus:border-sky-500 outline-none text-center"
                                                min="1"
                                                max="120"
                                            />
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
