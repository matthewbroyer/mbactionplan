                                        <Icon name={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4" /> {theme === 'dark' ? 'Light theme' : 'Dark theme'}
                                    </button>
                                    <button onClick={() => { setClearModalOpen(true); setIsMobileMenuOpen(false); }} className="btn danger">
                                        <Icon name="trash-2" className="w-4 h-4" /> Clear data
                                    </button>
                                </div>
                            </div>
                        )}
                    </header>

                    <main ref={mainRef} onScroll={handleScroll} className="flex-1 overflow-y-auto relative z-10 pb-20 lg:pb-0">
                        <div className={`max-w-7xl w-full mx-auto p-3 sm:p-6 ${activeTab === 'tasks' ? 'flex flex-col' : 'space-y-5'}`}>
                            {searchQuery.trim() && (
                                <div className="flex items-center justify-between gap-3 px-3 py-2 rounded-lg border border-sky-500/40 bg-sky-500/10 text-sm text-slate-700 dark:text-slate-200 mb-4">
                                    <span className="flex items-center gap-2 min-w-0"><Icon name="search" className="w-4 h-4 text-sky-600 dark:text-sky-400 shrink-0" /><span className="truncate">Filtering by “{searchQuery}” - {filteredTasks.length} matching task{filteredTasks.length === 1 ? '' : 's'}</span></span>
                                    <button onClick={() => setSearchQuery('')} className="btn ghost sm">Clear</button>
                                </div>
                            )}
                            {activeTab === 'dashboard' && (
                                <DashboardView
                                    projects={projects}
                                    tasks={filteredTasks}
                                    setActiveTab={setActiveTab}
                                    selectedProjectId={selectedProjectId}
                                    setSelectedProjectId={setSelectedProjectId}
                                    onTaskClick={handleDashboardTaskClick}
                                    onTogglePin={handleTogglePin}
                                    onToggleComplete={handleToggleComplete}
                                    onNewTask={() => { setCurrentTask(null); setTaskModalOpen(true); }}
                                />
                            )}
                            {activeTab === 'projects' && (
                                <ProjectsView
                                    projects={projects}
                                    tasks={filteredTasks}
                                    selectedProjectDetail={selectedProjectDetail}
                                    setSelectedProjectDetail={setSelectedProjectDetail}
                                    onEditProject={(p) => { setCurrentProject(p); setProjectModalOpen(true); }}
                                    onNewProject={() => { setCurrentProject(null); setProjectModalOpen(true); }}
                                    onNewTaskForProject={(projectId) => { setCurrentTask({ projectId, title: '', quadrant: 'do-first', recurring: 'none' }); setTaskModalOpen(true); }}
                                    onToggleComplete={handleToggleComplete}
                                    onTogglePin={handleTogglePin}
                                    onEditTask={(t) => { setCurrentTask(t); setTaskModalOpen(true); }}
                                />
                            )}
                            {activeTab === 'tasks' && (
                                <TasksMatrixView
                                    projects={projects}
                                    tasks={filteredTasks}
                                    onEditTask={(t) => { setCurrentTask(t); setTaskModalOpen(true); }}
                                    onDuplicateTask={handleDuplicateTask}
                                    onTogglePin={handleTogglePin}
                                    onToggleComplete={handleToggleComplete}
                                    onDeleteTask={(id) => {
                                        const t = tasks.find(x => x.id === id);
                                        if (t && !window.confirm(`Delete "${t.title}"? This can be undone with Ctrl+Z until you leave the app.`)) return;
                                        updateTasksWithHistory(tasks.filter(x => x.id !== id), 'Task deleted.');
                                    }}
                                    highlightedTaskId={highlightedTaskId}
                                />
                            )}
                            {activeTab === 'calendar' && (
                                <CalendarView
                                    tasks={filteredTasks}
                                    projects={projects}
                                    onEditTask={(t) => { setCurrentTask(t); setTaskModalOpen(true); }}
                                    onNewTaskForDate={(dateStr) => { setCurrentTask({ dueDate: dateStr, title: '', quadrant: 'do-first', recurring: 'none' }); setTaskModalOpen(true); }}
                                    onToggleComplete={handleToggleComplete}
                                />
                            )}
                            {activeTab === 'pomodoro' && (
                                <PomodoroView
                                    tasks={filteredTasks.filter(t => t.status !== 'Completed')}
                                    selectedTaskId={selectedTaskId}
                                    setSelectedTaskId={setSelectedTaskId}
                                    pomoCycle={pomoCycle}
                                    isWorkPhase={isWorkPhase}
                                    timeLeft={timeLeft}
                                    isRunning={isRunning}
                                    toggleTimer={toggleTimer}
                                    resetTimer={resetTimer}
                                    customMinutes={customMinutes}
                                    setCustomMinutes={(val) => {
                                        setCustomMinutes(val);
                                        if (!isRunning && isWorkPhase) setTimeLeft(val * 60);
                                    }}
                                    formatSeconds={formatSeconds}
                                    wakeLockEnabled={wakeLockEnabled}
                                    setWakeLockEnabled={setWakeLockEnabled}
                                />
                            )}

                            <footer className="pt-8 pb-3 flex flex-wrap items-center justify-center gap-x-4 gap-y-1 text-xs text-slate-500 dark:text-slate-400">
                                <span>mbactionplan.online - a free, local-only productivity app.</span>
                                <button type="button" onClick={() => { setLegalTab('privacy'); setLegalModalOpen(true); }} className="underline hover:text-sky-600 dark:hover:text-sky-400">Privacy Policy</button>
                                <button type="button" onClick={() => { setLegalTab('terms'); setLegalModalOpen(true); }} className="underline hover:text-sky-600 dark:hover:text-sky-400">Terms of Use</button>
                                <button type="button" onClick={() => { setLegalTab('disclaimer'); setLegalModalOpen(true); }} className="underline hover:text-sky-600 dark:hover:text-sky-400">Disclaimer</button>
                            </footer>
                        </div>
                    </main>

                    {/* Mobile bottom navigation */}
                    <nav aria-label="Main" className="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-white dark:bg-slate-900 border-t border-slate-300 dark:border-slate-750 grid grid-cols-5" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
                        {NAV_TABS.map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => { setActiveTab(tab.id); setIsMobileMenuOpen(false); }}
                                aria-current={activeTab === tab.id ? 'page' : undefined}
                                className={`min-h-[56px] flex flex-col items-center justify-center gap-1 text-[11px] font-medium transition-colors ${activeTab === tab.id ? 'text-sky-600 dark:text-sky-400 shadow-[inset_0_2px_0_currentColor] font-semibold' : 'text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100'}`}
                            >
                                <Icon name={tab.icon} className="w-5 h-5" />
                                <span>{tab.short}</span>
                            </button>
                        ))}
                    </nav>

                    {/* Scroll to Top Button */}
                    <button
                        onClick={scrollToTop}
                        aria-label="Back to top"
                        tabIndex={showTopBtn ? 0 : -1}
                        aria-hidden={!showTopBtn}
                        className={`btn icon fixed bottom-20 lg:bottom-6 right-4 lg:right-6 z-30 shadow-xl transition-opacity ${showTopBtn ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}
                        title="Back to top"
                    >
                        <Icon name="arrow-up" className="w-4 h-4" />
                    </button>

                    {/* Local Data Notice (this app does not use cookies) */}
                    {!cookieAccepted && (
                        <div role="status" className="fixed bottom-20 lg:bottom-4 left-3 right-3 md:left-auto md:right-4 md:w-80 panel !shadow-xl z-50 p-4 flex flex-col gap-2.5 animate-fade-in-up border-l-[3px] !border-l-sky-500">
                            <div className="flex items-center gap-2 font-semibold text-sm text-slate-900 dark:text-slate-100">
                                <Icon name="shield-check" className="w-4 h-4 text-sky-600 dark:text-sky-400" /> Your data stays on this device
                            </div>
                            <p className="text-xs text-slate-600 dark:text-slate-400">
                                This app doesn't use cookies or send your tasks anywhere. Everything is saved in this browser's local storage, on this device only.{' '}
                                <button type="button" onClick={() => { setLegalTab('privacy'); setLegalModalOpen(true); }} className="link text-xs">Learn more</button>
                            </p>
                            <button
                                onClick={() => { setCookieAccepted(true); localStorage.setItem('cookie_accepted', 'true'); }}
                                className="btn primary sm w-full"
                            >
                                Got it
                            </button>
                        </div>
                    )}
                    {/* Modals */}
                    {taskModalOpen && (
                        <TaskModal
                            task={currentTask}
                            projects={projects}
                            defaultProjectId={selectedProjectId !== 'all' ? selectedProjectId : (selectedProjectDetail?.id || projects[0]?.id)}
                            onClose={() => setTaskModalOpen(false)}
                            onOpenProjectModal={() => { setTaskModalOpen(false); setCurrentProject(null); setProjectModalOpen(true); }}
                            onCompleteTask={() => {
                                if (currentTask?.id) {
                                    handleToggleComplete(currentTask.id);
                                    setTaskModalOpen(false);
                                }
                            }}
                            onSave={(savedTask) => {
                                if (currentTask && currentTask.id) {
                                    updateTasksWithHistory(
                                        tasks.map(t => t.id === savedTask.id ? normalizeTask({ ...t, ...savedTask }) : t),
                                        'Task updated.'
                                    );
                                } else {
                                    const newTask = normalizeTask({
                                        ...savedTask,
                                        id: 't_' + Math.random().toString(36).substring(2, 11),
                                        status: 'Not Started'
                                    });
                                    updateTasksWithHistory([...tasks, newTask], 'Task created.');
                                }
                                setTaskModalOpen(false);
                            }}
                            onDuplicate={() => {
                                if (currentTask?.id) {
                                    handleDuplicateTask(currentTask);
                                    setTaskModalOpen(false);
                                }
                            }}
                        />
                    )}

                    {projectModalOpen && (
                        <ProjectModal
                            project={currentProject}
                            onClose={() => setProjectModalOpen(false)}
                            onSave={(savedP) => {
                                if (currentProject) {
                                    setProjects(prev => prev.map(p => p.id === savedP.id ? savedP : p));
                                    showToast('Project updated successfully.');
                                } else {
                                    setProjects(prev => [...prev, { ...savedP, id: 'p_' + Math.random().toString(36).substring(2, 11) }]);
                                    showToast('Project created.');
                                }
                                setProjectModalOpen(false);
                            }}
                            onDelete={currentProject?.id ? () => handleDeleteProject(currentProject.id) : null}
                        />
                    )}

                    {shareModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/45 dark:bg-black/60 flex items-center justify-center p-4 animate-fade-in" onClick={() => setShareModalOpen(false)}>
                            <div role="dialog" aria-modal="true" aria-labelledby="share-modal-title" onClick={(e) => e.stopPropagation()} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-4 animate-fade-in-up">
                                <div className="flex items-center justify-between">
                                    <h3 id="share-modal-title" className="text-base font-semibold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                        <Icon name="share-2" className="w-4 h-4 text-sky-600 dark:text-sky-400" />
                                        Export Backup
                                    </h3>
                                    <button onClick={() => setShareModalOpen(false)} aria-label="Close" className="btn ghost icon sm">
                                        <Icon name="x" className="w-4 h-4" />
                                    </button>
                                </div>
                                <p className="text-sm text-slate-600 dark:text-slate-400">
                                    Native share isn’t available here. Download a CSV backup instead.
                                </p>
                                <button
                                    onClick={exportCSVBlob}
                                    className="btn primary w-full"
                                >
                                    <Icon name="download" className="w-4 h-4" />
                                    Download CSV
                                </button>
                            </div>
                        </div>
                    )}

                    {clearModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/45 dark:bg-black/60 flex items-center justify-center p-4 animate-fade-in" onClick={() => { setClearModalOpen(false); setClearConfirmText(''); }}>
                            <div role="dialog" aria-modal="true" aria-labelledby="clear-modal-title" onClick={(e) => e.stopPropagation()} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 border-t-[3px] border-t-rose-600 dark:border-t-rose-400 rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-4 animate-fade-in-up">
                                <div className="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                                    <div className="flex items-center gap-2 text-rose-600 dark:text-rose-400">
                                        <Icon name="alert-triangle" className="w-5 h-5" />
                                        <h3 id="clear-modal-title" className="text-base font-semibold text-slate-900 dark:text-slate-100">Clear all saved data</h3>
                                    </div>
                                    <button onClick={() => { setClearModalOpen(false); setClearConfirmText(''); }} aria-label="Close" className="btn ghost icon sm">
                                        <Icon name="x" className="w-4 h-4" />
                                    </button>
                                </div>
                                <p className="text-sm text-slate-700 dark:text-slate-300">Remove all saved projects and tasks? This deletes everything stored in this browser and can't be undone. Export a CSV backup first if you want to keep a copy.</p>
                                <div className="space-y-1.5">
                                    <label htmlFor="clear-confirm-input" className="fld-label">
                                        Type <span className="text-rose-600 dark:text-rose-400 font-mono">CLEAR</span> to confirm
                                    </label>
                                    <input
                                        id="clear-confirm-input"
                                        type="text"
                                        value={clearConfirmText}
                                        onChange={(e) => setClearConfirmText(e.target.value)}
                                        placeholder="Type CLEAR"
                                        className="w-full px-3 font-mono uppercase"
                                        autoComplete="off"
                                        autoFocus
                                    />
                                </div>
                                <div className="flex justify-end gap-2 pt-1">
                                    <button onClick={() => { setClearModalOpen(false); setClearConfirmText(''); }} className="btn">Cancel</button>
                                    <button
                                        disabled={clearConfirmText.trim().toUpperCase() !== 'CLEAR'}
                                        onClick={handleClearAllData}
                                        className="btn danger solid"
                                    >
                                        <Icon name="trash-2" className="w-4 h-4" />
                                        Delete all data
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {legalModalOpen && (
                        <LegalModal activeTab={legalTab} setActiveTab={setLegalTab} onClose={() => setLegalModalOpen(false)} />
                    )}
                </div>
            );
        }

        // ---------------- VIEWS ----------------

        function DashboardView({ projects, tasks, setActiveTab, selectedProjectId, setSelectedProjectId, onTaskClick, onTogglePin, onToggleComplete, onNewTask }) {
            const activeTasks = tasks.filter(t => t.status !== 'Completed');
            const pinnedTasks = tasks.filter(t => t.isPinned);
            const completedTasks = tasks.filter(t => t.status === 'Completed').length;
            const totalFocusMins = tasks.reduce((acc, t) => acc + (t.focusMinutes || 0), 0);
            const completionRate = tasks.length ? Math.round((completedTasks / tasks.length) * 100) : 0;
            const todayStr = getLocalDateStr();
            const dueToday = activeTasks.filter(t => t.dueDate === todayStr).length;
            const overdue = activeTasks.filter(t => t.dueDate && t.dueDate < todayStr).length;
            const focusLabel = totalFocusMins >= 60 ? `${Math.floor(totalFocusMins / 60)}h ${totalFocusMins % 60}m` : `${totalFocusMins}m`;

            return (
                <div className="space-y-5 animate-fade-in-up">
                    <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-3">
                        <div>
                            <h2 className="text-xl sm:text-[22px] font-extrabold tracking-tight text-slate-900 dark:text-slate-100">Daily Overview</h2>
                            <p className="text-sm text-slate-600 dark:text-slate-400 mt-0.5">
                                {activeTasks.length === 0 ? "You're all caught up. Enjoy your day." : `You have ${activeTasks.length} active task${activeTasks.length === 1 ? '' : 's'} remaining.`}
                            </p>
                        </div>
                        <div className="sm:w-64">
                            <label htmlFor="dash-project-filter" className="fld-label">Showing</label>
                            <select id="dash-project-filter" value={selectedProjectId} onChange={(e) => setSelectedProjectId(e.target.value)} className="w-full px-3">
                                <option value="all">All Active Projects</option>
                                {projects.map(p => <option key={p.id} value={p.id}>Project: {p.name}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                        <div className="tile border-l-[3px] !border-l-sky-500">
                            <div className="lbl">Completion Rate</div>
                            <div className="val">{completionRate}%</div>
                            <div className="meter mt-2" role="progressbar" aria-label="Completion rate" aria-valuenow={completionRate} aria-valuemin="0" aria-valuemax="100"><i style={{ width: `${completionRate}%` }}></i></div>
                        </div>
                        <div className="tile">
                            <div className="lbl">Active</div>
                            <div className="val">{activeTasks.length}</div>
                            <div className="note">
                                {dueToday} due today{overdue > 0 && <span className="text-rose-600 dark:text-rose-400 font-semibold"> · {overdue} overdue</span>}
                            </div>
                        </div>
                        <div className="tile">
                            <div className="lbl">Completed</div>
                            <div className="val text-emerald-700 dark:text-emerald-400">{completedTasks}</div>
                            <div className="note">of {tasks.length} total</div>
                        </div>
                        <div className="tile">
                            <div className="lbl">Focus Time</div>
                            <div className="val">{focusLabel}</div>
                            <div className="note">logged by the timer</div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
                        <section className="panel">
                            <div className="panel-h">
                                <h3><Icon name="pin" className="w-4 h-4 text-sky-600 dark:text-sky-400" /> Pinned Priority Tasks</h3>
                                <button onClick={() => setActiveTab('tasks')} className="link">View matrix →</button>
                            </div>
                            {pinnedTasks.length === 0 ? (
                                <div className="empty">
                                    <Icon name="pin-off" className="w-6 h-6 text-slate-400 mb-2 mx-auto" />
                                    <b>No pinned tasks</b>
                                    Pin the tasks that matter most today so they stay at the top. Use the pin icon on any task, or tick "Pin to Dashboard" when editing one.
                                </div>
                            ) : (
                                <div className="p-3 space-y-2">
                                    {pinnedTasks.map(task => (
                                        <TaskCard key={task.id} task={task} project={projects.find(p => p.id === task.projectId)} onClick={() => onTaskClick(task.id)} onTogglePin={() => onTogglePin(task.id)} onToggleComplete={() => onToggleComplete(task.id)} />
                                    ))}
                                </div>
                            )}
                        </section>

                        <section className="panel">
                            <div className="panel-h">
                                <h3><Icon name="zap" className="w-4 h-4 text-amber-500" /> Recent Activity</h3>
                                <span className="text-xs text-slate-500 dark:text-slate-400 tabular">{Math.min(5, activeTasks.length)} of {activeTasks.length}</span>
                            </div>
                            {activeTasks.length === 0 ? (
                                <div className="empty">
                                    <Icon name="check-circle-2" className="w-6 h-6 text-emerald-500 mb-2 mx-auto" />
                                    <b>No active tasks</b>
                                    Everything here is done. Add a task to plan what's next.
                                    <div className="mt-3"><button onClick={onNewTask} className="btn primary sm"><Icon name="plus" className="w-4 h-4" /> Add Task</button></div>
                                </div>
                            ) : (
                                <ul className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {activeTasks.slice(0, 5).map(task => (
                                        <li key={task.id} className="flex items-center gap-3 px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-850 transition-colors">
                                            <button onClick={() => onToggleComplete(task.id)} aria-label={`Mark "${task.title}" as complete`} className="w-5 h-5 rounded border-2 border-slate-300 dark:border-slate-600 hover:border-emerald-500 hover:bg-emerald-50 dark:hover:bg-emerald-900/30 transition shrink-0" />
                                            <div className="flex-1 min-w-0">
                                                <button type="button" className="text-sm font-semibold text-slate-800 dark:text-slate-100 hover:text-sky-600 dark:hover:text-sky-400 transition-colors block truncate w-full text-left" onClick={() => onTaskClick(task.id)}>{task.title}</button>
                                                {task.dueDate && <div className="text-xs text-slate-500 dark:text-slate-400 tabular mt-0.5">Due {task.dueDate} {task.dueTime}</div>}
                                            </div>
                                            <span className="badge tabular shrink-0" title="Focus time logged">
                                                <Icon name="timer" className="w-3 h-3" />{task.focusMinutes || 0}m
                                            </span>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </section>
                    </div>
                </div>
            );
        }

        function ProjectsView({ projects, tasks, selectedProjectDetail, setSelectedProjectDetail, onEditProject, onNewProject, onNewTaskForProject, onToggleComplete, onTogglePin, onEditTask }) {
            if (selectedProjectDetail) {
                const projectTasks = tasks.filter(t => t.projectId === selectedProjectDetail.id);
                return (
                    <div className="space-y-4 animate-fade-in-up">
                        <button onClick={() => setSelectedProjectDetail(null)} className="btn ghost sm -ml-2">
                            <Icon name="arrow-left" className="w-4 h-4" /> Back to Projects
                        </button>
                        <div className="panel p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 border-l-[3px]" style={{ borderLeftColor: selectedProjectDetail.color || '#38bdf8' }}>
                            <div>
                                <div className="flex items-center gap-2 mb-1.5">
                                    <span className="badge uppercase"><i className="swatch" style={{ backgroundColor: selectedProjectDetail.color || '#38bdf8' }}></i>{selectedProjectDetail.code}</span>
                                    <span className={`badge ${selectedProjectDetail.status === 'Active' ? '!bg-emerald-50 !text-emerald-800 !border-emerald-300 dark:!bg-emerald-500/15 dark:!text-emerald-300 dark:!border-emerald-500/40' : ''}`}>{selectedProjectDetail.status}</span>
                                    <span className="badge tabular">{projectTasks.filter(t => t.status !== 'Completed').length} active · {projectTasks.length} total</span>
                                </div>
                                <h2 className="text-xl sm:text-[22px] font-extrabold tracking-tight text-slate-900 dark:text-slate-100">{selectedProjectDetail.name}</h2>
                                {selectedProjectDetail.description && <p className="text-sm text-slate-600 dark:text-slate-400 mt-1">{selectedProjectDetail.description}</p>}
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => onEditProject(selectedProjectDetail)} className="btn"><Icon name="edit-3" className="w-4 h-4" /> Edit</button>
                                <button onClick={() => onNewTaskForProject(selectedProjectDetail.id)} className="btn primary">
                                    <Icon name="plus" className="w-4 h-4" /> Add Task
                                </button>
                            </div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                            {projectTasks.length === 0 ? (
                                <div className="col-span-full empty border border-dashed border-slate-300 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-900"><b>No tasks in this project yet</b>Tasks you add here are grouped under this project across every view.<div className="mt-3"><button onClick={() => onNewTaskForProject(selectedProjectDetail.id)} className="btn primary sm"><Icon name="plus" className="w-4 h-4" /> Add Task</button></div></div>
                            ) : projectTasks.map(t => (
                                <TaskCard key={t.id} task={t} project={selectedProjectDetail} onClick={() => onEditTask(t)} onTogglePin={() => onTogglePin(t.id)} onToggleComplete={() => onToggleComplete(t.id)} />
                            ))}
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-4 animate-fade-in-up">
                    <div className="flex items-end justify-between gap-3">
                        <div>
                            <h2 className="text-xl sm:text-[22px] font-extrabold tracking-tight text-slate-900 dark:text-slate-100">Projects &amp; Areas</h2>
                            <p className="text-sm text-slate-600 dark:text-slate-400 mt-0.5">{projects.length} project{projects.length === 1 ? '' : 's'}. Open one to see its tasks.</p>
                        </div>
                        <button onClick={onNewProject} className="btn primary">
                            <Icon name="plus" className="w-4 h-4" />
                            <span>New Project</span>
                        </button>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                        {projects.map(project => {
                            const pTasks = tasks.filter(t => t.projectId === project.id);
                            const activeCount = pTasks.filter(t => t.status !== 'Completed').length;
                            const compCount = pTasks.length - activeCount;
                            const prog = pTasks.length ? Math.round((compCount / pTasks.length) * 100) : 0;
                            const barColor = project.color || '#38bdf8';
                            return (
                                <div
                                    key={project.id}
                                    role="button"
                                    tabIndex={0}
                                    aria-label={`Open project: ${project.name}`}
                                    onClick={() => setSelectedProjectDetail(project)}
                                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSelectedProjectDetail(project); } }}
                                    className="group panel p-4 cursor-pointer card-lift hover:!border-slate-400 dark:hover:!border-slate-600 relative overflow-hidden flex flex-col h-full border-t-[3px]" style={{ borderTopColor: barColor }}>
                                    <div className="flex justify-between items-start mb-3">
                                        <span className="badge uppercase"><i className="swatch" style={{ backgroundColor: barColor }}></i>{project.code}</span>
                                        <button onClick={(e) => { e.stopPropagation(); onEditProject(project); }} aria-label={`Edit project: ${project.name}`} className="btn ghost sm icon -mt-1 -mr-1 opacity-60 group-hover:opacity-100 focus-visible:opacity-100">
                                            <Icon name="edit-3" className="w-4 h-4" />
                                        </button>
                                    </div>
                                    <h3 className="text-[15px] font-semibold text-slate-900 dark:text-slate-100 mb-1">{project.name}</h3>
                                    <p className="text-[13px] text-slate-600 dark:text-slate-400 line-clamp-2 mb-4 flex-1">{project.description}</p>
                                    <div className="space-y-2 mt-auto">
                                        <div className="flex items-center justify-between text-xs tabular">
                                            <span className="text-slate-600 dark:text-slate-300">{activeCount} active · {pTasks.length} total</span>
                                            <span className="font-semibold text-slate-700 dark:text-slate-200">{prog}%</span>
                                        </div>
                                        <div className="meter">
                                            <div
                                                className="h-full rounded-sm transition-all duration-200"
                                                style={{
                                                    width: prog > 0 ? `${Math.max(prog, 3)}%` : '0%',
                                                    backgroundColor: barColor,
                                                    minWidth: prog > 0 ? '6px' : 0
                                                }}
                                            />
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                        {projects.length === 0 && (
                            <div className="col-span-full empty border border-dashed border-slate-300 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-900"><Icon name="folder-kanban" className="w-6 h-6 text-slate-400 mb-2 mx-auto" /><b>No projects yet</b>Projects group related tasks (work, home, a client) so you can filter and track progress.<div className="mt-3"><button onClick={onNewProject} className="btn primary sm"><Icon name="plus" className="w-4 h-4" /> New Project</button></div></div>
                        )}
                    </div>
                </div>
            );
        }

        function TasksMatrixView({ projects, tasks, onEditTask, onDuplicateTask, onTogglePin, onToggleComplete, onDeleteTask, highlightedTaskId }) {
            const getTasksByQuad = (quad) => tasks.filter(t => (t.quadrant || 'do-first') === quad && t.status !== 'Completed');

            const renderQuadrant = (id, title, desc, icon, qColor, textClass, emptyHint) => {
                const quadTasks = getTasksByQuad(id);
                return (
                    <section className="matrix-quad panel" style={{ '--qc': qColor }} aria-label={`${title}: ${desc}`}>
                        <div className="panel-h shrink-0">
                            <div className="flex items-center gap-2.5 min-w-0">
                                <Icon name={icon} className={`w-4 h-4 ${textClass}`} />
                                <div className="min-w-0">
                                    <h3 className={`text-sm font-semibold ${textClass}`}>{title}</h3>
                                    <p className="text-xs text-slate-500 dark:text-slate-400">{desc}</p>
                                </div>
                            </div>
                            <span className="badge tabular" aria-label={`${quadTasks.length} tasks`}>{quadTasks.length}</span>
                        </div>
                        <div className="matrix-quad-body p-3 space-y-2">
                            {quadTasks.length === 0 ? (
                                <div className="py-6 px-4 text-center text-xs text-slate-500 dark:text-slate-400 border border-dashed border-slate-300 dark:border-slate-700 rounded-lg">{emptyHint}</div>
                            ) : quadTasks.map(t => (
                                <TaskCard
                                    key={t.id}
                                    task={t}
                                    project={projects.find(p => p.id === t.projectId)}
                                    onClick={() => onEditTask(t)}
                                    onTogglePin={() => onTogglePin(t.id)}
                                    onToggleComplete={() => onToggleComplete(t.id)}
                                    onDuplicate={() => onDuplicateTask(t)}
                                    onDelete={() => onDeleteTask(t.id)}
                                    highlighted={highlightedTaskId === t.id}
                                />
                            ))}
                        </div>
                    </section>
                );
            };

            return (
                <div className="animate-fade-in-up flex flex-col gap-4 shrink-0">
                    <div className="shrink-0">
                        <h2 className="text-xl sm:text-[22px] font-extrabold tracking-tight text-slate-900 dark:text-slate-100">Tasks Matrix</h2>
                        <p className="text-sm text-slate-600 dark:text-slate-400 mt-0.5">Eisenhower method: sort by urgency and importance. Completed tasks drop off automatically.</p>
                    </div>
                    <div className="matrix-grid">
                        <div className="matrix-axis" aria-hidden="true"></div>
                        <div className="matrix-axis col" aria-hidden="true">Urgent</div>
                        <div className="matrix-axis col" aria-hidden="true">Not urgent</div>
                        <div className="matrix-axis row" aria-hidden="true">Important</div>
                        {renderQuadrant('do-first', 'Do First', 'Urgent & Important', 'alert-circle', '#dc2626', 'text-rose-700 dark:text-rose-400', 'Nothing urgent and important. Good place to be.')}
                        {renderQuadrant('schedule', 'Schedule', 'Important, Not Urgent', 'calendar-clock', 'rgb(var(--acc-500))', 'text-sky-700 dark:text-sky-400', 'Plan important work here before it becomes urgent.')}
                        <div className="matrix-axis row" aria-hidden="true">Not important</div>
                        {renderQuadrant('delegate', 'Delegate', 'Urgent, Not Important', 'users', '#d97706', 'text-amber-700 dark:text-amber-400', 'Nothing to hand off right now.')}
                        {renderQuadrant('eliminate', 'Eliminate', 'Neither', 'trash-2', 'var(--border-strong)', 'text-slate-700 dark:text-slate-300', 'Nothing to drop. Move low-value tasks here.')}
                    </div>
                </div>
            );
        }

        function CalendarView({ tasks, projects, onEditTask, onNewTaskForDate, onToggleComplete }) {
            const [viewMode, setViewMode] = useState('month');
            const [currentDate, setCurrentDate] = useState(new Date());
            const [dayFocus, setDayFocus] = useState(new Date());

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const weekdayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

            const startOfMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const endOfMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
            const startDay = startOfMonth.getDay();
            const daysInMonth = endOfMonth.getDate();
            const days = [];
            for (let i = 0; i < startDay; i++) days.push(null);
            for (let i = 1; i <= daysInMonth; i++) days.push(new Date(currentDate.getFullYear(), currentDate.getMonth(), i));

            const isToday = (d) => {
                if (!d) return false;
                const t = new Date();
                return d.getDate() === t.getDate() && d.getMonth() === t.getMonth() && d.getFullYear() === t.getFullYear();
            };

            const goToday = () => {
                const now = new Date();
                setCurrentDate(now);
                setDayFocus(now);
                setViewMode('day');
            };

            const dayStr = getLocalDateStr(dayFocus);
            const dayTasks = tasks
                .filter(t => t.dueDate === dayStr && t.status !== 'Completed')
                .sort((a, b) => (a.dueTime || '99:99').localeCompare(b.dueTime || '99:99'));

            const shiftDay = (delta) => {
                const d = new Date(dayFocus);
                d.setDate(d.getDate() + delta);
                setDayFocus(d);
                setCurrentDate(d);
            };

            const taskColor = (t) => {
                const p = projects.find(proj => proj.id === t.projectId);
                return p?.color || t.color || '#38bdf8';
            };

            if (viewMode === 'day') {
                return (
                    <div className="space-y-4 animate-fade-in-up">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-2.5 flex-wrap">
                                <h2 className="text-xl sm:text-[22px] font-extrabold tracking-tight text-slate-900 dark:text-slate-100">
                                    {weekdayNames[dayFocus.getDay()]}, {monthNames[dayFocus.getMonth()]} {dayFocus.getDate()}
                                </h2>
                                {isToday(dayFocus) && (
                                    <span className="badge !bg-sky-500/10 !text-sky-700 dark:!text-sky-300 !border-sky-500/40">Today</span>
                                )}
                            </div>
                            <div className="flex items-center gap-2 flex-wrap">
                                <div className="inline-flex" role="group" aria-label="Change day">
                                    <button onClick={() => shiftDay(-1)} aria-label="Previous day" className="btn icon !rounded-r-none">
                                        <Icon name="chevron-left" className="w-4 h-4" />
                                    </button>
                                    <button onClick={goToday} className="btn !rounded-none -ml-px">Today</button>
                                    <button onClick={() => shiftDay(1)} aria-label="Next day" className="btn icon !rounded-l-none -ml-px">
                                        <Icon name="chevron-right" className="w-4 h-4" />
                                    </button>
                                </div>
                                <button onClick={() => setViewMode('month')} className="btn">
                                    <Icon name="calendar" className="w-4 h-4" /> Month
                                </button>
                                <button onClick={() => onNewTaskForDate(dayStr)} className="btn primary">
                                    <Icon name="plus" className="w-4 h-4" /> Add Task
                                </button>
                            </div>
                        </div>

                        <div className="panel overflow-hidden">
                            {dayTasks.length === 0 ? (
                                <div className="empty !py-10">
                                    <Icon name="calendar-off" className="w-7 h-7 mx-auto mb-2 text-slate-400" />
                                    <b>Nothing scheduled for this day</b>
                                    Open tasks due on {dayStr} will appear here in time order.
                                    <div className="mt-3">
                                        <button onClick={() => onNewTaskForDate(dayStr)} className="btn primary sm"><Icon name="plus" className="w-4 h-4" /> Add a task for this day</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {dayTasks.map(t => {
                                        const p = projects.find(proj => proj.id === t.projectId);
                                        const color = taskColor(t);
                                        return (
                                            <div
                                                key={t.id}
                                                role="button"
                                                tabIndex={0}
                                                aria-label={`Open task: ${t.title}`}
                                                onClick={() => onEditTask(t)}
                                                onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onEditTask(t); } }}
                                                className="flex items-start gap-3 sm:gap-4 px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-850 cursor-pointer transition group"
                                            >
                                                <div className="w-14 shrink-0 text-right pt-0.5">
                                                    <span className="text-xs font-mono text-slate-600 dark:text-slate-400 tabular">{t.dueTime || 'All day'}</span>
                                                </div>
                                                <div className="w-[3px] self-stretch rounded-sm shrink-0" style={{ backgroundColor: color }} />

                                                {/* In-view Task Completion Toggle */}
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); onToggleComplete(t.id); }}
                                                    aria-label={`Mark "${t.title}" as complete`}
                                                    className="w-5 h-5 mt-0.5 shrink-0 rounded border-2 border-slate-300 dark:border-slate-600 hover:border-emerald-500 hover:bg-emerald-50 dark:hover:bg-emerald-900/30 flex items-center justify-center transition btn-press"
                                                    title="Mark Complete"
                                                >
                                                    {t.status === 'Completed' && <Icon name="check" className="w-3 h-3 text-emerald-500" />}
                                                </button>

                                                <div className="flex-1 min-w-0">
                                                    <div className="text-sm font-semibold text-slate-900 dark:text-slate-100 group-hover:text-sky-700 dark:group-hover:text-sky-400 transition-colors">{t.title}</div>
                                                    {t.description && <p className="text-xs text-slate-500 mt-0.5 line-clamp-2">{t.description}</p>}
                                                    <div className="flex gap-2 mt-1.5">
                                                        {p && <span className="badge uppercase"><i className="swatch" style={{ backgroundColor: color }}></i>{p.code}</span>}
                                                        {t.recurring && t.recurring !== 'none' && <span className="badge"><Icon name="repeat" className="w-3 h-3" />{t.recurring}</span>}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-4 animate-fade-in-up">
                    <div className="flex items-center justify-between flex-wrap gap-3">
                        <h2 className="text-xl sm:text-[22px] font-extrabold tracking-tight text-slate-900 dark:text-slate-100">
                            {monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}
                        </h2>
                        <div className="inline-flex" role="group" aria-label="Change month">
                            <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1))} aria-label="Previous month" className="btn icon !rounded-r-none">
                                <Icon name="chevron-left" className="w-4 h-4" />
                            </button>
                            <button onClick={goToday} className="btn !rounded-none -ml-px" title="Jump to today's agenda">Today</button>
                            <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1))} aria-label="Next month" className="btn icon !rounded-l-none -ml-px">
                                <Icon name="chevron-right" className="w-4 h-4" />
                            </button>
                        </div>
                    </div>

                    <div className="panel overflow-hidden">
                        <div className="grid grid-cols-7 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-850">
                            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                                <div key={day} className="py-2 text-center text-xs font-semibold text-slate-600 dark:text-slate-400">
                                    <span className="hidden sm:inline">{day}</span><span className="sm:hidden" aria-label={day}>{day[0]}</span>
                                </div>
                            ))}
                        </div>
                        <div className="grid grid-cols-7 auto-rows-[minmax(64px,auto)] sm:auto-rows-[minmax(100px,auto)]">
                            {days.map((date, idx) => {
                                if (!date) return <div key={`empty-${idx}`} className="p-2 border-r border-b border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/40" />;
                                const dateStr = getLocalDateStr(date);
                                const dayTasks = tasks.filter(t => t.dueDate === dateStr && t.status !== 'Completed');
                                const isCurrentDay = isToday(date);
                                return (
                                    <div
                                        key={dateStr}
                                        className={`p-1 sm:p-2 border-r border-b border-slate-100 dark:border-slate-800 min-h-[64px] sm:min-h-[110px] group relative transition-colors ${isCurrentDay ? 'bg-sky-500/[.06] shadow-[inset_0_2px_0_rgb(var(--acc-500))]' : 'hover:bg-slate-50 dark:hover:bg-slate-850'}`}
                                    >
                                        <div className="flex justify-between items-start mb-1 sm:mb-2">
                                            <button
                                                onClick={() => { setDayFocus(date); setViewMode('day'); }}
                                                aria-label={`Open ${monthNames[date.getMonth()]} ${date.getDate()}${dayTasks.length ? `, ${dayTasks.length} task${dayTasks.length === 1 ? '' : 's'}` : ''}${isCurrentDay ? ' (today)' : ''}`}
                                                className={`text-xs font-semibold tabular min-w-[26px] h-[26px] px-1 flex items-center justify-center rounded transition-colors ${isCurrentDay ? 'bg-sky-600 text-white dark:bg-sky-500 dark:text-slate-950' : 'text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-750'}`}
                                            >
                                                {date.getDate()}
                                            </button>
                                            <button onClick={() => onNewTaskForDate(dateStr)} aria-label={`Add task on ${dateStr}`} className="hidden sm:flex opacity-0 group-hover:opacity-100 focus-visible:opacity-100 p-1 rounded text-slate-500 hover:text-sky-600 hover:bg-slate-100 dark:hover:bg-slate-750 transition-opacity" title="Add task">
                                                <Icon name="plus" className="w-3.5 h-3.5" />
                                            </button>
                                        </div>
                                        {dayTasks.length > 0 && (
                                            <button type="button" onClick={() => { setDayFocus(date); setViewMode('day'); }} className="sm:hidden flex flex-wrap gap-0.5 px-0.5" aria-hidden="true" tabIndex={-1}>
                                                {dayTasks.slice(0, 4).map(t => <i key={t.id} className="swatch" style={{ backgroundColor: taskColor(t) }}></i>)}
                                                {dayTasks.length > 4 && <span className="text-[10px] leading-none text-slate-500">+{dayTasks.length - 4}</span>}
                                            </button>
                                        )}
                                        <div className="hidden sm:block space-y-1 max-h-[140px] overflow-y-auto">
                                            {dayTasks.map(t => {
                                                const color = taskColor(t);
                                                return (
                                                    <div
                                                        key={t.id}
                                                        role="button"
                                                        tabIndex={0}
                                                        aria-label={`Open task: ${t.title}`}
                                                        onClick={() => onEditTask(t)}
                                                        onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onEditTask(t); } }}
                                                        className="text-[11px] font-medium truncate px-1.5 py-1 rounded-sm border border-slate-200 dark:border-slate-750 cursor-pointer bg-white dark:bg-slate-850 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors"
                                                        style={{ borderLeftColor: color, borderLeftWidth: '3px' }}
                                                    >
                                                        <span className="text-slate-800 dark:text-slate-200">
                                                            {t.dueTime && <span className="mr-1 text-slate-500 dark:text-slate-400 tabular">{t.dueTime}</span>}
                                                            {t.title}
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function PomodoroView({ tasks, selectedTaskId, setSelectedTaskId, pomoCycle, isWorkPhase, timeLeft, isRunning, toggleTimer, resetTimer, customMinutes, setCustomMinutes, formatSeconds, wakeLockEnabled, setWakeLockEnabled }) {
            const breakMins = pomoCycle === 7 ? 15 : 5;
            const progressPercent = isWorkPhase
                ? ((customMinutes * 60 - timeLeft) / (customMinutes * 60)) * 100
                : ((breakMins * 60 - timeLeft) / (breakMins * 60)) * 100;

            const cycleDots = [];
            for (let i = 0; i < 4; i++) {
                const step = i * 2;
                cycleDots.push(
                    <div key={i} aria-hidden="true" className={`w-8 h-1.5 rounded-sm transition-colors ${pomoCycle > step ? 'bg-sky-500' : pomoCycle === step ? 'bg-sky-500/40' : 'bg-slate-200 dark:bg-slate-750'}`} />
                );
            }

            return (
                <div className="flex items-start sm:items-center justify-center sm:min-h-[calc(100vh-200px)] animate-fade-in-up">
                    <div className="panel max-w-md w-full overflow-hidden">
                        <div className="panel-h">
                            <h3><Icon name="timer" className="w-4 h-4 text-sky-600 dark:text-sky-400" /> Focus Timer</h3>
                            <span className={`badge ${isWorkPhase ? '!bg-sky-500/10 !text-sky-700 dark:!text-sky-300 !border-sky-500/40' : '!bg-emerald-500/10 !text-emerald-800 dark:!text-emerald-300 !border-emerald-500/40'}`}>
                                {isWorkPhase ? 'Focus session' : (pomoCycle === 7 ? 'Long break' : 'Short break')}
                            </span>
                        </div>

                        <div className="p-6 flex flex-col items-center">
                            <div className="relative w-56 h-56 flex items-center justify-center mb-5" role="timer" aria-live="off" aria-label={`${formatSeconds(timeLeft)} remaining`}>
                                <svg className="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100" aria-hidden="true">
                                    <circle cx="50" cy="50" r="45" fill="none" stroke="var(--surface-3)" strokeWidth="4" />
                                    <circle cx="50" cy="50" r="45" fill="none" stroke={isWorkPhase ? 'var(--accent)' : 'var(--good)'} strokeWidth="4" strokeLinecap="butt" strokeDasharray={`${Math.max(0, Math.min(100, progressPercent)) * 2.827}, 282.7`} style={{ transition: 'stroke-dasharray 1s linear' }} />
                                </svg>
                                <div className="text-center relative">
                                    <div className="text-5xl font-mono font-semibold text-slate-900 dark:text-slate-100 tabular tracking-tight">{formatSeconds(timeLeft)}</div>
                                    <div className="text-xs text-slate-500 dark:text-slate-400 mt-1">Cycle {Math.floor(pomoCycle / 2) + 1} of 4</div>
                                </div>
                            </div>

                            <div className="flex justify-center gap-2 mb-6" aria-label={`Session ${Math.floor(pomoCycle / 2) + 1} of 4`}>{cycleDots}</div>

                            <div className="flex items-center justify-center gap-2 w-full">
                                <button onClick={toggleTimer} className={`btn flex-1 !min-h-[44px] ${isRunning ? '' : 'primary'}`}>
                                    <Icon name={isRunning ? 'pause' : 'play'} className="w-4 h-4" />
                                    {isRunning ? 'Pause' : (timeLeft < (isWorkPhase ? customMinutes : breakMins) * 60 ? 'Resume' : 'Start')}
                                </button>
                                <button onClick={resetTimer} className="btn !min-h-[44px]" title="Reset timer">
                                    <Icon name="rotate-ccw" className="w-4 h-4" /> Reset
                                </button>
                            </div>
                        </div>

                        <div className="border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-850 p-4 space-y-3">
                            <div>
                                <label htmlFor="pomo-task-select" className="fld-label">Log focus time to</label>
                                <select
                                    id="pomo-task-select"
                                    value={selectedTaskId}
                                    onChange={(e) => setSelectedTaskId(e.target.value)}
                                    className="w-full px-3"
                                >
                                    <option value="">No specific task</option>
                                    {tasks.map(t => <option key={t.id} value={t.id}>{t.title}</option>)}
                                </select>
                            </div>

                            <div className="flex items-center justify-between gap-3 flex-wrap">
                                <label className="inline-flex items-center gap-2 cursor-pointer text-sm text-slate-700 dark:text-slate-300 min-h-[32px]">
                                    <input type="checkbox" checked={wakeLockEnabled} onChange={(e) => setWakeLockEnabled(e.target.checked)} />
                                    Keep screen on
                                </label>

                                {!isRunning && isWorkPhase && (
                                    <div className="flex items-center gap-2">
                                        <label htmlFor="pomo-minutes" className="text-sm text-slate-700 dark:text-slate-300">Focus minutes</label>
                                        <input
                                            id="pomo-minutes"
                                            type="number"
                                            value={customMinutes}
                                            onChange={(e) => setCustomMinutes(Math.max(1, parseInt(e.target.value) || 25))}
                                            className="w-20 px-2 text-center tabular"
                                            min="1"
                                            max="120"
                                        />
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
