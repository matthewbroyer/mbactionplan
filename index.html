    <style>
        /* ---- theme: "Utility" — neutral desktop-software palette, one indigo accent, light + dark ---- */
        :root{
            color-scheme:light;
            --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
            --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
            --r:6px; --r-sm:4px; --ctl:38px; --ctl-sm:32px; --ease:120ms ease;
            --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f6f7f9; --surface-3:#eceef2;
            --ink:#1b1f24; --ink-2:#48505c; --muted:#5f6773;
            --border:#dfe2e7; --border-strong:#c6cbd3;
            --accent:#4f46e5; --accent-hover:#4338ca; --accent-ink:#ffffff;
            --accent-soft:rgba(79,70,229,.09); --accent-line:rgba(79,70,229,.38);
            --good:#16a34a; --good-ink:#0b7a35; --warn:#e5a100; --warn-ink:#8a5a00; --crit:#c9302c;
            --shadow:0 1px 2px rgba(20,24,31,.06);
            --shadow-pop:0 8px 24px -6px rgba(20,24,31,.22),0 1px 3px rgba(20,24,31,.08);
            /* accent scale (RGB channels) consumed by Tailwind's "sky" palette */
            --acc-50:238 240 253; --acc-100:224 227 251; --acc-200:199 203 247; --acc-300:165 172 242;
            --acc-400:111 115 238; --acc-500:79 70 229; --acc-600:67 56 202; --acc-700:55 48 163;
            --acc-800:49 46 129; --acc-900:30 27 75; --acc-950:20 18 54;
            /* Eisenhower quadrants: one colour each, reused by the matrix, badges and the task form */
            --q1:#dc2626; --q2:var(--accent); --q3:#d97706; --q4:#8e97a3;
        }
        .dark{
            color-scheme:dark;
            --bg:#16181c; --surface:#1e2126; --surface-2:#25292f; --surface-3:#2d3238;
            --ink:#e9ecf0; --ink-2:#b4bbc5; --muted:#8e97a3;
            --border:#30353c; --border-strong:#434a53;
            --accent:#818cf8; --accent-hover:#a5b4fc; --accent-ink:#0d0b2a;
            --accent-soft:rgba(129,140,248,.13); --accent-line:rgba(129,140,248,.45);
            --good:#22c55e; --good-ink:#4ade80; --warn:#f0b429; --warn-ink:#f5c95c; --crit:#ff6b6b;
            --shadow:0 1px 2px rgba(0,0,0,.3);
            --shadow-pop:0 10px 28px -6px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03);
            --acc-300:199 210 254; --acc-400:165 180 252; --acc-500:129 140 248; --acc-600:99 102 241; --acc-700:165 180 252;
            --q1:#f06262; --q3:#f0a030; --q4:#7b8490;
        }

        body{font-family:var(--font);font-size:14px;line-height:1.45;background:var(--bg);color:var(--ink)}
        .font-mono{font-family:var(--mono)}
        ::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
        .tabular{font-variant-numeric:tabular-nums}

        ::-webkit-scrollbar{width:10px;height:10px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;border:3px solid var(--bg)}

        /* ---- focus: one visible accent ring everywhere ---- */
        button:focus, a:focus, select:focus, input:focus, textarea:focus, [tabindex]:focus{outline:none}
        button:focus-visible, a:focus-visible, [role="button"]:focus-visible, [role="tab"]:focus-visible, summary:focus-visible{
            outline:2px solid var(--accent)!important; outline-offset:1px;
        }

        /* ---- form controls (id selector outranks Tailwind utilities; horizontal padding left to markup) ---- */
        #root input[type=text], #root input[type=number], #root input[type=date], #root input[type=time],
        #root input[type=search], #root select, #root textarea{
            background-color:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-sm);
            color:var(--ink); font-size:14px; font-weight:400; box-shadow:none;
            transition:border-color var(--ease), box-shadow var(--ease);
        }
        #root input[type=text], #root input[type=number], #root input[type=date], #root input[type=time],
        #root input[type=search], #root select{min-height:var(--ctl); padding-top:0; padding-bottom:0}
        #root textarea{padding-top:8px; padding-bottom:8px; line-height:1.45}
        #root input:hover:not(:focus):not(:disabled), #root select:hover:not(:focus), #root textarea:hover:not(:focus){
            border-color:color-mix(in srgb,var(--ink) 35%,var(--border-strong));
        }
        #root input:focus, #root select:focus, #root textarea:focus{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
        #root input::placeholder, #root textarea::placeholder{color:var(--muted); opacity:.85}
        #root input[type=checkbox]{accent-color:var(--accent); width:16px; height:16px; margin:0; cursor:pointer}
        .dark input[type="date"]::-webkit-calendar-picker-indicator,
        .dark input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(.85); cursor:pointer}
        .fld-label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-2); margin-bottom:4px}
        .space-y-1\.5 > .fld-label, .space-y-1\.5 > div > .fld-label{margin-bottom:0}

        /* ---- buttons: primary / secondary / ghost / danger ---- */
        /* display lives in :where() so Tailwind's hidden / lg:inline-flex always win */
        :where(.btn){display:inline-flex}
        .btn{
            align-items:center; justify-content:center; gap:6px;
            min-height:var(--ctl); padding:0 14px; border-radius:var(--r-sm);
            font-size:13.5px; font-weight:600; line-height:1; white-space:nowrap; cursor:pointer;
            background:var(--surface); color:var(--ink); border:1px solid var(--border-strong);
            transition:background-color var(--ease), border-color var(--ease), color var(--ease);
        }
        .btn:hover{background:var(--surface-2); border-color:color-mix(in srgb,var(--ink) 30%,var(--border-strong))}
        .btn:active{background:var(--surface-3)}
        .btn.sm{min-height:var(--ctl-sm); padding:0 10px; font-size:13px}
        .btn.icon{padding:0; width:var(--ctl)}
        .btn.sm.icon{width:var(--ctl-sm)}
        .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
        .btn.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover)}
        .btn.primary:active{filter:brightness(.94)}
        .btn.success{background:var(--good); border-color:var(--good); color:#fff}
        .dark .btn.success{color:#06180d}
        .btn.success:hover{filter:brightness(.95)}
        .btn.danger{color:var(--crit); border-color:color-mix(in srgb,var(--crit) 45%,var(--border-strong)); background:var(--surface)}
        .btn.danger:hover{background:color-mix(in srgb,var(--crit) 8%,var(--surface)); border-color:var(--crit)}
        .btn.danger.solid{background:var(--crit); border-color:var(--crit); color:#fff}
        .dark .btn.danger.solid{color:#1a0505}
        .btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
        .btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
        .btn.ghost.danger:hover{background:color-mix(in srgb,var(--crit) 10%,transparent); color:var(--crit)}
        .btn:disabled, .btn:disabled:hover{background:var(--surface-2); border-color:var(--border); color:var(--muted); filter:none; cursor:not-allowed; opacity:.7}
        .btn.ghost:disabled{background:transparent; border-color:transparent}
        .btn.primary:disabled, .btn.danger.solid:disabled{background:var(--surface-3); border-color:var(--border); color:var(--muted)}
        .link{color:var(--accent); font-weight:600; font-size:13px}
        .link:hover{text-decoration:underline}

        /* ---- panels ---- */
        .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow)}
        .panel-h{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 14px; border-bottom:1px solid var(--border)}
        .panel-h h2, .panel-h h3{font-size:14px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:8px}
        .sect-t{font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
        .tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); padding:12px 14px}
        .tile .lbl{font-size:12px; font-weight:600; color:var(--ink-2)}
        .tile .val{font-size:22px; font-weight:650; letter-spacing:-.01em; margin-top:2px; color:var(--ink); font-variant-numeric:tabular-nums}
        .tile .note{font-size:12px; color:var(--muted)}
        .meter{height:8px; background:var(--surface-3); border-radius:2px; overflow:hidden}
        .meter > i{display:block; height:100%; background:var(--accent); border-radius:2px; transition:width .2s ease}
        .empty{padding:24px 16px; text-align:center; color:var(--muted); font-size:13.5px}
        .empty b{display:block; color:var(--ink); font-weight:600; margin-bottom:2px}
        .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; line-height:1; padding:3px 6px; border-radius:3px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2)}
        .swatch{display:inline-block; width:8px; height:8px; border-radius:2px; flex:none}

        /* ---- header nav: underline tabs ---- */
        .tabs button{position:relative; display:inline-flex; align-items:center; gap:7px; min-height:40px; padding:0 12px; font-size:13.5px; font-weight:500; color:var(--ink-2); border-radius:0; transition:background-color var(--ease), color var(--ease)}
        .tabs button:hover{background:var(--surface-2); color:var(--ink)}
        .tabs button[aria-current="page"], .tabs button[aria-selected="true"]{color:var(--accent); font-weight:600; box-shadow:inset 0 -2px 0 var(--accent)}
        .tabs button:focus-visible{outline-offset:-2px!important}

        /* ---- legacy helpers from the original build: keep hooks, drop the theatrics ---- */
        .card-lift{transition:border-color var(--ease), background-color var(--ease)}
        .card-lift:hover{border-color:var(--border-strong)}
        .btn-press{transition:background-color var(--ease), border-color var(--ease), color var(--ease)}

        .loader{width:28px; height:28px; border:3px solid var(--surface-3); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* ---- matrix: quadrants expand with their content; the page handles scrolling ---- */
        .matrix-grid{display:grid; grid-template-columns:minmax(0,1fr); gap:12px; align-items:stretch}
        .matrix-axis{display:none}
        @media (min-width:1024px){
            .matrix-grid{grid-template-columns:24px repeat(2,minmax(0,1fr)); grid-template-rows:auto 1fr 1fr; column-gap:12px; row-gap:12px}
            .matrix-axis{display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
            .matrix-axis.row{writing-mode:vertical-rl; transform:rotate(180deg)}
            .matrix-axis.col{margin-bottom:-4px}
        }
        .matrix-quad{min-height:180px; min-width:0; display:flex; flex-direction:column; overflow:visible; border-top:3px solid var(--qc,var(--border-strong))}
        .matrix-quad-body{flex:0 0 auto}

        /* ---- splash (static HTML, shown until React mounts; scoped to #splash) ---- */
        #splash{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:var(--bg); color:var(--ink)}
        #splash .sp-logo{width:52px; height:52px; border-radius:8px; background:var(--accent); display:flex; align-items:center; justify-content:center}
        #splash .sp-name{font-size:15px; font-weight:650}
        #splash .sp-bar{width:120px; height:3px; border-radius:2px; background:var(--surface-3); overflow:hidden}
        #splash .sp-bar i{display:block; width:40%; height:100%; border-radius:2px; background:var(--accent); animation:spslide 1s ease-in-out infinite}
        @keyframes spslide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

        /* ---- overlays: one dialog pattern; bottom sheet on phones, centred on larger screens ---- */
        .overlay{position:fixed; inset:0; z-index:50; background:rgba(10,12,16,.45); display:flex; align-items:flex-end; justify-content:center}
        .dark .overlay{background:rgba(0,0,0,.6)}
        .dialog{background:var(--surface); border:1px solid var(--border); border-radius:8px 8px 0 0; width:100%; max-height:92vh; box-shadow:var(--shadow-pop); display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom)}
        @media (min-width:640px){
            .overlay{align-items:center; padding:16px}
            .dialog{border-radius:8px; max-height:90vh; padding-bottom:0}
        }

        /* ---- light/dark switch (shared ecosystem component) ---- */
        :where(.themesw){display:inline-flex}
        .themesw{align-items:center; justify-content:center; min-height:var(--ctl-sm); padding:0 2px; border-radius:var(--r-sm); cursor:pointer; background:none; border:0; flex:none}
        .themesw .tk{position:relative; display:block; width:52px; height:26px; border-radius:var(--r-sm); background:var(--surface-3); box-shadow:inset 0 0 0 1px var(--border-strong)}
        .themesw .th{position:absolute; top:3px; left:3px; width:22px; height:20px; border-radius:3px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; transition:transform var(--ease)}
        .themesw[aria-checked="true"] .th{transform:translateX(24px)}
        .themesw:hover .tk{box-shadow:inset 0 0 0 1px var(--accent-line)}

        /* ---- backup status chip + data menu ---- */
        :where(.bk-chip){display:inline-flex}
        .bk-chip{align-items:center; gap:6px; min-height:var(--ctl-sm); padding:0 10px; border-radius:var(--r-sm); font-size:12.5px; font-weight:550; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--border); white-space:nowrap; cursor:pointer; transition:border-color var(--ease), color var(--ease)}
        .bk-chip:hover{border-color:var(--border-strong); color:var(--ink)}
        .bk-chip.warn{color:var(--warn-ink); background:color-mix(in srgb,var(--warn) 14%,var(--surface)); border-color:color-mix(in srgb,var(--warn) 50%,var(--border))}
        .warn-dot{position:absolute; top:3px; right:3px; width:8px; height:8px; border-radius:2px; background:var(--warn); box-shadow:0 0 0 2px var(--surface); display:none}
        .bk-chip-menu{display:none!important}
        /* phones: the chip becomes a warn dot on the Data button (and a full-width row in the tools menu) */
        @media (max-width:520px){ .bk-chip{display:none!important} .warn-dot{display:block} .bk-chip-menu{display:flex!important} }
        .dmenu{position:absolute; right:0; top:calc(100% + 6px); width:310px; max-width:calc(100vw - 24px); background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow-pop); padding:4px; z-index:60}
        .dm-item{display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left; min-height:48px; padding:8px 12px; border-radius:var(--r-sm); color:var(--ink); transition:background-color var(--ease)}
        .dm-item:hover{background:var(--surface-2)}
        .dm-item .ic{margin-top:1px; color:var(--ink-2)}
        .dm-item .t{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13.5px; font-weight:600}
        .dm-item .s{display:block; font-size:12px; color:var(--muted); margin-top:1px}
        .dm-item.primary .ic{color:var(--accent)}
        .dm-item.danger, .dm-item.danger .ic{color:var(--crit)}
        .dm-item.danger:hover{background:color-mix(in srgb,var(--crit) 8%,var(--surface))}
        .dm-sep{height:1px; background:var(--border); margin:4px 6px}
        .dm-foot{padding:8px 10px 6px; font-size:12px; color:var(--muted); border-top:1px solid var(--border); margin-top:4px}
        kbd{font-family:var(--font); font-size:11px; font-weight:600; color:var(--muted); border:1px solid var(--border); border-bottom-width:2px; border-radius:3px; padding:0 5px; line-height:16px}

        /* ---- complete checkbox: 20px box, 36px hit area (44px on touch) without shifting layout ---- */
        .check{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; margin:-8px; flex:none; border-radius:var(--r-sm); cursor:pointer}
        .check .box{width:20px; height:20px; border:2px solid var(--border-strong); border-radius:4px; display:flex; align-items:center; justify-content:center; color:#fff; transition:background-color var(--ease), border-color var(--ease)}
        .check:hover .box{border-color:var(--good); background:color-mix(in srgb,var(--good) 12%,transparent)}
        .check.on .box{background:var(--good); border-color:var(--good)}
        .dark .check.on .box{color:#06180d}
        .check:focus-visible{outline-offset:-4px!important}

        /* ---- quadrant picker (task form) ---- */
        .qpick{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
        .qopt{position:relative; display:flex; gap:10px; align-items:flex-start; min-height:56px; padding:9px 10px 9px 12px; border:1px solid var(--border-strong); border-top:3px solid var(--qc); border-radius:var(--r-sm); background:var(--surface); cursor:pointer; transition:background-color var(--ease), border-color var(--ease)}
        .qopt:hover{background:var(--surface-2)}
        .qopt .qradio{flex:none; width:16px; height:16px; margin-top:2px; border-radius:50%; border:2px solid var(--border-strong); display:flex; align-items:center; justify-content:center}
        .qopt .qt{display:block; font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.25}
        .qopt .qd{display:block; font-size:12px; color:var(--muted); line-height:1.3}

        .qopt:has(input:checked) .qradio::after{content:""; width:6px; height:6px; border-radius:50%; background:var(--qc)}

        .chip:hover{border-color:var(--accent); color:var(--ink)}
        .chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
        .hint{font-size:12px; color:var(--muted)}
        .hint.warn{color:var(--warn-ink)}

        /* ---- disclosure toggle ---- */
        .disclose{display:flex; align-items:center; gap:6px; width:100%; min-height:40px; padding:0 2px; font-size:13px; font-weight:600; color:var(--ink-2); border-top:1px solid var(--border)}
        .disclose:hover{color:var(--accent)}
        .disclose .chev{transition:transform var(--ease)}

        .onb-steps i.on{background:var(--accent)}
        .onb-row{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--border)}
        .onb-row:first-child{border-top:0}
        .onb-ic{flex:none; width:32px; height:32px; border-radius:var(--r-sm); background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center}

        .look:has(input:focus-visible){outline:2px solid var(--accent); outline-offset:2px}

        .look .pv b{display:block; height:8px; border-radius:2px}
        .look .pv.l{background:#f3f4f6; border-color:#dfe2e7}
        .look .pv.l b{background:#dfe2e7}
        .look .pv.d{background:#16181c; border-color:#30353c}
        .look .pv.d b{background:#30353c}
        .look .pv b.a{width:40%}
        .look .pv.l b.a{background:#4f46e5}
        .look .pv.d b.a{background:#818cf8}

        }
