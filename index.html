<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mbactionplan.online | Simple, Focused Daily Productivity</title>

    <!--
        Security note: this is a purely client-side app (no backend, no accounts).
        The CSP below restricts the page to only the external hosts it actually
        needs (the pinned CDN libraries loaded below) as defense-in-depth against
        injected/rogue third-party scripts. Fonts are the system UI stack, so no
        font host is contacted. If you self-host the libraries, tighten this further.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';">

    <link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234f46e5'/><rect x='7' y='7' width='8' height='8' rx='1.5' fill='%23ffffff'/><rect x='17' y='7' width='8' height='8' rx='1.5' fill='%23ffffff' fill-opacity='.55'/><rect x='7' y='17' width='8' height='8' rx='1.5' fill='%23ffffff' fill-opacity='.55'/><rect x='17' y='17' width='8' height='8' rx='1.5' fill='%23ffffff' fill-opacity='.3'/></svg>" />

    <!-- Libraries are pinned to exact versions (not @latest) so the app can't change or break under you without notice. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        /* "Utility" theme mapped onto Tailwind:
           - slate  -> neutral desktop-software greys (shared across the app family)
           - sky    -> this app's accent (indigo). Driven by CSS vars so it shifts for dark mode.
           - radii, shadows, weights and motion flattened to the shared system. */
        const __apAccent = (n) => `rgb(var(--acc-${n}) / <alpha-value>)`;
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Segoe UI Variable Text"', '"Segoe UI"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
                        mono: ['ui-monospace', '"Cascadia Mono"', 'Consolas', '"SF Mono"', 'Menlo', 'monospace'],
                    },
                    fontWeight: { bold: '600', extrabold: '650' },
                    colors: {
                        slate: {
                            50: '#f6f7f9', 100: '#eceef2', 200: '#dfe2e7', 300: '#c6cbd3', 400: '#8e97a3',
                            500: '#5f6773', 600: '#48505c', 700: '#3a4049', 750: '#30353c', 800: '#2a2e34',
                            850: '#25292f', 900: '#1e2126', 950: '#16181c'
                        },
                        sky: {
                            50: __apAccent(50), 100: __apAccent(100), 200: __apAccent(200), 300: __apAccent(300), 400: __apAccent(400),
                            500: __apAccent(500), 600: __apAccent(600), 700: __apAccent(700), 800: __apAccent(800), 900: __apAccent(900), 950: __apAccent(950)
                        },
                        brand: { 500: __apAccent(500), 600: __apAccent(600), 700: __apAccent(700) }
                    },
                    borderRadius: {
                        DEFAULT: '4px', sm: '3px', md: '4px', lg: '6px', xl: '6px', '2xl': '6px', '3xl': '8px'
                    },
                    boxShadow: {
                        sm: '0 1px 2px rgba(20,24,31,.06)',
                        DEFAULT: '0 1px 2px rgba(20,24,31,.06)',
                        md: '0 1px 3px rgba(20,24,31,.10)',
                        lg: '0 4px 12px -4px rgba(20,24,31,.16)',
                        xl: '0 8px 24px -6px rgba(20,24,31,.22), 0 1px 3px rgba(20,24,31,.08)',
                        '2xl': '0 8px 24px -6px rgba(20,24,31,.22), 0 1px 3px rgba(20,24,31,.08)'
                    },
                    keyframes: {
                        'fade-in-up': { '0%': { opacity: '0', transform: 'translateY(3px)' }, '100%': { opacity: '1', transform: 'none' } },
                        'fade-in': { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        'toast-in': { '0%': { opacity: '0', transform: 'translateY(-4px)' }, '100%': { opacity: '1', transform: 'none' } },
                        'highlight-pulse': {
                            '0%, 100%': { boxShadow: '0 0 0 2px rgb(var(--acc-500))' },
                            '50%': { boxShadow: '0 0 0 4px rgb(var(--acc-500) / .45)' }
                        }
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.14s ease-out',
                        'fade-in': 'fade-in 0.12s ease-out',
                        'toast-in': 'toast-in 0.14s ease-out',
                        'highlight-pulse': 'highlight-pulse 1s ease-in-out 3'
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.8/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@1.47.0"></script>

    <style>
        /* ---- theme: "Utility" - neutral desktop-software palette, one indigo accent, light + dark ---- */
        :root{
            color-scheme:light;
            --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
            --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
            --r:6px; --r-sm:4px; --ctl:38px; --ctl-sm:32px; --ease:120ms ease;
            --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f6f7f9; --surface-3:#eceef2;
            --ink:#1b1f24; --ink-2:#48505c; --muted:#5f6773;
            --border:#dfe2e7; --border-strong:#c6cbd3;
            --accent:#4f46e5; --accent-hover:#4338ca; --accent-ink:#ffffff;
            --accent-soft:rgba(79,70,229,.09); --accent-line:rgba(79,70,229,.38);
            --good:#16a34a; --good-ink:#0b7a35; --warn:#e5a100; --warn-ink:#8a5a00; --crit:#c9302c;
            --shadow:0 1px 2px rgba(20,24,31,.06);
            --shadow-pop:0 8px 24px -6px rgba(20,24,31,.22),0 1px 3px rgba(20,24,31,.08);
            /* accent scale (RGB channels) consumed by Tailwind's "sky" palette */
            --acc-50:238 240 253; --acc-100:224 227 251; --acc-200:199 203 247; --acc-300:165 172 242;
            --acc-400:111 115 238; --acc-500:79 70 229; --acc-600:67 56 202; --acc-700:55 48 163;
            --acc-800:49 46 129; --acc-900:30 27 75; --acc-950:20 18 54;
        }
        .dark{
            color-scheme:dark;
            --bg:#16181c; --surface:#1e2126; --surface-2:#25292f; --surface-3:#2d3238;
            --ink:#e9ecf0; --ink-2:#b4bbc5; --muted:#8e97a3;
            --border:#30353c; --border-strong:#434a53;
            --accent:#818cf8; --accent-hover:#a5b4fc; --accent-ink:#0d0b2a;
            --accent-soft:rgba(129,140,248,.13); --accent-line:rgba(129,140,248,.45);
            --good:#22c55e; --good-ink:#4ade80; --warn:#f0b429; --warn-ink:#f5c95c; --crit:#ff6b6b;
            --shadow:0 1px 2px rgba(0,0,0,.3);
            --shadow-pop:0 10px 28px -6px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03);
            --acc-300:199 210 254; --acc-400:165 180 252; --acc-500:129 140 248; --acc-600:99 102 241; --acc-700:165 180 252;
        }

        body{font-family:var(--font);font-size:14px;line-height:1.45;background:var(--bg);color:var(--ink)}
        .font-mono{font-family:var(--mono)}
        ::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
        .tabular{font-variant-numeric:tabular-nums}

        ::-webkit-scrollbar{width:10px;height:10px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;border:3px solid var(--bg)}

        /* ---- focus: one visible accent ring everywhere ---- */
        button:focus, a:focus, select:focus, input:focus, textarea:focus, [tabindex]:focus{outline:none}
        button:focus-visible, a:focus-visible, [role="button"]:focus-visible, [role="tab"]:focus-visible, summary:focus-visible{
            outline:2px solid var(--accent)!important; outline-offset:1px;
        }

        /* ---- form controls (id selector outranks Tailwind utilities; horizontal padding left to markup) ---- */
        #root input[type=text], #root input[type=number], #root input[type=date], #root input[type=time],
        #root input[type=search], #root select, #root textarea{
            background-color:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-sm);
            color:var(--ink); font-size:14px; font-weight:400; box-shadow:none;
            transition:border-color var(--ease), box-shadow var(--ease);
        }
        #root input[type=text], #root input[type=number], #root input[type=date], #root input[type=time],
        #root input[type=search], #root select{min-height:var(--ctl); padding-top:0; padding-bottom:0}
        #root textarea{padding-top:8px; padding-bottom:8px; line-height:1.45}
        #root input:hover:not(:focus):not(:disabled), #root select:hover:not(:focus), #root textarea:hover:not(:focus){
            border-color:color-mix(in srgb,var(--ink) 35%,var(--border-strong));
        }
        #root input:focus, #root select:focus, #root textarea:focus{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
        #root input::placeholder, #root textarea::placeholder{color:var(--muted); opacity:.85}
        #root input[type=checkbox]{accent-color:var(--accent); width:16px; height:16px; margin:0; cursor:pointer}
        .dark input[type="date"]::-webkit-calendar-picker-indicator,
        .dark input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(.85); cursor:pointer}
        .fld-label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-2); margin-bottom:4px}
        .space-y-1\.5 > .fld-label, .space-y-1\.5 > div > .fld-label{margin-bottom:0}

        /* ---- buttons: primary / secondary / ghost / danger ---- */
        /* display lives in :where() so Tailwind's hidden / lg:inline-flex always win */
        :where(.btn){display:inline-flex}
        .btn{
            align-items:center; justify-content:center; gap:6px;
            min-height:var(--ctl); padding:0 14px; border-radius:var(--r-sm);
            font-size:13.5px; font-weight:600; line-height:1; white-space:nowrap; cursor:pointer;
            background:var(--surface); color:var(--ink); border:1px solid var(--border-strong);
            transition:background-color var(--ease), border-color var(--ease), color var(--ease);
        }
        .btn:hover{background:var(--surface-2); border-color:color-mix(in srgb,var(--ink) 30%,var(--border-strong))}
        .btn:active{background:var(--surface-3)}
        .btn.sm{min-height:var(--ctl-sm); padding:0 10px; font-size:13px}
        .btn.icon{padding:0; width:var(--ctl)}
        .btn.sm.icon{width:var(--ctl-sm)}
        .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
        .btn.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover)}
        .btn.primary:active{filter:brightness(.94)}
        .btn.success{background:var(--good); border-color:var(--good); color:#fff}
        .dark .btn.success{color:#06180d}
        .btn.success:hover{filter:brightness(.95)}
        .btn.danger{color:var(--crit); border-color:color-mix(in srgb,var(--crit) 45%,var(--border-strong)); background:var(--surface)}
        .btn.danger:hover{background:color-mix(in srgb,var(--crit) 8%,var(--surface)); border-color:var(--crit)}
        .btn.danger.solid{background:var(--crit); border-color:var(--crit); color:#fff}
        .dark .btn.danger.solid{color:#1a0505}
        .btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
        .btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
        .btn.ghost.danger:hover{background:color-mix(in srgb,var(--crit) 10%,transparent); color:var(--crit)}
        .btn:disabled, .btn:disabled:hover{background:var(--surface-2); border-color:var(--border); color:var(--muted); filter:none; cursor:not-allowed; opacity:.7}
        .btn.ghost:disabled{background:transparent; border-color:transparent}
        .btn.primary:disabled, .btn.danger.solid:disabled{background:var(--surface-3); border-color:var(--border); color:var(--muted)}
        .link{color:var(--accent); font-weight:600; font-size:13px}
        .link:hover{text-decoration:underline}

        /* ---- panels ---- */
        .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow)}
        .panel-h{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 14px; border-bottom:1px solid var(--border)}
        .panel-h h3{font-size:14px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:8px}
        .sect-t{font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
        .tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); padding:12px 14px}
        .tile .lbl{font-size:12px; font-weight:600; color:var(--ink-2)}
        .tile .val{font-size:22px; font-weight:650; letter-spacing:-.01em; margin-top:2px; color:var(--ink); font-variant-numeric:tabular-nums}
        .tile .note{font-size:12px; color:var(--muted)}
        .meter{height:8px; background:var(--surface-3); border-radius:2px; overflow:hidden}
        .meter > i{display:block; height:100%; background:var(--accent); border-radius:2px; transition:width .2s ease}
        .empty{padding:24px 16px; text-align:center; color:var(--muted); font-size:13.5px}
        .empty b{display:block; color:var(--ink); font-weight:600; margin-bottom:2px}
        .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; line-height:1; padding:3px 6px; border-radius:3px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2)}
        .swatch{display:inline-block; width:8px; height:8px; border-radius:2px; flex:none}

        /* ---- header nav: underline tabs ---- */
        .tabs button{position:relative; display:inline-flex; align-items:center; gap:7px; min-height:40px; padding:0 12px; font-size:13.5px; font-weight:500; color:var(--ink-2); border-radius:0; transition:background-color var(--ease), color var(--ease)}
        .tabs button:hover{background:var(--surface-2); color:var(--ink)}
        .tabs button[aria-current="page"], .tabs button[aria-selected="true"]{color:var(--accent); font-weight:600; box-shadow:inset 0 -2px 0 var(--accent)}
        .tabs button:focus-visible{outline-offset:-2px!important}

        /* ---- legacy helpers from the original build: keep hooks, drop the theatrics ---- */
        .card-lift{transition:border-color var(--ease), background-color var(--ease)}
        .card-lift:hover{border-color:var(--border-strong)}
        .btn-press{transition:background-color var(--ease), border-color var(--ease), color var(--ease)}

        .loader{width:28px; height:28px; border:3px solid var(--surface-3); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* ---- matrix: quadrants expand with their content; the page handles scrolling ---- */
        .matrix-grid{display:grid; grid-template-columns:minmax(0,1fr); gap:12px; align-items:stretch}
        .matrix-axis{display:none}
        @media (min-width:1024px){
            .matrix-grid{grid-template-columns:24px repeat(2,minmax(0,1fr)); grid-template-rows:auto 1fr 1fr; column-gap:12px; row-gap:12px}
            .matrix-axis{display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
            .matrix-axis.row{writing-mode:vertical-rl; transform:rotate(180deg)}
            .matrix-axis.col{margin-bottom:-4px}
        }
        .matrix-quad{min-height:180px; min-width:0; display:flex; flex-direction:column; overflow:visible; border-top:3px solid var(--qc,var(--border-strong))}
        .matrix-quad-body{flex:0 0 auto}

        /* ---- touch & small screens: 44px targets ---- */
        @media (pointer:coarse){
            :root{--ctl:44px; --ctl-sm:40px}
            .tabs button{min-height:44px}
        }
        /* touch screens have no hover: keep task quick-actions visible */
        @media (hover:none){
            .task-actions{position:static!important; opacity:1!important; align-self:flex-end; margin:2px -6px -6px 0; background:transparent!important; border-color:transparent!important; box-shadow:none!important}
            .task-actions button{padding:9px!important}
        }
        @media (prefers-reduced-motion:reduce){
            *{animation-duration:1ms!important; animation-iteration-count:1!important; transition-duration:1ms!important; scroll-behavior:auto!important}
        }
    </style>
</head>
<body class="h-full antialiased">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const COLOR_PRESETS = [
            { id: 'sky', label: 'Sky Blue', hex: '#38bdf8' },
            { id: 'emerald', label: 'Emerald', hex: '#34d399' },
            { id: 'violet', label: 'Violet', hex: '#a78bfa' },
            { id: 'amber', label: 'Amber', hex: '#f59e0b' },
            { id: 'rose', label: 'Rose', hex: '#fb7185' },
            { id: 'teal', label: 'Teal', hex: '#2dd4bf' },
            { id: 'fuchsia', label: 'Fuchsia', hex: '#e879f9' }
        ];

        const RECURRING_OPTIONS = [
            { value: 'none', label: 'Does not repeat' },
            { value: 'daily', label: 'Daily' },
            { value: 'weekdays', label: 'Every weekday (Mon–Fri)' },
            { value: 'weekends', label: 'Weekends (Sat–Sun)' },
            { value: 'weekly', label: 'Weekly' },
            { value: 'biweekly', label: 'Every 2 weeks' },
            { value: 'monthly', label: 'Monthly' },
            { value: 'bimonthly', label: 'Every 2 months' },
            { value: 'quarterly', label: 'Quarterly' },
            { value: 'semiannual', label: 'Every 6 months' },
            { value: 'yearly', label: 'Yearly' }
        ];

        // Fixed allow-list of icon names ever referenced in this app. Guards the innerHTML
        // assignment below against ever rendering anything other than a known icon tag,
        // even though `name` is always a hardcoded string from this codebase (never user input).
        const KNOWN_ICON_NAMES = new Set([
            'check', 'timer', 'pin', 'pin-off', 'copy', 'trash-2', 'x', 'calendar', 'repeat', 'plus',
            'layout-dashboard', 'folder-kanban', 'grid', 'search', 'upload', 'undo-2', 'redo-2', 'download',
            'sun', 'moon', 'menu', 'alert-circle', 'alert-triangle', 'info', 'check-circle-2', 'check-circle',
            'zap', 'arrow-left', 'arrow-up', 'edit-3', 'calendar-clock', 'users', 'calendar-days',
            'chevron-left', 'chevron-right', 'calendar-off', 'rotate-ccw', 'play', 'pause', 'share-2',
            'cookie', 'shield-check', 'file-text', 'scale'
        ]);

        function Icon({ name, className = "w-4 h-4", label, ...props }) {
            const spanRef = useRef(null);
            const safeName = KNOWN_ICON_NAMES.has(name) ? name : 'circle';
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${safeName}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: spanRef.current });
                }
            }, [safeName, className]);
            // Purely decorative by default (the parent button/label supplies the accessible name).
            // Pass `label` when the icon is the ONLY content conveying meaning.
            return (
                <span
                    ref={spanRef}
                    className="inline-flex items-center justify-center"
                    aria-hidden={label ? undefined : 'true'}
                    role={label ? 'img' : undefined}
                    aria-label={label || undefined}
                    {...props}
                ></span>
            );
        }

        // Closes a modal on Escape and, best-effort, returns keyboard focus to whatever
        // triggered it when it unmounts (basic modal accessibility, not a full focus trap).
        const useEscapeClose = (onClose) => {
            useEffect(() => {
                const triggerEl = document.activeElement;
                const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
                document.addEventListener('keydown', handleKey);
                return () => {
                    document.removeEventListener('keydown', handleKey);
                    if (triggerEl && typeof triggerEl.focus === 'function') {
                        try { triggerEl.focus(); } catch (e) {}
                    }
                };
            }, [onClose]);
        };

        const getLocalDateStr = (d = new Date()) => {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };

        const csvEscape = (val) => {
            let s = String(val ?? '')
                .replace(/\r\n/g, ' ')
                .replace(/[\r\n]/g, ' ')
                .replace(/"/g, '""');
            // CSV/formula-injection guard: if a spreadsheet app (Excel, Sheets, etc.) opens this
            // export and a field starts with =, +, -, @, or a tab/CR, it can be interpreted as a
            // formula. Prefix with a single quote so it's always treated as plain text.
            if (/^[=+\-@\t\r]/.test(s)) s = `'${s}`;
            return `"${s}"`;
        };

        // Undo the formula-injection guard prefix from csvEscape when re-importing our own
        // export, without touching a genuine leading apostrophe the user typed themselves.
        const stripCsvGuard = (raw) => {
            const s = String(raw ?? '');
            return /^'[=+\-@]/.test(s) ? s.slice(1) : s;
        };

        const normalizeImportDate = (raw) => {
            let s = String(raw ?? '').trim();
            if (!s) return '';
            s = s.replace(/^=\s*"?|"$/g, '').replace(/^'/, '').trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
            let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (m) {
                return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
            }
            m = s.match(/^(\d{1,2})[-.](\d{1,2})[-.](\d{4})$/);
            if (m) {
                return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
            }
            const d = new Date(s);
            if (!isNaN(d.getTime())) return getLocalDateStr(d);
            return '';
        };

        const normalizeImportTime = (raw) => {
            let s = String(raw ?? '').trim();
            if (!s) return '';
            s = s.replace(/^=\s*"?|"$/g, '').replace(/^'/, '').trim();
            let m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
            if (m) return `${m[1].padStart(2, '0')}:${m[2]}`;
            m = s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
            if (m) {
                let h = parseInt(m[1], 10);
                const min = m[2];
                const ap = m[3].toUpperCase();
                if (ap === 'PM' && h < 12) h += 12;
                if (ap === 'AM' && h === 12) h = 0;
                return `${String(h).padStart(2, '0')}:${min}`;
            }
            return s;
        };

        const playAlarmSound = (repeat = 3) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const playBeep = (freq, type, duration, startTime, volume = 0.3) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
                    gain.gain.setValueAtTime(volume, ctx.currentTime + startTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + startTime);
                    osc.stop(ctx.currentTime + startTime + duration);
                };
                for (let r = 0; r < repeat; r++) {
                    const offset = r * 0.8;
                    playBeep(880, 'triangle', 0.18, offset + 0.0, 0.35);
                    playBeep(1174.66, 'sine', 0.18, offset + 0.15, 0.4);
                    playBeep(1396.91, 'square', 0.2, offset + 0.3, 0.3);
                    playBeep(1760.00, 'sine', 0.35, offset + 0.48, 0.45);
                }
            } catch (e) {
                console.error("Audio playback error:", e);
            }
        };

        const getNextRecurringDate = (currentDateStr, recurringType) => {
            const base = currentDateStr ? new Date(currentDateStr + 'T12:00:00') : new Date();
            if (isNaN(base.getTime())) return getLocalDateStr();

            const advanceWeekday = (d) => {
                do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
            };
            const advanceWeekend = (d) => {
                do { d.setDate(d.getDate() + 1); } while (d.getDay() !== 0 && d.getDay() !== 6);
            };

            switch (recurringType) {
                case 'daily': base.setDate(base.getDate() + 1); break;
                case 'weekdays': advanceWeekday(base); break;
                case 'weekends': advanceWeekend(base); break;
                case 'weekly': base.setDate(base.getDate() + 7); break;
                case 'biweekly': base.setDate(base.getDate() + 14); break;
                case 'monthly': base.setMonth(base.getMonth() + 1); break;
                case 'bimonthly': base.setMonth(base.getMonth() + 2); break;
                case 'quarterly': base.setMonth(base.getMonth() + 3); break;
                case 'semiannual': base.setMonth(base.getMonth() + 6); break;
                case 'yearly': base.setFullYear(base.getFullYear() + 1); break;
                default: base.setDate(base.getDate() + 1);
            }
            return getLocalDateStr(base);
        };

        const parseCSVLine = (line) => {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
                    else inQuotes = !inQuotes;
                } else if (ch === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else current += ch;
            }
            result.push(current);
            return result;
        };

        const normalizeTask = (t) => ({
            ...t,
            status: t.status || 'Not Started',
            focusMinutes: t.focusMinutes || 0,
            isPinned: !!t.isPinned,
            recurring: t.recurring || 'none',
            color: t.color || '#38bdf8',
            dueTime: t.dueTime || '',
            quadrant: t.quadrant || 'do-first',
            category: t.category || 'General',
            dueDate: t.dueDate || '',
            description: t.description || '',
            title: t.title || 'Untitled'

        // ---------------- TASK CARD COMPONENT ----------------
        function TaskCard({ task, project, onClick, onTogglePin, onToggleComplete, onDuplicate, onDelete, highlighted }) {

                            className={`w-5 h-5 mt-0.5 shrink-0 rounded border-2 flex items-center justify-center transition btn-press ${task.status === 'Completed' ? 'bg-emerald-600 border-emerald-600' : 'border-slate-300 dark:border-slate-600 hover:border-emerald-500 hover:bg-emerald-50 dark:hover:bg-emerald-900/30'}`}

                            {task.status === 'Completed' && <Icon name="check" className="w-3 h-3 text-white" />}
                        </button>
                        <div className="flex-1 min-w-0">
                            <h4 className={`task-card-title text-sm font-semibold truncate pr-2 ${task.status === 'Completed' ? 'text-slate-400 line-through' : 'text-slate-900 dark:text-slate-100'}`}>
                                {task.title}
                            </h4>
                            {task.description && <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">{task.description}</p>}

                    </div>
                    
                    <div className="flex items-center flex-wrap gap-1.5 mt-2 pl-8 empty:hidden">
                        {project && (

                        {task.recurring && task.recurring !== 'none' && (
                            <span className="badge" title={`Recurs: ${task.recurring}`}>
                                <Icon name="repeat" className="w-3 h-3" /> {task.recurring}
                            </span>
                        )}
                    </div>
                    
                    {/* Action Menu - visible on hover AND on keyboard focus (focus-within) */}
                    <div className="task-actions absolute top-1.5 right-1.5 opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition flex items-center gap-0.5 bg-white dark:bg-slate-850 rounded p-0.5 border border-slate-200 dark:border-slate-750 shadow-md" onClick={e => e.stopPropagation()}>
                        {onTogglePin && (
                            <button onClick={onTogglePin} aria-label={task.isPinned ? `Unpin "${task.title}"` : `Pin "${task.title}"`} className={`p-1.5 rounded hover:bg-slate-100 dark:hover:bg-slate-750 btn-press ${task.isPinned ? 'text-sky-600 dark:text-sky-400' : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-100'}`} title={task.isPinned ? 'Unpin' : 'Pin'}>
                                <Icon name="pin" className="w-3.5 h-3.5" />
                            </button>

                        {onDuplicate && (
                            <button onClick={onDuplicate} aria-label={`Duplicate "${task.title}"`} className="p-1.5 rounded hover:bg-slate-100 dark:hover:bg-slate-750 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-100 btn-press" title="Duplicate">
                                <Icon name="copy" className="w-3.5 h-3.5" />

                            <button onClick={onDelete} aria-label={`Delete "${task.title}"`} className="p-1.5 rounded hover:bg-rose-50 dark:hover:bg-rose-950/40 text-slate-500 dark:text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 btn-press" title="Delete">
                                <Icon name="trash-2" className="w-3.5 h-3.5" />
                            </button>
                        )}

        }

        // ---------------- TASK MODAL ----------------
        function TaskModal({ task, projects, defaultProjectId, onClose, onOpenProjectModal, onSave, onDuplicate, onCompleteTask }) {

                if (task) return { ...task };

                    dueDate: getLocalDateStr(),
                    dueTime: '',
                    quadrant: 'do-first',

                    category: 'General',
                    isPinned: false

                const { name, value, type, checked } = e.target;

            return (
                <div className="fixed inset-0 z-50 bg-slate-950/45 dark:bg-black/60 flex items-center justify-center p-4 animate-fade-in" onClick={onClose}>

                                    </select>
                                </div>
                                <div className="space-y-1.5">
                                    <label htmlFor="task-quadrant-select" className="fld-label">Priority Quadrant</label>
                                    <select id="task-quadrant-select" name="quadrant" value={formData.quadrant} onChange={handleChange} className="w-full px-3">

                                        <option value="delegate">Delegate (Urgent, Not Important)</option>
                                        <option value="eliminate">Eliminate (Neither)</option>
                                    </select>
                                </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">

                                    <label htmlFor="task-due-date" className="fld-label">Due Date</label>

                                </div>
                                <div className="space-y-1.5">
                                    <label htmlFor="task-recurring-select" className="fld-label">Recurring</label>

                                    </select>

                            <div className="space-y-1.5">

        // ---------------- PROJECT MODAL ----------------

        // ---------------- LEGAL / PRIVACY MODAL ----------------
        // Written to describe exactly what this build of the app does - no server, no accounts,
        // no analytics, no ads. If you add any of those later, update this text to match.
        function LegalModal({ activeTab, setActiveTab, onClose }) {
            useEscapeClose(onClose);
            const titleId = 'legal-modal-title';
            const tabs = [
                { id: 'privacy', label: 'Privacy', icon: 'shield-check' },

            ];
            return (
                <div className="fixed inset-0 z-50 bg-slate-950/45 dark:bg-black/60 flex items-center justify-center p-4 animate-fade-in" onClick={onClose}>

                    >

                        </div>
                        <div className="flex-1 overflow-y-auto p-6 space-y-3 text-sm text-slate-700 dark:text-slate-300 leading-relaxed">
                            {activeTab === 'privacy' && (
                                <>
                                    <h3 className="font-bold text-slate-900 dark:text-slate-100">Privacy Policy</h3>
                                    <p className="text-xs text-slate-500">Last updated: this reflects how the app's code actually works, not a generic template.</p>
                                    <p>mbactionplan.online is a free, single-page tool. There is no server, no account system, and no database behind it. Specifically:</p>
                                    <p><strong>What's stored, and where.</strong> Your projects, tasks, focus-timer minutes, and theme choice are saved only in this browser's local storage, on this device. Nothing you type into a task or project is sent to us or to anyone else. We have no way to see your data - it never leaves your browser unless you export or share it yourself.</p>
                                    <p><strong>What does leave your device.</strong> When the page loads, your browser fetches a few third-party files needed to run the app: the React, Babel, Tailwind, and Lucide-icon libraries from unpkg.com and cdn.tailwindcss.com. (Text uses your device's built-in system fonts, so no font service is contacted.) Loading these tells those services your IP address and basic browser info, the same as visiting any website that uses them - they do not receive your tasks, projects, or any content you enter. We don't control those third parties' own practices.</p>
                                    <p><strong>Cookies and tracking.</strong> This app sets no cookies and includes no analytics, advertising, or tracking scripts of any kind.</p>
                                    <p><strong>Exporting and sharing.</strong> The Export button creates a CSV file from your data, either downloaded directly or handed to your device's native share sheet if you choose that option - that only goes wherever you personally direct it. Importing a CSV reads the file locally in your browser; it is never uploaded anywhere.</p>
                                    <p><strong>Deleting your data.</strong> The "Clear stored data" option permanently erases everything saved in this browser. Clearing your browser's site data, or using a different browser or device, will also mean your data isn't there - there is no backup copy anywhere else, so export a CSV first if you want one.</p>
                                    <p><strong>Sensitive information.</strong> Please don't enter passwords, Social Security numbers, credit card numbers, health information, or other highly sensitive data into task titles or notes. Nothing here is designed to store that kind of information securely.</p>
                                    <p><strong>Children.</strong> This app isn't directed at children and doesn't knowingly collect any information from anyone, of any age - it collects nothing at all in the sense of sending data to a server.</p>
                                    <p><strong>Changes.</strong> If this app is ever changed to add accounts, sync, or any server-side storage, this policy will be rewritten first to describe the new behavior accurately.</p>
                                </>
                            )}
                            {activeTab === 'terms' && (
                                <>
                                    <h3 className="font-bold text-slate-900 dark:text-slate-100">Terms of Use</h3>
                                    <p>By using mbactionplan.online, you agree to the following:</p>
                                    <p><strong>What this is.</strong> mbactionplan.online is a free personal productivity tool (task list, priority matrix, calendar, and focus timer) provided as-is by an individual developer, for ordinary personal or small-business organizational use.</p>
                                    <p><strong>No warranty.</strong> The app is provided "as is," without warranties of any kind, express or implied, including fitness for a particular purpose. It is not guaranteed to be error-free, uninterrupted, or permanently available, and it is not a substitute for professional project-management, scheduling, or record-keeping systems where reliability is critical.</p>
                                    <p><strong>Your responsibility.</strong> You are responsible for the content you enter and for backing up anything important using the Export feature. Because all data lives in your browser only, clearing site data, switching browsers or devices, or a browser bug can result in permanent data loss with no way for us to recover it.</p>
                                    <p><strong>Acceptable use.</strong> Don't use this app for any unlawful purpose, or to store or process content you don't have the right to store.</p>
                                    <p><strong>Intellectual property.</strong> The app's code and design belong to its developer. You're welcome to use the app itself for your own personal or business tasks; this doesn't grant you rights to copy, resell, or redistribute the underlying code as your own.</p>
                                    <p><strong>Changes and availability.</strong> This app may be updated, changed, or taken down at any time without notice, since it's offered free of charge with no service-level guarantee.</p>
                                    <p><strong>Contact.</strong> Questions about these terms can be directed to the developer through wherever you obtained this app.</p>
                                </>
                            )}
                            {activeTab === 'disclaimer' && (
                                <>
                                    <h3 className="font-bold text-slate-900 dark:text-slate-100">Disclaimer</h3>
                                    <p><strong>Not professional advice.</strong> mbactionplan.online is a general-purpose organizational tool. It does not provide medical, legal, financial, tax, or other professional advice, and nothing in the app should be relied on as such.</p>
                                    <p><strong>No data-safety guarantee.</strong> This app is not a certified or audited secure storage system. While it doesn't transmit your data anywhere on its own, "local-only" storage is not the same as "backed up" or "unhackable" - anyone with access to your unlocked device and browser could see the same data you can. Don't store highly sensitive information here.</p>
                                    <p><strong>Accuracy of calculations.</strong> Completion percentages, focus-time totals, and recurring-task dates are computed automatically from what you enter; they're provided for convenience and haven't been certified for any regulatory, billing, or compliance purpose.</p>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ---------------- MAIN APP ----------------
        function App() {
            const [isInitialLoading, setIsInitialLoading] = useState(true);
            const [theme, setTheme] = useState(() => localStorage.getItem('ap_theme_v5') || 'dark');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [highlightedTaskId, setHighlightedTaskId] = useState(null);
            const [selectedProjectId, setSelectedProjectId] = useState('all');
            const [selectedProjectDetail, setSelectedProjectDetail] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            const [cookieAccepted, setCookieAccepted] = useState(() => localStorage.getItem('cookie_accepted') === 'true');
            const [legalModalOpen, setLegalModalOpen] = useState(false);
            const [legalTab, setLegalTab] = useState('privacy');
            const [scrollProgress, setScrollProgress] = useState(0);
            const [showTopBtn, setShowTopBtn] = useState(false);
            const mainRef = useRef(null);

            const [projects, setProjects] = useState(() => {
                const saved = localStorage.getItem('ap_projects_v5') || localStorage.getItem('ap_projects_v4');
                if (saved) { try { return JSON.parse(saved); } catch (e) {} }
                return [
                    { id: 'p_1', name: 'Work & Projects', description: 'Core deliverables and daily tasks', status: 'Active', code: 'PRJ', color: '#38bdf8' },
                    { id: 'p_2', name: 'Personal & Life', description: 'Errands, health, and habits', status: 'Active', code: 'LIFE', color: '#34d399' }
                ];
            });

            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem('ap_tasks_v5') || localStorage.getItem('ap_tasks_v4');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        return Array.isArray(parsed) ? parsed.map(normalizeTask) : [];
                    } catch (e) {}
                }
                return [];
            });

            const [history, setHistory] = useState(() => [Array.isArray(tasks) ? tasks : []]);
            const [historyIndex, setHistoryIndex] = useState(0);
            const historyRef = useRef({ history: [Array.isArray(tasks) ? tasks : []], index: 0 });
            
            useEffect(() => { historyRef.current = { history, index: historyIndex }; }, [history, historyIndex]);

            const [taskModalOpen, setTaskModalOpen] = useState(false);
            const [currentTask, setCurrentTask] = useState(null);
            const [projectModalOpen, setProjectModalOpen] = useState(false);
            const [currentProject, setCurrentProject] = useState(null);
            const [shareModalOpen, setShareModalOpen] = useState(false);
            const [clearModalOpen, setClearModalOpen] = useState(false);
            const [clearConfirmText, setClearConfirmText] = useState('');
            const fileInputRef = useRef(null);

            const [isRunning, setIsRunning] = useState(false);
            const [pomoCycle, setPomoCycle] = useState(0);
            const [customMinutes, setCustomMinutes] = useState(25);
            const [timeLeft, setTimeLeft] = useState(25 * 60);
            const [selectedTaskId, setSelectedTaskId] = useState('');
            const [wakeLockEnabled, setWakeLockEnabled] = useState(false);
            const wakeLockSentinel = useRef(null);
            const isWorkPhase = pomoCycle % 2 === 0;
            const activeSecondCounterRef = useRef(0);

            // Initial Loading Timeout
            useEffect(() => {
                const timer = setTimeout(() => setIsInitialLoading(false), 150);
                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', theme === 'dark');
                localStorage.setItem('ap_theme_v5', theme);
            }, [theme]);

            useEffect(() => {
                localStorage.setItem('ap_projects_v5', JSON.stringify(projects));
            }, [projects]);

            const showToast = useCallback((message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            }, []);

            const updateTasksWithHistory = useCallback((newTasks, showToastMsg = null) => {
                const safe = Array.isArray(newTasks) ? newTasks.map(normalizeTask) : [];
                setHistory(prev => {
                    const idx = historyRef.current.index;
                    const next = prev.slice(0, idx + 1);
                    next.push(safe);
                    if (next.length > 50) next.shift();
                    const newIndex = next.length - 1;
                    historyRef.current = { history: next, index: newIndex };
                    setHistoryIndex(newIndex);
                    return next;
                });
                setTasks(safe);
                localStorage.setItem('ap_tasks_v5', JSON.stringify(safe));
                if (showToastMsg) showToast(showToastMsg);
            }, [showToast]);

            const handleUndo = useCallback(() => {
                const { history: h, index } = historyRef.current;
                if (index <= 0) return;
                const prevIndex = index - 1;
                const snapshot = Array.isArray(h[prevIndex]) ? h[prevIndex].map(normalizeTask) : [];
                historyRef.current = { history: h, index: prevIndex };
                setHistoryIndex(prevIndex);
                setTasks(snapshot);
                localStorage.setItem('ap_tasks_v5', JSON.stringify(snapshot));
                showToast('Action undone.', 'info');
            }, [showToast]);

            const handleRedo = useCallback(() => {
                const { history: h, index } = historyRef.current;
                if (index >= h.length - 1) return;
                const nextIndex = index + 1;
                const snapshot = Array.isArray(h[nextIndex]) ? h[nextIndex].map(normalizeTask) : [];
                historyRef.current = { history: h, index: nextIndex };
                setHistoryIndex(nextIndex);
                setTasks(snapshot);
                localStorage.setItem('ap_tasks_v5', JSON.stringify(snapshot));
                showToast('Action redone.', 'info');
            }, [showToast]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    const tag = (e.target.tagName || '').toLowerCase();
                    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                        e.preventDefault();
                        if (e.shiftKey) handleRedo();
                        else handleUndo();
                    } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                        e.preventDefault();
                        handleRedo();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleUndo, handleRedo]);

            // Escape closes whichever of the simple inline modals (not handled by useEscapeClose) is open.
            useEffect(() => {
                if (!shareModalOpen && !clearModalOpen) return;
                const handleEscape = (e) => {
                    if (e.key !== 'Escape') return;
                    if (shareModalOpen) setShareModalOpen(false);
                    if (clearModalOpen) { setClearModalOpen(false); setClearConfirmText(''); }
                };
                window.addEventListener('keydown', handleEscape);
                return () => window.removeEventListener('keydown', handleEscape);
            }, [shareModalOpen, clearModalOpen]);

            useEffect(() => {
                const requestWakeLock = async () => {
                    if ('wakeLock' in navigator && wakeLockEnabled) {
                        try {
                            wakeLockSentinel.current = await navigator.wakeLock.request('screen');
                        } catch (err) { console.error('Wake Lock error:', err); }
                    }
                };
                if (wakeLockEnabled) requestWakeLock();
                else if (wakeLockSentinel.current) {
                    wakeLockSentinel.current.release().catch(() => {});
                    wakeLockSentinel.current = null;
                }
                return () => { if (wakeLockSentinel.current) wakeLockSentinel.current.release().catch(() => {}); };
            }, [wakeLockEnabled]);

            // Scroll Handler
            const handleScroll = (e) => {
                const { scrollTop, scrollHeight, clientHeight } = e.target;
                const progress = (scrollTop / (scrollHeight - clientHeight)) * 100;
                setScrollProgress(progress || 0);
                setShowTopBtn(scrollTop > 200);
            };

            const scrollToTop = () => {
                if (mainRef.current) {
                    mainRef.current.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            const incrementTaskFocusTime = (taskId, addedMinutes = 1) => {
                if (!taskId) return;
                setTasks(prevTasks => {
                    const updated = prevTasks.map(t =>
                        t.id === taskId ? { ...t, focusMinutes: (t.focusMinutes || 0) + addedMinutes } : t
                    );
                    localStorage.setItem('ap_tasks_v5', JSON.stringify(updated));
                    setHistory(prevHistory => {
                        const newHistory = [...prevHistory];
                        const idx = historyRef.current.index;
                        if (idx >= 0 && idx < newHistory.length) newHistory[idx] = updated;
                        historyRef.current = { ...historyRef.current, history: newHistory };
                        return newHistory;
                    });
                    return updated;
                });
            };

            useEffect(() => {
                let interval = null;
                if (isRunning) {
                    interval = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                handleTimerCompletion();
                                return 0;
                            }
                            return prev - 1;
                        });
                        if (selectedTaskId && isWorkPhase) {
                            activeSecondCounterRef.current += 1;
                            if (activeSecondCounterRef.current >= 60) {
                                activeSecondCounterRef.current = 0;
                                incrementTaskFocusTime(selectedTaskId, 1);
                            }
                        }
                    }, 1000);
                } else {
                    activeSecondCounterRef.current = 0;
                }
                return () => clearInterval(interval);
            }, [isRunning, pomoCycle, isWorkPhase, selectedTaskId, customMinutes]);

            const handleTimerCompletion = () => {
                playAlarmSound(4);
                activeSecondCounterRef.current = 0;
                if (isWorkPhase) {
                    if (selectedTaskId) showToast('Focus session auto-logged to task!', 'success');
                    const nextCycle = (pomoCycle + 1) % 8;
                    setPomoCycle(nextCycle);
                    setTimeLeft(nextCycle === 7 ? 15 * 60 : 5 * 60);
                    showToast('Focus block finished! Time for a break.', 'success');
                } else {
                    showToast('Break complete! Ready for your next focus block.', 'success');
                    const nextCycle = (pomoCycle + 1) % 8;
                    setPomoCycle(nextCycle);
                    setTimeLeft(customMinutes * 60);
                }
            };

            const toggleTimer = () => setIsRunning(!isRunning);
            const resetTimer = () => {
                setIsRunning(false);
                activeSecondCounterRef.current = 0;
                setPomoCycle(0);
                setTimeLeft(customMinutes * 60);
            };
            const formatSeconds = (totalSecs) => {
                const mins = Math.floor(totalSecs / 60);
                const secs = totalSecs % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const handleDuplicateTask = (taskToDup) => {
                const dupTask = normalizeTask({
                    ...taskToDup,
                    id: 't_' + Math.random().toString(36).substring(2, 11),
                    title: `${taskToDup.title} (Copy)`,
                    status: 'Not Started',
                    focusMinutes: 0
                });
                updateTasksWithHistory([...tasks, dupTask], 'Task duplicated!');
            };

            const handleTogglePin = (taskId) => {
                const updated = tasks.map(t => t.id === taskId ? { ...t, isPinned: !t.isPinned } : t);
                updateTasksWithHistory(updated, 'Task pin updated.');
            };

            const handleToggleComplete = (taskId) => {
                const targetTask = tasks.find(t => t.id === taskId);
                if (!targetTask) return;
                const willComplete = targetTask.status !== 'Completed';
                if (willComplete && targetTask.recurring && targetTask.recurring !== 'none') {
                    const nextDate = getNextRecurringDate(targetTask.dueDate, targetTask.recurring);
                    const updatedTasks = tasks.map(t =>
                        t.id === taskId
                            ? { ...t, status: 'Not Started', dueDate: nextDate, isPinned: false }
                            : t
                    );
                    updateTasksWithHistory(updatedTasks, `Recurring task complete! Next due: ${nextDate}.`);
                } else {
                    const updatedTasks = tasks.map(t =>
                        t.id === taskId
                            ? {
                                ...t,
                                status: willComplete ? 'Completed' : 'Not Started',
                                isPinned: willComplete ? false : t.isPinned
                            }
                            : t
                    );
                    updateTasksWithHistory(updatedTasks, willComplete ? 'Task marked complete.' : 'Task restored.');
                }
            };

            const handleDashboardTaskClick = (taskId) => {
                setHighlightedTaskId(taskId);
                setActiveTab('tasks');
                setTimeout(() => {
                    const el = document.getElementById(`task-card-${taskId}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 150);
            };

            const handleDeleteProject = (projectId) => {
                if (!projectId) return;
                const name = projects.find(p => p.id === projectId)?.name || 'Project';
                const taskCount = tasks.filter(t => t.projectId === projectId).length;
                const warning = taskCount > 0
                    ? `Delete "${name}" and its ${taskCount} task${taskCount === 1 ? '' : 's'}? This can't be undone once you leave the app.`
                    : `Delete "${name}"?`;
                if (!window.confirm(warning)) return;
                setProjects(prev => prev.filter(p => p.id !== projectId));
                updateTasksWithHistory(
                    tasks.filter(t => t.projectId !== projectId),
                    `"${name}" and its tasks deleted.`
                );
                if (selectedProjectId === projectId) setSelectedProjectId('all');
                if (selectedProjectDetail?.id === projectId) setSelectedProjectDetail(null);
                setProjectModalOpen(false);
                setCurrentProject(null);
            };

            let filteredTasks = selectedProjectId === 'all'
                ? tasks
                : tasks.filter(t => t.projectId === selectedProjectId);

            // Apply Search Filtering
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase();
                filteredTasks = filteredTasks.filter(t => 
                    (t.title && t.title.toLowerCase().includes(q)) || 
                    (t.description && t.description.toLowerCase().includes(q))
                );
            }

            const generateCSVData = () => {
                let csv = 'RecordType,ID,ProjectId,Title,Description,QuadrantOrStatus,Category,DueDate,DueTime,FocusMins,Recurring,IsPinned,Color\n';
                projects.forEach(p => {
                    csv += [
                        'Project', csvEscape(p.id), csvEscape(''), csvEscape(p.name || ''),
                        csvEscape(p.description || ''), csvEscape(p.status || 'Active'),
                        csvEscape(p.code || ''), csvEscape(''), csvEscape(''), '0',
                        csvEscape('none'), 'false', csvEscape(p.color || '#38bdf8')
                    ].join(',') + '\n';
                });
                tasks.forEach(t => {
                    const quad = t.quadrant || 'do-first';
                    const statusStr = t.status === 'Completed' ? `Completed:${quad}` : quad;
                    csv += [
                        'Task', csvEscape(t.id), csvEscape(t.projectId || ''), csvEscape(t.title || ''),
                        csvEscape(t.description || ''), csvEscape(statusStr), csvEscape(t.category || ''),
                        csvEscape(t.dueDate || ''), csvEscape(t.dueTime || ''), String(t.focusMinutes || 0),
                        csvEscape(t.recurring || 'none'), t.isPinned ? 'true' : 'false', csvEscape(t.color || '#38bdf8')
                    ].join(',') + '\n';
                });
                return csv;
            };

            const exportCSVBlob = () => {
                const csv = generateCSVData();
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `Action_Plan_Backup_${getLocalDateStr()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 1000); // revoking immediately can cancel the download
                showToast('CSV backup downloaded.', 'success');
                setShareModalOpen(false);
            };

            const handleShareOrExport = async () => {
                const csvData = generateCSVData();
                const fileName = `Action_Plan_Backup_${getLocalDateStr()}.csv`;
                const file = new File([csvData], fileName, { type: 'text/csv' });
                // Desktop (mouse/trackpad): download directly. Windows Chrome/Edge claim file-share support
                // and would otherwise pop the OS share sheet instead of saving the file.
                const isTouchDevice = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
                if (!isTouchDevice) { exportCSVBlob(); return; }
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ title: 'mbactionplan.online Backup', text: 'mbactionplan.online productivity backup', files: [file] });
                        showToast('Backup shared successfully!', 'success');
                    } catch (err) {
                        if (err.name !== 'AbortError') setShareModalOpen(true);
                    }
                } else {
                    setShareModalOpen(true);
                }
            };

            const handleImportCSV = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const text = ev.target.result;
                        const lines = text.split(/\r?\n/).filter(l => l.trim());
                        if (lines.length < 2) { showToast('CSV appears empty.', 'error'); return; }
                        const importedProjects = [];
                        const importedTasks = [];
                        for (let i = 1; i < lines.length; i++) {
                            const cols = parseCSVLine(lines[i]);
                            if (cols.length < 2) continue;
                            const type = (cols[0] || '').trim();
                            if (type === 'Project') {
                                importedProjects.push({
                                    id: (cols[1] || ('p_' + Math.random().toString(36).slice(2, 9))).trim(),
                                    name: stripCsvGuard((cols[3] || 'Imported Project').trim()),
                                    description: stripCsvGuard((cols[4] || '').trim()),
                                    status: (cols[5] || 'Active').trim(),
                                    code: (cols[6] || 'IMP').trim(),
                                    color: (cols[12] || '#38bdf8').trim()
                                });
                            } else if (type === 'Task') {
                                const qOrS = (cols[5] || 'do-first').trim();
                                let isCompleted = false;
                                let quadrant = qOrS;
                                if (qOrS === 'Completed') { isCompleted = true; quadrant = 'do-first'; }
                                else if (qOrS.startsWith('Completed:')) { isCompleted = true; quadrant = qOrS.slice('Completed:'.length) || 'do-first'; }
                                const validQuads = ['do-first', 'schedule', 'delegate', 'eliminate'];
                                if (!validQuads.includes(quadrant)) quadrant = 'do-first';

                                importedTasks.push(normalizeTask({
                                    id: (cols[1] || ('t_' + Math.random().toString(36).slice(2, 9))).trim(),
                                    projectId: (cols[2] || '').trim(),
                                    title: stripCsvGuard((cols[3] || 'Imported Task').trim()),
                                    description: stripCsvGuard((cols[4] || '').trim()),
                                    quadrant: quadrant,
                                    status: isCompleted ? 'Completed' : 'Not Started',
                                    category: (cols[6] || 'General').trim(),
                                    dueDate: normalizeImportDate(cols[7]),
                                    dueTime: normalizeImportTime(cols[8]),
                                    focusMinutes: parseInt(cols[9], 10) || 0,
                                    recurring: (cols[10] || 'none').trim(),
                                    isPinned: String(cols[11]).toLowerCase() === 'true',
                                    color: (cols[12] || '#38bdf8').trim()
                                }));
                            }
                        }
                        if (importedProjects.length) {
                            setProjects(prev => {
                                const map = new Map(prev.map(p => [p.id, p]));
                                importedProjects.forEach(p => map.set(p.id, p));
                                return Array.from(map.values());
                            });
                        }
                        if (importedTasks.length) {
                            const map = new Map(tasks.map(t => [t.id, t]));
                            importedTasks.forEach(t => map.set(t.id, t));
                            updateTasksWithHistory(Array.from(map.values()), `Imported ${importedTasks.length} tasks, ${importedProjects.length} projects.`);
                        } else {
                            showToast(importedProjects.length ? `Imported ${importedProjects.length} projects.` : 'No valid records found.', importedProjects.length ? 'success' : 'error');
                        }
                    } catch (err) {
                        console.error(err);
                        showToast('Failed to parse CSV.', 'error');
                    }
                    if (fileInputRef.current) fileInputRef.current.value = '';
                };
                reader.readAsText(file);
            };

            const handleClearAllData = () => {
                if (clearConfirmText.trim().toUpperCase() !== 'CLEAR') return;
                localStorage.removeItem('ap_projects_v5');
                localStorage.removeItem('ap_tasks_v5');
                setProjects([]);
                updateTasksWithHistory([]);
                setSelectedProjectId('all');
                setSelectedTaskId('');
                setSelectedProjectDetail(null);
                setClearConfirmText('');
                setClearModalOpen(false);
                showToast('All saved data removed.', 'success');
            };

            if (isInitialLoading) {
                return (
                    <div className="h-full flex items-center justify-center flex-col gap-3">
                        <div className="loader"></div>
                        <p className="text-sm text-slate-500 dark:text-slate-400">Loading mbactionplan.online…</p>
                    </div>
                );
            }

            const NAV_TABS = [
                { id: 'dashboard', label: 'Dashboard', short: 'Home', icon: 'layout-dashboard' },
                { id: 'projects', label: 'Projects', short: 'Projects', icon: 'folder-kanban' },
                { id: 'tasks', label: 'Tasks Matrix', short: 'Matrix', icon: 'grid' },
                { id: 'calendar', label: 'Calendar', short: 'Calendar', icon: 'calendar' },
                { id: 'pomodoro', label: 'Focus Timer', short: 'Focus', icon: 'timer' }
            ];

            const canUndo = historyIndex > 0;
            const canRedo = historyIndex < history.length - 1;

            return (
                <div className="h-full flex flex-col relative overflow-hidden">
                    
                    {/* Scroll Progress Bar */}
                    <div className="fixed top-0 left-0 h-0.5 bg-sky-500 z-50" style={{ width: `${scrollProgress}%` }} aria-hidden="true"></div>

                    {/* Toast Notification */}
                    {toast && (
                        <div role="status" aria-live="polite" className={`fixed top-16 right-4 left-4 sm:left-auto z-50 sm:max-w-sm pl-3 pr-4 py-2.5 rounded-lg shadow-xl border border-l-[3px] text-sm font-medium flex items-center gap-2.5 animate-toast-in bg-white dark:bg-slate-850 text-slate-800 dark:text-slate-100 border-slate-200 dark:border-slate-750 ${
                            toast.type === 'error' ? '!border-l-rose-600 dark:!border-l-rose-400' :
                            toast.type === 'info' ? '!border-l-sky-500' :
                            '!border-l-emerald-600 dark:!border-l-emerald-400'
                        }`}>
                            <Icon name={toast.type === 'error' ? 'alert-circle' : toast.type === 'info' ? 'info' : 'check-circle-2'} className={`w-4 h-4 ${toast.type === 'error' ? 'text-rose-600 dark:text-rose-400' : toast.type === 'info' ? 'text-sky-600 dark:text-sky-400' : 'text-emerald-600 dark:text-emerald-400'}`} />
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* App bar */}
                    <header className="sticky top-0 z-40 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm">
                        <div className="max-w-7xl mx-auto px-3 sm:px-6 h-14 flex items-center gap-2 sm:gap-3">
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} aria-label={isMobileMenuOpen ? 'Close tools menu' : 'Open tools menu'} aria-expanded={isMobileMenuOpen} className="btn ghost icon lg:hidden -ml-1">
                                <Icon name={isMobileMenuOpen ? "x" : "menu"} className="w-4 h-4" />
                            </button>
                            <div className="flex items-center gap-2.5 min-w-0">
                                <svg viewBox="0 0 32 32" className="w-7 h-7 shrink-0" aria-hidden="true">
                                    <rect width="32" height="32" rx="6" className="fill-sky-500"/>
                                    <rect x="7" y="7" width="8" height="8" rx="1.5" className="fill-white dark:fill-slate-950"/>
                                    <rect x="17" y="7" width="8" height="8" rx="1.5" className="fill-white dark:fill-slate-950" fillOpacity=".55"/>
                                    <rect x="7" y="17" width="8" height="8" rx="1.5" className="fill-white dark:fill-slate-950" fillOpacity=".55"/>
                                    <rect x="17" y="17" width="8" height="8" rx="1.5" className="fill-white dark:fill-slate-950" fillOpacity=".3"/>
                                </svg>
                                <div className="min-w-0 leading-tight">
                                    <h1 className="text-[15px] font-bold text-slate-900 dark:text-slate-100 truncate">mbactionplan.online</h1>
                                    <p className="hidden xl:block whitespace-nowrap text-[11px] text-slate-500 dark:text-slate-400">Simple, focused daily productivity</p>
                                </div>
                            </div>

                            <div className="flex-1"></div>

                            {/* Full Site Search */}
                            <div className="relative hidden md:block">
                                <Icon name="search" className="w-4 h-4 absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
                                <input
                                    type="search"
                                    aria-label="Search tasks"
                                    placeholder="Search tasks…"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="pl-8 pr-3 w-44 lg:w-56"
                                    style={{ minHeight: 'var(--ctl-sm)' }}
                                />
                            </div>

                            <input ref={fileInputRef} type="file" accept=".csv,text/csv" className="hidden" onChange={handleImportCSV} />

                            <div className="hidden lg:flex items-center gap-0.5" role="group" aria-label="History">
                                <button onClick={handleUndo} disabled={!canUndo} aria-label="Undo" className="btn ghost sm icon" title="Undo (Ctrl+Z)">
                                    <Icon name="undo-2" className="w-4 h-4" />
                                </button>
                                <button onClick={handleRedo} disabled={!canRedo} aria-label="Redo" className="btn ghost sm icon" title="Redo (Ctrl+Y)">
                                    <Icon name="redo-2" className="w-4 h-4" />
                                </button>
                            </div>

                            <div className="hidden lg:block w-px h-6 bg-slate-200 dark:bg-slate-750" aria-hidden="true"></div>

                            <button onClick={() => fileInputRef.current?.click()} aria-label="Import CSV" className="btn sm hidden lg:inline-flex" title="Import CSV backup">
                                <Icon name="upload" className="w-4 h-4" />
                                <span>Import</span>
                            </button>
                            <button onClick={handleShareOrExport} aria-label="Export or share CSV backup" className="btn sm" title="Export / Share CSV backup">
                                <Icon name="download" className="w-4 h-4" />
                                <span className="hidden sm:inline">Export</span>
                            </button>
                            <button
                                onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                                aria-label={theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'}
                                className="btn ghost sm icon hidden sm:inline-flex"
                                title={theme === 'dark' ? 'Light theme' : 'Dark theme'}
                            >
                                <Icon name={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4" />
                            </button>
                            <button onClick={() => setClearModalOpen(true)} aria-label="Clear all stored data" className="btn ghost danger sm icon hidden lg:inline-flex" title="Clear stored data">
                                <Icon name="trash-2" className="w-4 h-4" />
                            </button>
                            <button onClick={() => { setCurrentTask(null); setTaskModalOpen(true); }} className="btn primary sm">
                                <Icon name="plus" className="w-4 h-4" />
                                <span>Add<span className="hidden sm:inline"> Task</span></span>
                            </button>
                        </div>

                        {/* Navigation (Desktop): underline tabs */}
                        <nav aria-label="Main" className="hidden lg:block">
                            <div className="tabs max-w-7xl mx-auto px-3 sm:px-6 flex -mb-px">
                                {NAV_TABS.map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} aria-current={activeTab === tab.id ? 'page' : undefined}>
                                        <Icon name={tab.icon} className="w-4 h-4" />
                                        <span>{tab.label}</span>
                                    </button>
                                ))}
                            </div>
                        </nav>

                        {/* Mobile tools menu (navigation lives in the bottom bar) */}
                        {isMobileMenuOpen && (
                            <div className="lg:hidden border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-3 sm:px-6 py-3 space-y-3 animate-fade-in">
                                <div className="relative md:hidden">
                                    <Icon name="search" className="w-4 h-4 absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
                                    <input
                                        type="search"
                                        aria-label="Search tasks"
                                        placeholder="Search tasks…"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full pl-8 pr-3"
                                    />
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={handleUndo} disabled={!canUndo} className="btn">
                                        <Icon name="undo-2" className="w-4 h-4" /> Undo
                                    </button>
                                    <button onClick={handleRedo} disabled={!canRedo} className="btn">
                                        <Icon name="redo-2" className="w-4 h-4" /> Redo
                                    </button>
                                    <button onClick={() => { fileInputRef.current?.click(); setIsMobileMenuOpen(false); }} className="btn">
                                        <Icon name="upload" className="w-4 h-4" /> Import CSV
                                    </button>
                                    <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="btn sm:hidden">
