<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Plan | Simple, Focused Daily Productivity</title>

    <!--
        Security note: this is a purely client-side app (no backend, no accounts).
        The CSP below restricts the page to only the external hosts it actually
        needs (Google Fonts + the pinned CDN libraries loaded below) as
        defense-in-depth against injected/rogue third-party scripts. If you
        self-host these libraries instead of using CDNs, tighten this further.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';">

    <link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23151c2c'/><rect x='6' y='6' width='9' height='9' rx='2.5' fill='%2338bdf8'/><rect x='17' y='6' width='9' height='9' rx='2.5' fill='%23818cf8'/><rect x='6' y='17' width='9' height='9' rx='2.5' fill='%2334d399'/><rect x='17' y='17' width='9' height='9' rx='2.5' fill='%23f59e0b'/><circle cx='16' cy='16' r='2' fill='%23e2e8f0'/></svg>" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Libraries are pinned to exact versions (not @latest) so the app can't change or break under you without notice. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        slate: {
                            950: '#0b0f19',
                            900: '#111827',
                            850: '#151c2c',
                            800: '#1e293b',
                            750: '#26334d',
                            700: '#334155',
                            400: '#94a3b8',
                            300: '#cbd5e1',
                            200: '#e2e8f0',
                        },
                        brand: {
                            500: '#38bdf8',
                            600: '#0284c7',
                            700: '#0369a1'
                        }
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': { opacity: '0', transform: 'translateY(8px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        'fade-in': {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        'toast-in': {
                            '0%': { opacity: '0', transform: 'translateX(24px) scale(0.96)' },
                            '100%': { opacity: '1', transform: 'translateX(0) scale(1)' }
                        },
                        'check-pop': {
                            '0%': { transform: 'scale(0.6)' },
                            '60%': { transform: 'scale(1.15)' },
                            '100%': { transform: 'scale(1)' }
                        },
                        'highlight-pulse': {
                            '0%, 100%': { boxShadow: '0 0 0 2px #38bdf8, 0 0 20px rgba(56,189,248,0.5)' },
                            '50%': { boxShadow: '0 0 0 4px #38bdf8, 0 0 30px rgba(56,189,248,0.8)' }
                        }
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.35s ease-out',
                        'fade-in': 'fade-in 0.5s ease-out',
                        'toast-in': 'toast-in 0.35s cubic-bezier(0.16, 1, 0.3, 1)',
                        'check-pop': 'check-pop 0.3s ease-out',
                        'highlight-pulse': 'highlight-pulse 1.8s ease-in-out 3'
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.8/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@1.47.0"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }

        button:focus, button:focus-visible, a:focus, select:focus, input:focus, textarea:focus, [tabindex]:focus {
            outline: none !important;
        }
        button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
            box-shadow: 0 0 0 2px #0b0f19, 0 0 0 4px rgba(56, 189, 248, 0.5);
        }

        input[type="date"], input[type="time"] {
            color: #0f172a !important;
            background-color: #f8fafc !important;
            border: 1px solid #cbd5e1 !important;
            padding-right: 0.5rem;
        }
        .dark input[type="date"], .dark input[type="time"] {
            color-scheme: dark;
            color: #f8fafc !important;
            background-color: #1e293b !important;
            border: 1px solid #334155 !important;
        }
        .dark input[type="date"]::-webkit-calendar-picker-indicator,
        .dark input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.9) brightness(1.2);
            cursor: pointer;
            opacity: 1 !important;
        }

        .card-lift {
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .card-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -12px rgba(0,0,0,0.15);
        }
        .dark .card-lift:hover {
            box-shadow: 0 12px 28px -12px rgba(0,0,0,0.35);
        }
        .btn-press {
            transition: transform 0.12s ease, background-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
        }
        .btn-press:active { transform: scale(0.96); }
        .btn-press:hover { filter: brightness(1.1); }

        /* Loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        .dark .loader { border: 3px solid #1e293b; border-top: 3px solid #38bdf8; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Matrix: quadrants expand with their content; the page handles scrolling */
        .matrix-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            align-items: start;
        }
        @media (min-width: 1024px) {
            .matrix-grid {
                grid-template-columns: 1fr 1fr;
                grid-auto-rows: auto;
            }
        }

        .matrix-quad {
            min-height: 220px;
            display: flex;
            flex-direction: column;
            overflow: visible;
        }

        .matrix-quad-body {
            flex: 0 0 auto; /* never shrink below its cards */
        }

    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-300 antialiased selection:bg-sky-500/20 selection:text-sky-700 dark:selection:text-sky-300 transition-colors duration-300">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const COLOR_PRESETS = [
            { id: 'sky', label: 'Sky Blue', hex: '#38bdf8' },
            { id: 'emerald', label: 'Emerald', hex: '#34d399' },
            { id: 'violet', label: 'Violet', hex: '#a78bfa' },
            { id: 'amber', label: 'Amber', hex: '#f59e0b' },
            { id: 'rose', label: 'Rose', hex: '#fb7185' },
            { id: 'teal', label: 'Teal', hex: '#2dd4bf' },
            { id: 'fuchsia', label: 'Fuchsia', hex: '#e879f9' }
        ];

        const RECURRING_OPTIONS = [
            { value: 'none', label: 'Does not repeat' },
            { value: 'daily', label: 'Daily' },
            { value: 'weekdays', label: 'Every weekday (Mon–Fri)' },
            { value: 'weekends', label: 'Weekends (Sat–Sun)' },
            { value: 'weekly', label: 'Weekly' },
            { value: 'biweekly', label: 'Every 2 weeks' },
            { value: 'monthly', label: 'Monthly' },
            { value: 'bimonthly', label: 'Every 2 months' },
            { value: 'quarterly', label: 'Quarterly' },
            { value: 'semiannual', label: 'Every 6 months' },
            { value: 'yearly', label: 'Yearly' }
        ];

        // Fixed allow-list of icon names ever referenced in this app. Guards the innerHTML
        // assignment below against ever rendering anything other than a known icon tag,
        // even though `name` is always a hardcoded string from this codebase (never user input).
        const KNOWN_ICON_NAMES = new Set([
            'check', 'timer', 'pin', 'pin-off', 'copy', 'trash-2', 'x', 'calendar', 'repeat', 'plus',
            'layout-dashboard', 'folder-kanban', 'grid', 'search', 'upload', 'undo-2', 'redo-2', 'download',
            'sun', 'moon', 'menu', 'alert-circle', 'alert-triangle', 'info', 'check-circle-2', 'check-circle',
            'zap', 'arrow-left', 'arrow-up', 'edit-3', 'calendar-clock', 'users', 'calendar-days',
            'chevron-left', 'chevron-right', 'calendar-off', 'rotate-ccw', 'play', 'pause', 'share-2',
            'cookie', 'shield-check', 'file-text', 'scale'
        ]);

        function Icon({ name, className = "w-4 h-4", label, ...props }) {
            const spanRef = useRef(null);
            const safeName = KNOWN_ICON_NAMES.has(name) ? name : 'circle';
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${safeName}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: spanRef.current });
                }
            }, [safeName, className]);
            // Purely decorative by default (the parent button/label supplies the accessible name).
            // Pass `label` when the icon is the ONLY content conveying meaning.
            return (
                <span
                    ref={spanRef}
                    className="inline-flex items-center justify-center"
                    aria-hidden={label ? undefined : 'true'}
                    role={label ? 'img' : undefined}
                    aria-label={label || undefined}
                    {...props}
                ></span>
            );
        }

        // Closes a modal on Escape and, best-effort, returns keyboard focus to whatever
        // triggered it when it unmounts (basic modal accessibility, not a full focus trap).
        const useEscapeClose = (onClose) => {
            useEffect(() => {
                const triggerEl = document.activeElement;
                const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
                document.addEventListener('keydown', handleKey);
                return () => {
                    document.removeEventListener('keydown', handleKey);
                    if (triggerEl && typeof triggerEl.focus === 'function') {
                        try { triggerEl.focus(); } catch (e) {}
                    }
                };
            }, [onClose]);
        };

        const getLocalDateStr = (d = new Date()) => {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };

        const csvEscape = (val) => {
            let s = String(val ?? '')
                .replace(/\r\n/g, ' ')
                .replace(/[\r\n]/g, ' ')
                .replace(/"/g, '""');
            // CSV/formula-injection guard: if a spreadsheet app (Excel, Sheets, etc.) opens this
            // export and a field starts with =, +, -, @, or a tab/CR, it can be interpreted as a
            // formula. Prefix with a single quote so it's always treated as plain text.
            if (/^[=+\-@\t\r]/.test(s)) s = `'${s}`;
            return `"${s}"`;
        };

        // Undo the formula-injection guard prefix from csvEscape when re-importing our own
        // export, without touching a genuine leading apostrophe the user typed themselves.
        const stripCsvGuard = (raw) => {
            const s = String(raw ?? '');
            return /^'[=+\-@]/.test(s) ? s.slice(1) : s;
        };

        const normalizeImportDate = (raw) => {
            let s = String(raw ?? '').trim();
            if (!s) return '';
            s = s.replace(/^=\s*"?|"$/g, '').replace(/^'/, '').trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
            let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (m) {
                return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
            }
            m = s.match(/^(\d{1,2})[-.](\d{1,2})[-.](\d{4})$/);
            if (m) {
                return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
            }
            const d = new Date(s);
            if (!isNaN(d.getTime())) return getLocalDateStr(d);
            return '';
        };

        const normalizeImportTime = (raw) => {
            let s = String(raw ?? '').trim();
            if (!s) return '';
            s = s.replace(/^=\s*"?|"$/g, '').replace(/^'/, '').trim();
            let m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
            if (m) return `${m[1].padStart(2, '0')}:${m[2]}`;
            m = s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
            if (m) {
                let h = parseInt(m[1], 10);
                const min = m[2];
                const ap = m[3].toUpperCase();
                if (ap === 'PM' && h < 12) h += 12;
                if (ap === 'AM' && h === 12) h = 0;
                return `${String(h).padStart(2, '0')}:${min}`;
            }
            return s;
        };

        const playAlarmSound = (repeat = 3) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const playBeep = (freq, type, duration, startTime, volume = 0.3) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
                    gain.gain.setValueAtTime(volume, ctx.currentTime + startTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + startTime);
                    osc.stop(ctx.currentTime + startTime + duration);
                };
                for (let r = 0; r < repeat; r++) {
                    const offset = r * 0.8;
                    playBeep(880, 'triangle', 0.18, offset + 0.0, 0.35);
                    playBeep(1174.66, 'sine', 0.18, offset + 0.15, 0.4);
                    playBeep(1396.91, 'square', 0.2, offset + 0.3, 0.3);
                    playBeep(1760.00, 'sine', 0.35, offset + 0.48, 0.45);
                }
            } catch (e) {
                console.error("Audio playback error:", e);
            }
        };

        function InteractiveBackground({ theme }) {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let width = (canvas.width = window.innerWidth);
                let height = (canvas.height = window.innerHeight);

                const handleResize = () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', handleResize);

                const particles = Array.from({ length: 45 }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    size: Math.random() * 2.5 + 1,
                    alpha: Math.random() * 0.5 + 0.2
                }));

                let mouseX = -1000, mouseY = -1000;
                const handleMouseMove = (e) => { mouseX = e.clientX; mouseY = e.clientY; };
                window.addEventListener('mousemove', handleMouseMove);

                const colorBase = theme === 'light' ? '14, 165, 233' : '56, 189, 248';

                const render = () => {
                    ctx.clearRect(0, 0, width, height);
                    particles.forEach((p, idx) => {
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < 0 || p.x > width) p.vx *= -1;
                        if (p.y < 0 || p.y > height) p.vy *= -1;
                        const dx = p.x - mouseX, dy = p.y - mouseY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120 && dist > 0) {
                            p.x += (dx / dist) * 1.5;
                            p.y += (dy / dist) * 1.5;
                        }
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${colorBase}, ${p.alpha})`;
                        ctx.fill();
                        for (let j = idx + 1; j < particles.length; j++) {
                            const p2 = particles[j];
                            const pdx = p.x - p2.x, pdy = p.y - p2.y;
                            const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
                            if (pdist < 110) {
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.strokeStyle = `rgba(${colorBase}, ${(1 - pdist / 110) * 0.18})`;
                                ctx.lineWidth = 0.8;
                                ctx.stroke();
                            }
                        }
                    });
                    animationFrameId = requestAnimationFrame(render);
                };
                render();
                return () => {
                    cancelAnimationFrame(animationFrameId);
                    window.removeEventListener('resize', handleResize);
                    window.removeEventListener('mousemove', handleMouseMove);
                };
            }, [theme]);

            return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-80" />;
        }

        const getNextRecurringDate = (currentDateStr, recurringType) => {
            const base = currentDateStr ? new Date(currentDateStr + 'T12:00:00') : new Date();
            if (isNaN(base.getTime())) return getLocalDateStr();

            const advanceWeekday = (d) => {
                do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
            };
            const advanceWeekend = (d) => {
                do { d.setDate(d.getDate() + 1); } while (d.getDay() !== 0 && d.getDay() !== 6);
            };

            switch (recurringType) {
                case 'daily': base.setDate(base.getDate() + 1); break;
                case 'weekdays': advanceWeekday(base); break;
                case 'weekends': advanceWeekend(base); break;
                case 'weekly': base.setDate(base.getDate() + 7); break;
                case 'biweekly': base.setDate(base.getDate() + 14); break;
                case 'monthly': base.setMonth(base.getMonth() + 1); break;
                case 'bimonthly': base.setMonth(base.getMonth() + 2); break;
                case 'quarterly': base.setMonth(base.getMonth() + 3); break;
                case 'semiannual': base.setMonth(base.getMonth() + 6); break;
                case 'yearly': base.setFullYear(base.getFullYear() + 1); break;
                default: base.setDate(base.getDate() + 1);
            }
            return getLocalDateStr(base);
        };

        const parseCSVLine = (line) => {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
                    else inQuotes = !inQuotes;
                } else if (ch === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else current += ch;
            }
            result.push(current);
            return result;
        };

        const normalizeTask = (t) => ({
            ...t,
            status: t.status || 'Not Started',
            focusMinutes: t.focusMinutes || 0,
            isPinned: !!t.isPinned,
            recurring: t.recurring || 'none',
            color: t.color || '#38bdf8',
            dueTime: t.dueTime || '',
            quadrant: t.quadrant || 'do-first',
            category: t.category || 'General',
            dueDate: t.dueDate || '',
            description: t.description || '',
            title: t.title || 'Untitled'
        });

        // ---------------- TASK CARD COMPONENT ----------------
        function TaskCard({ task, project, onClick, onTogglePin, onToggleComplete, onDuplicate, onDelete, highlighted }) {
            return (
                <div
                    id={`task-card-${task.id}`}
                    role="button"
                    tabIndex={0}
                    aria-label={`Open task: ${task.title}`}
                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); } }}
                    className={`relative bg-white dark:bg-slate-800 p-4 rounded-xl border ${highlighted ? 'animate-highlight-pulse border-sky-500' : 'border-slate-200 dark:border-slate-700'} hover:shadow-md transition card-lift group focus-within:shadow-md cursor-pointer flex flex-col`}
                    onClick={onClick}
                >
                    <div className="flex items-start gap-3">
                        <button
                            onClick={(e) => { e.stopPropagation(); onToggleComplete(); }}
                            aria-label={task.status === 'Completed' ? `Mark "${task.title}" as not started` : `Mark "${task.title}" as complete`}
                            className="w-5 h-5 mt-0.5 shrink-0 rounded border-2 border-slate-300 dark:border-slate-600 hover:border-emerald-500 hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center justify-center transition btn-press"
                        >
                            {task.status === 'Completed' && <Icon name="check" className="w-3 h-3 text-emerald-500" />}
                        </button>
                        <div className="flex-1 min-w-0">
                            <h4 className={`text-sm font-bold truncate ${task.status === 'Completed' ? 'text-slate-400 line-through' : 'text-slate-900 dark:text-slate-100'}`}>
                                {task.title}
                            </h4>
                            {task.description && <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">{task.description}</p>}
                        </div>
                    </div>
                    
                    <div className="flex items-center flex-wrap gap-2 mt-3 pl-8">
                        {project && (
                            <span className="text-[10px] font-bold px-1.5 py-0.5 rounded border uppercase flex items-center gap-1" style={{ color: project.color || '#38bdf8', borderColor: `${project.color || '#38bdf8'}40`, backgroundColor: `${project.color || '#38bdf8'}10` }}>
                                {project.code}
                            </span>
                        )}
                        {task.dueDate && (
                            <span className={`text-[10px] font-semibold px-1.5 py-0.5 rounded flex items-center gap-1 bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400`}>
                                <Icon name="calendar" className="w-3 h-3" /> {task.dueDate}
                            </span>
                        )}
                        {task.focusMinutes > 0 && (
                            <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded flex items-center gap-1 bg-sky-50 dark:bg-sky-900/30 text-sky-600 dark:text-sky-400">
                                <Icon name="timer" className="w-3 h-3" /> {task.focusMinutes}m
                            </span>
                        )}
                        {task.recurring && task.recurring !== 'none' && (
                            <Icon name="repeat" className="w-3.5 h-3.5 text-sky-500" title={`Recurs: ${task.recurring}`} />
                        )}
                    </div>
                    
                    {/* Action Menu — visible on hover AND on keyboard focus (focus-within) */}

        // ---------------- TASK MODAL ----------------
        function TaskModal({ task, projects, defaultProjectId, onClose, onOpenProjectModal, onSave, onDuplicate, onCompleteTask }) {
            useEscapeClose(onClose);
            const titleId = 'task-modal-title';

                if (task) return { ...task };
                return {
                    title: '',
                    description: '',
                    projectId: defaultProjectId !== 'all' ? defaultProjectId : (projects[0]?.id || ''),
                    dueDate: getLocalDateStr(),
                    dueTime: '',
                    quadrant: 'do-first',
                    recurring: 'none',
                    category: 'General',
                    isPinned: false
                };
            });

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.title.trim()) return;
                onSave(formData);
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/40 dark:bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" onClick={onClose}>

                                        <Icon name="copy" className="w-4 h-4" />
                                    </button>
                                )}
                                <button onClick={onClose} aria-label="Close" className="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition btn-press">
                                    <Icon name="x" className="w-5 h-5" />
                                </button>
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="flex-1 overflow-y-auto p-5 space-y-5">
                            <div className="space-y-1.5">
                                <label htmlFor="task-title-input" className="text-xs font-bold text-slate-600 dark:text-slate-400">Task Title</label>
                                <input id="task-title-input" autoFocus type="text" name="title" value={formData.title} onChange={handleChange} placeholder="What needs to be done?" required className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-semibold focus:border-sky-500 text-slate-900 dark:text-slate-100" />
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div className="space-y-1.5">
                                    <div className="flex justify-between items-center">
                                        <label htmlFor="task-project-select" className="text-xs font-bold text-slate-600 dark:text-slate-400">Project</label>
                                        <button type="button" onClick={onOpenProjectModal} className="text-[10px] font-bold text-sky-500 hover:underline">New Project</button>
                                    </div>
                                    <select id="task-project-select" name="projectId" value={formData.projectId} onChange={handleChange} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm font-semibold focus:border-sky-500">
                                        <option value="">No Project</option>
                                        {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                    </select>
                                </div>
                                <div className="space-y-1.5">
                                    <label htmlFor="task-quadrant-select" className="text-xs font-bold text-slate-600 dark:text-slate-400">Priority Quadrant</label>
                                    <select id="task-quadrant-select" name="quadrant" value={formData.quadrant} onChange={handleChange} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm font-semibold focus:border-sky-500">
                                        <option value="do-first">Do First (Urgent & Important)</option>
                                        <option value="schedule">Schedule (Important, Not Urgent)</option>
                                        <option value="delegate">Delegate (Urgent, Not Important)</option>
                                        <option value="eliminate">Eliminate (Neither)</option>
                                    </select>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                <div className="space-y-1.5">

                                </div>
                                <div className="space-y-1.5">
                                    <label htmlFor="task-due-time" className="text-xs font-bold text-slate-600 dark:text-slate-400">Time (Optional)</label>

                                </div>
                                <div className="space-y-1.5">
                                    <label htmlFor="task-recurring-select" className="text-xs font-bold text-slate-600 dark:text-slate-400">Recurring</label>
                                    <select id="task-recurring-select" name="recurring" value={formData.recurring} onChange={handleChange} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm font-semibold focus:border-sky-500">
                                        {RECURRING_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                    </select>
                                </div>
                            </div>

                            <div className="space-y-1.5">
                                <label htmlFor="task-description" className="text-xs font-bold text-slate-600 dark:text-slate-400">Description / Notes</label>

                                <p className="text-[11px] text-slate-400 dark:text-slate-500">This is saved only in your browser. Avoid entering passwords, SSNs, card numbers, or other highly sensitive information.</p>
                            </div>

                            <label className="flex items-center gap-3 cursor-pointer group">
                                <div className={`w-6 h-6 rounded border-2 flex items-center justify-center transition-colors ${formData.isPinned ? 'bg-sky-500 border-sky-500' : 'border-slate-300 dark:border-slate-600 group-hover:border-sky-400'}`}>

                                <button onClick={handleSubmit} className="px-5 py-2.5 rounded-xl text-sm font-bold bg-sky-500 text-white hover:bg-sky-600 shadow-lg shadow-sky-500/20 btn-press">Save Task</button>
                            </div>
                        </div>
                    </div>
                </div>

        // ---------------- PROJECT MODAL ----------------
        function ProjectModal({ project, onClose, onSave, onDelete }) {
            useEscapeClose(onClose);
            const titleId = 'project-modal-title';
            const [formData, setFormData] = useState(() => {
                if (project) return { ...project };
                return { name: '', description: '', code: '', color: '#38bdf8', status: 'Active' };

                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.name.trim()) return;
                if (!formData.code.trim()) formData.code = formData.name.substring(0, 3).toUpperCase();
                onSave(formData);
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/40 dark:bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" onClick={onClose}>
                    <div role="dialog" aria-modal="true" aria-labelledby={titleId} onClick={(e) => e.stopPropagation()} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-lg shadow-2xl animate-fade-in-up">
                        <div className="flex items-center justify-between p-5 border-b border-slate-200 dark:border-slate-800">

                        </div>

                        <form onSubmit={handleSubmit} className="p-5 space-y-5">

                                <input id="project-name-input" autoFocus type="text" name="name" value={formData.name} onChange={handleChange} required className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-semibold focus:border-sky-500" />
                            </div>

                            <div className="grid grid-cols-2 gap-5">

                                </div>
                                <div className="space-y-1.5">
                                    <label htmlFor="project-status-select" className="text-xs font-bold text-slate-600 dark:text-slate-400">Status</label>

                                        <option value="Active">Active</option>
                                        <option value="Archived">Archived</option>
                                    </select>
                                </div>
                            </div>

                            <div className="space-y-1.5">

                                        <button type="button" key={c.id} onClick={() => setFormData({ ...formData, color: c.hex })} aria-pressed={formData.color === c.hex} aria-label={c.label} className={`w-8 h-8 rounded-full border-2 transition btn-press ${formData.color === c.hex ? 'border-slate-900 dark:border-white scale-110' : 'border-transparent'}`} style={{ backgroundColor: c.hex }} title={c.label} />
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-1.5">
                                <label htmlFor="project-description" className="text-xs font-bold text-slate-600 dark:text-slate-400">Description</label>

                            </div>
                        </form>

                        <div className="p-5 border-t border-slate-200 dark:border-slate-800 flex justify-between gap-3 bg-slate-50 dark:bg-slate-900/50 rounded-b-3xl">

                                </button>

                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ---------------- MAIN APP ----------------
        function App() {

            const [toast, setToast] = useState(null);

            const [selectedProjectId, setSelectedProjectId] = useState('all');
            const [selectedProjectDetail, setSelectedProjectDetail] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            const [cookieAccepted, setCookieAccepted] = useState(() => localStorage.getItem('cookie_accepted') === 'true');
            const [legalModalOpen, setLegalModalOpen] = useState(false);
            const [legalTab, setLegalTab] = useState('privacy');
            const [scrollProgress, setScrollProgress] = useState(0);
            const [showTopBtn, setShowTopBtn] = useState(false);
            const mainRef = useRef(null);

            const [projects, setProjects] = useState(() => {
                const saved = localStorage.getItem('ap_projects_v5') || localStorage.getItem('ap_projects_v4');
                if (saved) { try { return JSON.parse(saved); } catch (e) {} }
                return [
                    { id: 'p_1', name: 'Work & Projects', description: 'Core deliverables and daily tasks', status: 'Active', code: 'PRJ', color: '#38bdf8' },
                    { id: 'p_2', name: 'Personal & Life', description: 'Errands, health, and habits', status: 'Active', code: 'LIFE', color: '#34d399' }
                ];
            });

            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem('ap_tasks_v5') || localStorage.getItem('ap_tasks_v4');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        return Array.isArray(parsed) ? parsed.map(normalizeTask) : [];
                    } catch (e) {}
                }
                return [];
            });

            const [history, setHistory] = useState(() => [Array.isArray(tasks) ? tasks : []]);
            const [historyIndex, setHistoryIndex] = useState(0);
            const historyRef = useRef({ history: [Array.isArray(tasks) ? tasks : []], index: 0 });
            
            useEffect(() => { historyRef.current = { history, index: historyIndex }; }, [history, historyIndex]);

            const [taskModalOpen, setTaskModalOpen] = useState(false);
            const [currentTask, setCurrentTask] = useState(null);
            const [projectModalOpen, setProjectModalOpen] = useState(false);
            const [currentProject, setCurrentProject] = useState(null);
            const [shareModalOpen, setShareModalOpen] = useState(false);
            const [clearModalOpen, setClearModalOpen] = useState(false);
            const [clearConfirmText, setClearConfirmText] = useState('');
            const fileInputRef = useRef(null);

            const [isRunning, setIsRunning] = useState(false);
            const [pomoCycle, setPomoCycle] = useState(0);
            const [customMinutes, setCustomMinutes] = useState(25);
            const [timeLeft, setTimeLeft] = useState(25 * 60);
            const [selectedTaskId, setSelectedTaskId] = useState('');
            const [wakeLockEnabled, setWakeLockEnabled] = useState(false);
            const wakeLockSentinel = useRef(null);
            const isWorkPhase = pomoCycle % 2 === 0;
            const activeSecondCounterRef = useRef(0);

            // Initial Loading Timeout
            useEffect(() => {
                const timer = setTimeout(() => setIsInitialLoading(false), 600);
                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', theme === 'dark');
                localStorage.setItem('ap_theme_v5', theme);
            }, [theme]);

            useEffect(() => {
                localStorage.setItem('ap_projects_v5', JSON.stringify(projects));
            }, [projects]);

            const showToast = useCallback((message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            }, []);

            const updateTasksWithHistory = useCallback((newTasks, showToastMsg = null) => {
                const safe = Array.isArray(newTasks) ? newTasks.map(normalizeTask) : [];
                setHistory(prev => {
                    const idx = historyRef.current.index;
                    const next = prev.slice(0, idx + 1);
                    next.push(safe);
                    if (next.length > 50) next.shift();
                    const newIndex = next.length - 1;
                    historyRef.current = { history: next, index: newIndex };
                    setHistoryIndex(newIndex);
                    return next;
                });
                setTasks(safe);
                localStorage.setItem('ap_tasks_v5', JSON.stringify(safe));
                if (showToastMsg) showToast(showToastMsg);
            }, [showToast]);

            const handleUndo = useCallback(() => {
                const { history: h, index } = historyRef.current;
                if (index <= 0) return;
                const prevIndex = index - 1;
                const snapshot = Array.isArray(h[prevIndex]) ? h[prevIndex].map(normalizeTask) : [];
                historyRef.current = { history: h, index: prevIndex };
                setHistoryIndex(prevIndex);
                setTasks(snapshot);
                localStorage.setItem('ap_tasks_v5', JSON.stringify(snapshot));
                showToast('Action undone.', 'info');
            }, [showToast]);

            const handleRedo = useCallback(() => {
                const { history: h, index } = historyRef.current;
                if (index >= h.length - 1) return;
                const nextIndex = index + 1;
                const snapshot = Array.isArray(h[nextIndex]) ? h[nextIndex].map(normalizeTask) : [];
                historyRef.current = { history: h, index: nextIndex };
                setHistoryIndex(nextIndex);
                setTasks(snapshot);
                localStorage.setItem('ap_tasks_v5', JSON.stringify(snapshot));
                showToast('Action redone.', 'info');
            }, [showToast]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    const tag = (e.target.tagName || '').toLowerCase();
                    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                        e.preventDefault();
                        if (e.shiftKey) handleRedo();
                        else handleUndo();
                    } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                        e.preventDefault();
                        handleRedo();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleUndo, handleRedo]);

            // Escape closes whichever of the simple inline modals (not handled by useEscapeClose) is open.
            useEffect(() => {
                if (!shareModalOpen && !clearModalOpen) return;
                const handleEscape = (e) => {
                    if (e.key !== 'Escape') return;
                    if (shareModalOpen) setShareModalOpen(false);
                    if (clearModalOpen) { setClearModalOpen(false); setClearConfirmText(''); }
                };
                window.addEventListener('keydown', handleEscape);
                return () => window.removeEventListener('keydown', handleEscape);
            }, [shareModalOpen, clearModalOpen]);

            useEffect(() => {
                const requestWakeLock = async () => {
                    if ('wakeLock' in navigator && wakeLockEnabled) {
                        try {
                            wakeLockSentinel.current = await navigator.wakeLock.request('screen');
                        } catch (err) { console.error('Wake Lock error:', err); }
                    }
                };
                if (wakeLockEnabled) requestWakeLock();
                else if (wakeLockSentinel.current) {
                    wakeLockSentinel.current.release().catch(() => {});
                    wakeLockSentinel.current = null;
                }
                return () => { if (wakeLockSentinel.current) wakeLockSentinel.current.release().catch(() => {}); };
            }, [wakeLockEnabled]);

            // Scroll Handler
            const handleScroll = (e) => {
                const { scrollTop, scrollHeight, clientHeight } = e.target;
                const progress = (scrollTop / (scrollHeight - clientHeight)) * 100;
                setScrollProgress(progress || 0);
                setShowTopBtn(scrollTop > 200);
            };

            const scrollToTop = () => {
                if (mainRef.current) {
                    mainRef.current.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            const incrementTaskFocusTime = (taskId, addedMinutes = 1) => {
                if (!taskId) return;
                setTasks(prevTasks => {
                    const updated = prevTasks.map(t =>
                        t.id === taskId ? { ...t, focusMinutes: (t.focusMinutes || 0) + addedMinutes } : t
                    );
                    localStorage.setItem('ap_tasks_v5', JSON.stringify(updated));
                    setHistory(prevHistory => {
                        const newHistory = [...prevHistory];
                        const idx = historyRef.current.index;
                        if (idx >= 0 && idx < newHistory.length) newHistory[idx] = updated;
                        historyRef.current = { ...historyRef.current, history: newHistory };
                        return newHistory;
                    });
                    return updated;
                });
            };

            useEffect(() => {
                let interval = null;
                if (isRunning) {
                    interval = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                handleTimerCompletion();
                                return 0;
                            }
                            return prev - 1;
                        });
                        if (selectedTaskId && isWorkPhase) {
                            activeSecondCounterRef.current += 1;
                            if (activeSecondCounterRef.current >= 60) {
                                activeSecondCounterRef.current = 0;
                                incrementTaskFocusTime(selectedTaskId, 1);
                            }
                        }
                    }, 1000);
                } else {
                    activeSecondCounterRef.current = 0;
                }
                return () => clearInterval(interval);
            }, [isRunning, pomoCycle, isWorkPhase, selectedTaskId, customMinutes]);

            const handleTimerCompletion = () => {
                playAlarmSound(4);
                activeSecondCounterRef.current = 0;
                if (isWorkPhase) {
                    if (selectedTaskId) showToast('Focus session auto-logged to task!', 'success');
                    const nextCycle = (pomoCycle + 1) % 8;
                    setPomoCycle(nextCycle);
                    setTimeLeft(nextCycle === 7 ? 15 * 60 : 5 * 60);
                    showToast('Focus block finished! Time for a break.', 'success');
                } else {
                    showToast('Break complete! Ready for your next focus block.', 'success');
                    const nextCycle = (pomoCycle + 1) % 8;
                    setPomoCycle(nextCycle);
                    setTimeLeft(customMinutes * 60);
                }
            };

            const toggleTimer = () => setIsRunning(!isRunning);
            const resetTimer = () => {
                setIsRunning(false);
                activeSecondCounterRef.current = 0;
                setPomoCycle(0);
                setTimeLeft(customMinutes * 60);
            };
            const formatSeconds = (totalSecs) => {
                const mins = Math.floor(totalSecs / 60);
                const secs = totalSecs % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const handleDuplicateTask = (taskToDup) => {
                const dupTask = normalizeTask({
                    ...taskToDup,
                    id: 't_' + Math.random().toString(36).substring(2, 11),
                    title: `${taskToDup.title} (Copy)`,
                    status: 'Not Started',
                    focusMinutes: 0
                });
                updateTasksWithHistory([...tasks, dupTask], 'Task duplicated!');
            };

            const handleTogglePin = (taskId) => {
                const updated = tasks.map(t => t.id === taskId ? { ...t, isPinned: !t.isPinned } : t);
                updateTasksWithHistory(updated, 'Task pin updated.');
            };

            const handleToggleComplete = (taskId) => {
                const targetTask = tasks.find(t => t.id === taskId);
                if (!targetTask) return;
                const willComplete = targetTask.status !== 'Completed';
                if (willComplete && targetTask.recurring && targetTask.recurring !== 'none') {
                    const nextDate = getNextRecurringDate(targetTask.dueDate, targetTask.recurring);
                    const updatedTasks = tasks.map(t =>
                        t.id === taskId
                            ? { ...t, status: 'Not Started', dueDate: nextDate, isPinned: false }
                            : t
                    );
                    updateTasksWithHistory(updatedTasks, `Recurring task complete! Next due: ${nextDate}.`);
                } else {
                    const updatedTasks = tasks.map(t =>
                        t.id === taskId
                            ? {
                                ...t,
                                status: willComplete ? 'Completed' : 'Not Started',
                                isPinned: willComplete ? false : t.isPinned
                            }
                            : t
                    );
                    updateTasksWithHistory(updatedTasks, willComplete ? 'Task marked complete.' : 'Task restored.');
                }
            };

            const handleDashboardTaskClick = (taskId) => {
                setHighlightedTaskId(taskId);
                setActiveTab('tasks');
                setTimeout(() => {
                    const el = document.getElementById(`task-card-${taskId}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 150);
            };

            const handleDeleteProject = (projectId) => {
                if (!projectId) return;
                const name = projects.find(p => p.id === projectId)?.name || 'Project';
                const taskCount = tasks.filter(t => t.projectId === projectId).length;
                const warning = taskCount > 0
                    ? `Delete "${name}" and its ${taskCount} task${taskCount === 1 ? '' : 's'}? This can't be undone once you leave the app.`
                    : `Delete "${name}"?`;
                if (!window.confirm(warning)) return;
                setProjects(prev => prev.filter(p => p.id !== projectId));
                updateTasksWithHistory(
                    tasks.filter(t => t.projectId !== projectId),
                    `"${name}" and its tasks deleted.`
                );
                if (selectedProjectId === projectId) setSelectedProjectId('all');
                if (selectedProjectDetail?.id === projectId) setSelectedProjectDetail(null);
                setProjectModalOpen(false);
                setCurrentProject(null);
            };

            let filteredTasks = selectedProjectId === 'all'
                ? tasks
                : tasks.filter(t => t.projectId === selectedProjectId);

            // Apply Search Filtering
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase();
                filteredTasks = filteredTasks.filter(t => 
                    (t.title && t.title.toLowerCase().includes(q)) || 
                    (t.description && t.description.toLowerCase().includes(q))
                );
            }

            const generateCSVData = () => {
                let csv = 'RecordType,ID,ProjectId,Title,Description,QuadrantOrStatus,Category,DueDate,DueTime,FocusMins,Recurring,IsPinned,Color\n';
                projects.forEach(p => {
                    csv += [
                        'Project', csvEscape(p.id), csvEscape(''), csvEscape(p.name || ''),
                        csvEscape(p.description || ''), csvEscape(p.status || 'Active'),
                        csvEscape(p.code || ''), csvEscape(''), csvEscape(''), '0',
                        csvEscape('none'), 'false', csvEscape(p.color || '#38bdf8')
                    ].join(',') + '\n';
                });
                tasks.forEach(t => {
                    const quad = t.quadrant || 'do-first';
                    const statusStr = t.status === 'Completed' ? `Completed:${quad}` : quad;
                    csv += [
                        'Task', csvEscape(t.id), csvEscape(t.projectId || ''), csvEscape(t.title || ''),
                        csvEscape(t.description || ''), csvEscape(statusStr), csvEscape(t.category || ''),
                        csvEscape(t.dueDate || ''), csvEscape(t.dueTime || ''), String(t.focusMinutes || 0),
                        csvEscape(t.recurring || 'none'), t.isPinned ? 'true' : 'false', csvEscape(t.color || '#38bdf8')
                    ].join(',') + '\n';
                });
                return csv;
            };

            const exportCSVBlob = () => {
                const csv = generateCSVData();
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `Action_Plan_Backup_${getLocalDateStr()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 1000); // revoking immediately can cancel the download
                showToast('CSV backup downloaded.', 'success');
                setShareModalOpen(false);
            };

            const handleShareOrExport = async () => {
                const csvData = generateCSVData();
                const fileName = `Action_Plan_Backup_${getLocalDateStr()}.csv`;
                const file = new File([csvData], fileName, { type: 'text/csv' });
                // Desktop (mouse/trackpad): download directly. Windows Chrome/Edge claim file-share support
                // and would otherwise pop the OS share sheet instead of saving the file.
                const isTouchDevice = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
                if (!isTouchDevice) { exportCSVBlob(); return; }
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ title: 'Action Plan Backup', text: 'Action Plan productivity backup', files: [file] });
                        showToast('Backup shared successfully!', 'success');
                    } catch (err) {
                        if (err.name !== 'AbortError') setShareModalOpen(true);
                    }
                } else {
                    setShareModalOpen(true);
                }
            };

            const handleImportCSV = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const text = ev.target.result;
                        const lines = text.split(/\r?\n/).filter(l => l.trim());
                        if (lines.length < 2) { showToast('CSV appears empty.', 'error'); return; }
                        const importedProjects = [];
                        const importedTasks = [];
                        for (let i = 1; i < lines.length; i++) {
                            const cols = parseCSVLine(lines[i]);
                            if (cols.length < 2) continue;
                            const type = (cols[0] || '').trim();
                            if (type === 'Project') {
                                importedProjects.push({
                                    id: (cols[1] || ('p_' + Math.random().toString(36).slice(2, 9))).trim(),
                                    name: stripCsvGuard((cols[3] || 'Imported Project').trim()),
                                    description: stripCsvGuard((cols[4] || '').trim()),
                                    status: (cols[5] || 'Active').trim(),
                                    code: (cols[6] || 'IMP').trim(),
                                    color: (cols[12] || '#38bdf8').trim()
                                });
                            } else if (type === 'Task') {
                                const qOrS = (cols[5] || 'do-first').trim();
                                let isCompleted = false;
                                let quadrant = qOrS;
                                if (qOrS === 'Completed') { isCompleted = true; quadrant = 'do-first'; }
                                else if (qOrS.startsWith('Completed:')) { isCompleted = true; quadrant = qOrS.slice('Completed:'.length) || 'do-first'; }
                                const validQuads = ['do-first', 'schedule', 'delegate', 'eliminate'];
                                if (!validQuads.includes(quadrant)) quadrant = 'do-first';

                                importedTasks.push(normalizeTask({
                                    id: (cols[1] || ('t_' + Math.random().toString(36).slice(2, 9))).trim(),
                                    projectId: (cols[2] || '').trim(),
                                    title: stripCsvGuard((cols[3] || 'Imported Task').trim()),
                                    description: stripCsvGuard((cols[4] || '').trim()),
                                    quadrant: quadrant,
                                    status: isCompleted ? 'Completed' : 'Not Started',
                                    category: (cols[6] || 'General').trim(),
                                    dueDate: normalizeImportDate(cols[7]),
                                    dueTime: normalizeImportTime(cols[8]),
                                    focusMinutes: parseInt(cols[9], 10) || 0,
                                    recurring: (cols[10] || 'none').trim(),
                                    isPinned: String(cols[11]).toLowerCase() === 'true',
                                    color: (cols[12] || '#38bdf8').trim()
                                }));
                            }
                        }
                        if (importedProjects.length) {
                            setProjects(prev => {
                                const map = new Map(prev.map(p => [p.id, p]));
                                importedProjects.forEach(p => map.set(p.id, p));
                                return Array.from(map.values());
                            });
                        }
                        if (importedTasks.length) {
                            const map = new Map(tasks.map(t => [t.id, t]));
                            importedTasks.forEach(t => map.set(t.id, t));
                            updateTasksWithHistory(Array.from(map.values()), `Imported ${importedTasks.length} tasks, ${importedProjects.length} projects.`);
                        } else {
                            showToast(importedProjects.length ? `Imported ${importedProjects.length} projects.` : 'No valid records found.', importedProjects.length ? 'success' : 'error');
                        }
                    } catch (err) {
                        console.error(err);
                        showToast('Failed to parse CSV.', 'error');
                    }
                    if (fileInputRef.current) fileInputRef.current.value = '';
                };
                reader.readAsText(file);
            };

            const handleClearAllData = () => {
                if (clearConfirmText.trim().toUpperCase() !== 'CLEAR') return;
                localStorage.removeItem('ap_projects_v5');
                localStorage.removeItem('ap_tasks_v5');
                setProjects([]);
                updateTasksWithHistory([]);
                setSelectedProjectId('all');
                setSelectedTaskId('');
                setSelectedProjectDetail(null);
                setClearConfirmText('');
                setClearModalOpen(false);
                showToast('All saved data removed.', 'success');
            };

            if (isInitialLoading) {
                return (
                    <div className="h-full flex items-center justify-center flex-col bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
                        <div className="loader mb-4"></div>
                        <h2 className="text-sm font-bold text-slate-500 animate-pulse">Loading Action Plan...</h2>
                    </div>
                );
            }

            const canUndo = historyIndex > 0;
            const canRedo = historyIndex < history.length - 1;

            return (
                <div className="h-full flex flex-col relative overflow-hidden transition-colors duration-300 animate-fade-in">
                    <InteractiveBackground theme={theme} />
                    
                    {/* Scroll Progress Bar */}
                    <div className="fixed top-0 left-0 h-1 bg-sky-500 z-50 transition-all duration-75" style={{ width: `${scrollProgress}%` }}></div>

                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed top-16 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl border text-xs font-semibold flex items-center space-x-2 animate-toast-in ${
                            toast.type === 'error' ? 'bg-rose-100 border-rose-300 text-rose-800 dark:bg-rose-950/90 dark:border-rose-800 dark:text-rose-200' :
                            toast.type === 'info' ? 'bg-indigo-100 border-indigo-300 text-indigo-800 dark:bg-indigo-950/90 dark:border-indigo-800 dark:text-indigo-200' :
                            'bg-white border-slate-200 text-slate-800 dark:bg-slate-850 dark:border-slate-700 dark:text-slate-200'
                        }`}>
                            <Icon name={toast.type === 'error' ? 'alert-circle' : toast.type === 'info' ? 'info' : 'check-circle-2'} className="w-4 h-4 text-sky-500" />
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* Sticky Header */}
                    <header className="sticky top-0 z-40 backdrop-blur-xl bg-white/85 dark:bg-slate-900/85 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 py-3 flex items-center justify-between flex-wrap gap-3 shadow-sm transition-colors duration-300">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} aria-label={isMobileMenuOpen ? 'Close menu' : 'Open menu'} aria-expanded={isMobileMenuOpen} className="lg:hidden h-9 w-9 shrink-0 flex items-center justify-center rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition btn-press">
                                <Icon name={isMobileMenuOpen ? "x" : "menu"} className="w-4 h-4 text-slate-700 dark:text-slate-300" />
                            </button>
                            <div className="flex items-center space-x-3">
                                <div className="w-9 h-9 shrink-0 rounded-xl bg-slate-50 dark:bg-slate-850 border border-slate-200 dark:border-slate-750 p-1 flex items-center justify-center shadow-md">
                                    <svg viewBox="0 0 32 32" className="w-full h-full">
                                        <rect width="32" height="32" rx="8" className="fill-slate-900 dark:fill-[#151c2c]"/>
                                        <rect x="6" y="6" width="9" height="9" rx="2.5" fill="#38bdf8"/>
                                        <rect x="17" y="6" width="9" height="9" rx="2.5" fill="#818cf8"/>
                                        <rect x="6" y="17" width="9" height="9" rx="2.5" fill="#34d399"/>
                                        <rect x="17" y="17" width="9" height="9" rx="2.5" fill="#f59e0b"/>
                                        <circle cx="16" cy="16" r="2" fill="#e2e8f0"/>
                                    </svg>
                                </div>
                                <div className="hidden xs:block sm:block">
                                    <h1 className="text-base font-extrabold tracking-tight text-slate-900 dark:text-slate-200 leading-none">Action Plan</h1>
                                    <p className="hidden md:block text-[11px] font-medium text-slate-500 dark:text-slate-400 mt-1">Simple, Focused Daily Productivity</p>
                                </div>
                            </div>
                            <button
                                onClick={() => { setCurrentTask(null); setTaskModalOpen(true); }}
                                className="hidden sm:flex h-9 shrink-0 items-center justify-center gap-1.5 bg-sky-500 hover:bg-sky-600 text-white px-3.5 rounded-xl text-xs font-bold shadow-md shadow-sky-500/20 transition-all btn-press"
                            >
                                <Icon name="plus" className="w-4 h-4" />
                                <span>Add Task</span>
                            </button>
                        </div>

                        {/* Navigation (Desktop) */}
                        <nav aria-label="Main" className="hidden lg:flex lg:order-last lg:basis-full items-center gap-1 bg-slate-100 dark:bg-slate-950/80 p-1 rounded-xl border border-slate-200 dark:border-slate-800">
                            {[
                                { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                                { id: 'projects', label: 'Projects', icon: 'folder-kanban' },
                                { id: 'tasks', label: 'Tasks', icon: 'grid' },
                                { id: 'calendar', label: 'Calendar', icon: 'calendar' },
                                { id: 'pomodoro', label: 'Focus Timer', icon: 'timer' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    aria-current={activeTab === tab.id ? 'page' : undefined}
                                    className={`flex-1 h-8 flex items-center justify-center gap-2 px-3 rounded-lg text-xs font-semibold transition-all btn-press ${
                                        activeTab === tab.id
                                            ? 'bg-white text-slate-900 dark:bg-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 shadow-sm'
                                            : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-900 border border-transparent'
                                    }`}
                                >
                                    <Icon name={tab.icon} className="w-3.5 h-3.5" />
                                    <span>{tab.label}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="flex items-center gap-2 justify-end flex-1">
                            {/* Full Site Search */}
                            <div className="relative hidden md:block">
                                <Icon name="search" className="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" />
                                <input
                                    type="text"
                                    aria-label="Search tasks"
                                    placeholder="Search tasks..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="h-9 pl-9 pr-4 rounded-xl bg-slate-100 dark:bg-slate-850 border border-slate-200 dark:border-slate-750 text-xs font-semibold focus:border-sky-500 w-48 transition-all"
                                />
                            </div>

                            <input ref={fileInputRef} type="file" accept=".csv,text/csv" className="hidden" onChange={handleImportCSV} />
                            
                            <div className="h-9 items-center gap-0.5 bg-slate-100 dark:bg-slate-850 border border-slate-200 dark:border-slate-750 px-0.5 rounded-xl hidden sm:flex">
                                <button
                                    onClick={handleUndo}
                                    disabled={!canUndo}
                                    aria-label="Undo"
                                    className={`h-7 w-7 flex items-center justify-center rounded-lg transition btn-press ${canUndo ? 'text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700' : 'text-slate-400 dark:text-slate-600 cursor-not-allowed'}`}
                                    title="Undo (Ctrl+Z)"
                                >
                                    <Icon name="undo-2" className="w-3.5 h-3.5" />
                                </button>
                                <button
                                    onClick={handleRedo}
                                    disabled={!canRedo}
                                    aria-label="Redo"
                                    className={`h-7 w-7 flex items-center justify-center rounded-lg transition btn-press ${canRedo ? 'text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700' : 'text-slate-400 dark:text-slate-600 cursor-not-allowed'}`}
                                    title="Redo (Ctrl+Y)"
                                >
                                    <Icon name="redo-2" className="w-3.5 h-3.5" />
                                </button>
                            </div>

                            <button
                                onClick={() => fileInputRef.current?.click()}
                                aria-label="Import CSV"
                                className="hidden sm:flex h-9 min-w-9 items-center justify-center gap-1.5 px-2.5 rounded-xl bg-slate-100 dark:bg-slate-850 border border-slate-200 dark:border-slate-750 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition btn-press"
                                title="Import CSV"
                            >
                                <Icon name="upload" className="w-3.5 h-3.5" />
                                <span className="hidden md:inline">Import</span>
                            </button>

                            <div className="flex items-center gap-2">
                                <button
                                    onClick={handleShareOrExport}
                                    aria-label="Export or share CSV backup"
                                    className="h-9 min-w-9 px-2.5 flex items-center justify-center gap-1.5 rounded-xl bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold shadow-sm shadow-sky-500/20 transition btn-press"
                                    title="Export / Share CSV"
                                >
                                    <Icon name="download" className="w-3.5 h-3.5" />
                                    <span className="hidden md:inline">Export</span>
                                </button>

                                <button
                                    onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                                    aria-label={theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'}
                                    className="h-9 w-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-850 border border-slate-200 dark:border-slate-750 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition btn-press"
                                    title="Toggle Theme"
                                >
                                    <Icon name={theme === 'dark' ? 'sun' : 'moon'} className="w-3.5 h-3.5" />
                                </button>

                                <button
                                    onClick={() => setClearModalOpen(true)}
                                    aria-label="Clear all stored data"
                                    className="p-2 rounded-xl bg-rose-100 dark:bg-rose-950/60 border border-rose-300 dark:border-rose-900/80 text-rose-600 dark:text-rose-300 hover:bg-rose-200 dark:hover:bg-rose-800 transition btn-press h-9 w-9 items-center justify-center hidden sm:flex"
                                    title="Clear stored data"
                                >
                                    <Icon name="trash-2" className="w-3.5 h-3.5" />
                                </button>
                            </div>
                        </div>

                        {/* Mobile Menu Dropdown */}
                        {isMobileMenuOpen && (
                            <div className="lg:hidden w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl mt-2 p-2 shadow-lg flex flex-col gap-1 animate-fade-in-up">
                                <input 
                                    type="text" 
                                    placeholder="Search tasks..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="md:hidden w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold focus:border-sky-500 mb-2"
                                />
                                {[
                                    { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                                    { id: 'projects', label: 'Projects', icon: 'folder-kanban' },
                                    { id: 'tasks', label: 'Tasks Matrix', icon: 'grid' },
                                    { id: 'calendar', label: 'Calendar', icon: 'calendar' },
                                    { id: 'pomodoro', label: 'Focus Timer', icon: 'timer' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => { setActiveTab(tab.id); setIsMobileMenuOpen(false); }}
                                        className={`flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-bold transition-all ${
                                            activeTab === tab.id
                                                ? 'bg-sky-100 dark:bg-sky-900/30 text-sky-700 dark:text-sky-400'
                                                : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                                        }`}
                                    >
                                        <Icon name={tab.icon} className="w-4 h-4" />
                                        <span>{tab.label}</span>
                                    </button>
                                ))}
