                                </div>
                            );
                        })}
                        {projects.length === 0 && (
                            <div className="col-span-full text-center p-10 border border-dashed rounded-2xl text-slate-500 text-sm">No projects yet. Create one to get started.</div>
                        )}
                    </div>
                </div>
            );
        }

        function TasksMatrixView({ projects, tasks, onEditTask, onDuplicateTask, onTogglePin, onToggleComplete, onDeleteTask, highlightedTaskId }) {
            const getTasksByQuad = (quad) => tasks.filter(t => (t.quadrant || 'do-first') === quad && t.status !== 'Completed');

            const renderQuadrant = (id, title, desc, icon, bgClass, borderClass, textClass) => {
                const quadTasks = getTasksByQuad(id);
                return (
                    <div className={`matrix-quad rounded-2xl p-4 border ${borderClass} ${bgClass} shadow-sm`}>
                        <div className="flex items-center justify-between mb-3 shrink-0">
                            <div className="flex items-center space-x-2">
                                <div className={`p-1.5 rounded-lg bg-white/50 dark:bg-slate-900/50 ${textClass}`}>
                                    <Icon name={icon} className="w-4 h-4" />
                                </div>
                                <div>
                                    <h3 className={`text-sm font-extrabold ${textClass}`}>{title}</h3>
                                    <p className="text-[10px] text-slate-600 dark:text-slate-400">{desc}</p>
                                </div>
                            </div>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/60 dark:bg-slate-900/60 border ${textClass}`}>{quadTasks.length}</span>
                        </div>
                        <div className="matrix-quad-body space-y-3 pr-1">
                            {quadTasks.length === 0 ? (
                                <div className="py-8 flex items-center justify-center text-xs text-slate-400 border-2 border-dashed border-slate-300/50 dark:border-slate-700/50 rounded-xl">Empty</div>
                            ) : quadTasks.map(t => (
                                <TaskCard
                                    key={t.id}
                                    task={t}
                                    project={projects.find(p => p.id === t.projectId)}
                                    onClick={() => onEditTask(t)}
                                    onTogglePin={() => onTogglePin(t.id)}
                                    onToggleComplete={() => onToggleComplete(t.id)}
                                    onDuplicate={() => onDuplicateTask(t)}
                                    onDelete={() => onDeleteTask(t.id)}
                                    highlighted={highlightedTaskId === t.id}
                                />
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="animate-fade-in-up flex flex-col min-h-0 h-full gap-3">
                    <div className="shrink-0">
                        <h2 className="text-lg font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                            <Icon name="grid" className="w-5 h-5 text-sky-500" />
                            Tasks Matrix
                        </h2>
                        <p className="text-xs text-slate-500 mt-0.5">Eisenhower method — scroll inside each quadrant on large screens.</p>
                    </div>
                    <div className="matrix-grid flex-1 min-h-0">
                        {renderQuadrant('do-first', 'Do First', 'Urgent & Important', 'alert-circle', 'bg-rose-50/50 dark:bg-rose-950/10', 'border-rose-200 dark:border-rose-900/30', 'text-rose-700 dark:text-rose-400')}
                        {renderQuadrant('schedule', 'Schedule', 'Important, Not Urgent', 'calendar-clock', 'bg-sky-50/50 dark:bg-sky-950/10', 'border-sky-200 dark:border-sky-900/30', 'text-sky-700 dark:text-sky-400')}
                        {renderQuadrant('delegate', 'Delegate', 'Urgent, Not Important', 'users', 'bg-amber-50/50 dark:bg-amber-950/10', 'border-amber-200 dark:border-amber-900/30', 'text-amber-700 dark:text-amber-400')}
                        {renderQuadrant('eliminate', 'Eliminate', 'Neither', 'trash-2', 'bg-slate-100/50 dark:bg-slate-900/30', 'border-slate-200 dark:border-slate-800', 'text-slate-700 dark:text-slate-400')}
                    </div>
                </div>
            );
        }

        function CalendarView({ tasks, projects, onEditTask, onNewTaskForDate }) {
            const [viewMode, setViewMode] = useState('month');
            const [currentDate, setCurrentDate] = useState(new Date());
            const [dayFocus, setDayFocus] = useState(new Date());

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const weekdayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

            const startOfMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const endOfMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
            const startDay = startOfMonth.getDay();
            const daysInMonth = endOfMonth.getDate();
            const days = [];
            for (let i = 0; i < startDay; i++) days.push(null);
            for (let i = 1; i <= daysInMonth; i++) days.push(new Date(currentDate.getFullYear(), currentDate.getMonth(), i));

            const isToday = (d) => {
                if (!d) return false;
                const t = new Date();
                return d.getDate() === t.getDate() && d.getMonth() === t.getMonth() && d.getFullYear() === t.getFullYear();
            };

            const goToday = () => {
                const now = new Date();
                setCurrentDate(now);
                setDayFocus(now);
                setViewMode('day');
            };

            const dayStr = getLocalDateStr(dayFocus);
            const dayTasks = tasks
                .filter(t => t.dueDate === dayStr && t.status !== 'Completed')
                .sort((a, b) => (a.dueTime || '99:99').localeCompare(b.dueTime || '99:99'));

            const shiftDay = (delta) => {
                const d = new Date(dayFocus);
                d.setDate(d.getDate() + delta);
                setDayFocus(d);
                setCurrentDate(d);
            };

            const taskColor = (t) => {
                const p = projects.find(proj => proj.id === t.projectId);
                return p?.color || t.color || '#38bdf8';
            };

            if (viewMode === 'day') {
                return (
                    <div className="space-y-5 animate-fade-in-up">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-3 flex-wrap">
                                <h2 className="text-xl font-extrabold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                    <Icon name="calendar-days" className="w-5 h-5 text-sky-500" />
                                    {weekdayNames[dayFocus.getDay()]}, {monthNames[dayFocus.getMonth()]} {dayFocus.getDate()}
                                </h2>
                                {isToday(dayFocus) && (
                                    <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-sky-500 text-white">Today</span>
                                )}
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => shiftDay(-1)} className="p-2 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">
                                    <Icon name="chevron-left" className="w-4 h-4" />
                                </button>
                                <button onClick={goToday} className="px-3 py-1 rounded-lg border border-slate-300 dark:border-slate-700 text-xs font-bold hover:bg-slate-100 dark:hover:bg-slate-800">Today</button>
                                <button onClick={() => shiftDay(1)} className="p-2 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">
                                    <Icon name="chevron-right" className="w-4 h-4" />
                                </button>
                                <button onClick={() => setViewMode('month')} className="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700">
                                    Month view
                                </button>
                                <button onClick={() => onNewTaskForDate(dayStr)} className="px-3 py-1.5 rounded-lg bg-sky-500 text-white text-xs font-bold flex items-center gap-1">
                                    <Icon name="plus" className="w-3.5 h-3.5" /> Add
                                </button>
                            </div>
                        </div>

                        <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm">
                            {dayTasks.length === 0 ? (
                                <div className="p-12 text-center text-slate-500 text-sm">
                                    <Icon name="calendar-off" className="w-10 h-10 mx-auto mb-3 text-slate-300 dark:text-slate-600" />
                                    No tasks scheduled for this day.
                                    <div className="mt-4">
                                        <button onClick={() => onNewTaskForDate(dayStr)} className="text-sky-500 font-semibold text-xs hover:underline">Create a task for {dayStr}</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {dayTasks.map(t => {
                                        const p = projects.find(proj => proj.id === t.projectId);
                                        const color = taskColor(t);
                                        return (
                                            <div
                                                key={t.id}
                                                onClick={() => onEditTask(t)}
                                                className="flex items-start gap-4 p-4 hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition"
                                            >
                                                <div className="w-16 shrink-0 text-right pt-0.5">
                                                    <span className="text-xs font-mono font-bold text-slate-500">{t.dueTime || 'All day'}</span>
                                                </div>
                                                <div className="w-1 self-stretch rounded-full shrink-0" style={{ backgroundColor: color }} />
                                                <div className="flex-1 min-w-0">
                                                    <div className="text-sm font-bold text-slate-900 dark:text-slate-100">{t.title}</div>
                                                    {t.description && <p className="text-xs text-slate-500 mt-0.5 line-clamp-2">{t.description}</p>}
                                                    <div className="flex gap-2 mt-1.5">
                                                        {p && <span className="text-[9px] font-bold uppercase px-1.5 py-0.5 rounded border" style={{ color: color, borderColor: `${color}40` }}>{p.code}</span>}
                                                        {t.recurring && t.recurring !== 'none' && <Icon name="repeat" className="w-3 h-3 text-sky-500" />}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-6 animate-fade-in-up">
                    <div className="flex items-center justify-between flex-wrap gap-3">
                        <div className="flex items-center gap-3">
                            <h2 className="text-xl font-extrabold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                <Icon name="calendar" className="w-5 h-5 text-sky-500" />
                                {monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}
                            </h2>
                            <button onClick={goToday} className="px-3 py-1 rounded-lg border border-slate-300 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                                Today
                            </button>
                        </div>
                        <div className="flex items-center space-x-2">
                            <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1))} className="p-2 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">
                                <Icon name="chevron-left" className="w-4 h-4" />
                            </button>
                            <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1))} className="p-2 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">
                                <Icon name="chevron-right" className="w-4 h-4" />
                            </button>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm">
                        <div className="grid grid-cols-7 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50">
                            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                                <div key={day} className="p-3 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">{day}</div>
                            ))}
                        </div>
                        <div className="grid grid-cols-7 auto-rows-[minmax(100px,auto)]">
                            {days.map((date, idx) => {
                                if (!date) return <div key={`empty-${idx}`} className="p-2 border-r border-b border-slate-100 dark:border-slate-800/50 bg-slate-50/50 dark:bg-slate-950/20" />;
                                const dateStr = getLocalDateStr(date);
                                const dayTasks = tasks.filter(t => t.dueDate === dateStr && t.status !== 'Completed');
                                const isCurrentDay = isToday(date);
                                return (
                                    <div
                                        key={dateStr}
                                        className={`p-2 border-r border-b border-slate-100 dark:border-slate-800/50 min-h-[110px] group relative ${isCurrentDay ? 'bg-sky-50/30 dark:bg-sky-950/20' : 'hover:bg-slate-50 dark:hover:bg-slate-800/30'}`}
                                    >
                                        <div className="flex justify-between items-start mb-2">
                                            <button
                                                onClick={() => { setDayFocus(date); setViewMode('day'); }}
                                                className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full ${isCurrentDay ? 'bg-sky-500 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}`}
                                            >
                                                {date.getDate()}
                                            </button>
                                            <button onClick={() => onNewTaskForDate(dateStr)} className="opacity-0 group-hover:opacity-100 p-1 text-slate-400 hover:text-sky-500" title="Add task">
                                                <Icon name="plus" className="w-3.5 h-3.5" />
                                            </button>
                                        </div>
                                        <div className="space-y-1.5 max-h-[140px] overflow-y-auto">
                                            {dayTasks.map(t => {
                                                const color = taskColor(t);
                                                return (
                                                    <div
                                                        key={t.id}
                                                        onClick={() => onEditTask(t)}
                                                        className="text-[10px] font-semibold truncate px-2 py-1.5 rounded-lg border cursor-pointer bg-white dark:bg-slate-800"
                                                        style={{ borderColor: color, borderLeftWidth: '3px' }}
                                                    >
                                                        <span className="text-slate-800 dark:text-slate-200">
                                                            {t.dueTime && <span className="mr-1 text-slate-400">{t.dueTime}</span>}
                                                            {t.title}
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function PomodoroView({ tasks, selectedTaskId, setSelectedTaskId, pomoCycle, isWorkPhase, timeLeft, isRunning, toggleTimer, resetTimer, customMinutes, setCustomMinutes, formatSeconds, wakeLockEnabled, setWakeLockEnabled }) {
            const breakMins = pomoCycle === 7 ? 15 : 5;
            const progressPercent = isWorkPhase
                ? ((customMinutes * 60 - timeLeft) / (customMinutes * 60)) * 100
                : ((breakMins * 60 - timeLeft) / (breakMins * 60)) * 100;

            const cycleDots = [];
            for (let i = 0; i < 4; i++) {
                const step = i * 2;
                cycleDots.push(
                    <div key={i} className={`w-3 h-3 rounded-full border-2 transition-colors ${pomoCycle > step ? 'bg-sky-500 border-sky-500' : pomoCycle === step ? 'border-sky-500 animate-pulse' : 'border-slate-300 dark:border-slate-700'}`} />
                );
            }

            return (
                <div className="flex items-center justify-center min-h-[calc(100vh-140px)] animate-fade-in-up p-4">
                    <div className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-slate-200 dark:border-slate-800 p-8 rounded-3xl shadow-2xl max-w-md w-full flex flex-col items-center">
                        <div className="text-center mb-6">
                            <h2 className="text-xl font-extrabold text-slate-900 dark:text-slate-100 flex items-center justify-center gap-2">
                                <Icon name="timer" className="w-5 h-5 text-sky-500" /> Focus Timer
                            </h2>
                            <p className="text-xs text-slate-500 mt-1 uppercase tracking-widest font-bold">
                                {isWorkPhase ? 'Focus Session' : (pomoCycle === 7 ? 'Long Break' : 'Short Break')}
                            </p>
                        </div>
                        <div className="relative w-56 h-56 flex items-center justify-center mb-8">
                            <svg className="absolute inset-0 w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" strokeWidth="3" className="text-slate-200 dark:text-slate-800" />
                                <circle cx="50" cy="50" r="45" fill="none" stroke={isWorkPhase ? '#38bdf8' : '#34d399'} strokeWidth="5" strokeLinecap="round" strokeDasharray={`${Math.max(0, Math.min(100, progressPercent)) * 2.827}, 282.7`} className="transition-all duration-1000 ease-linear" />
                            </svg>
                            <div className="text-5xl font-mono font-extrabold text-slate-900 dark:text-slate-100 relative z-10 tracking-tighter">{formatSeconds(timeLeft)}</div>
                        </div>
                        <div className="flex justify-center gap-4 mb-8">{cycleDots}</div>
                        <div className="flex items-center justify-center gap-4 mb-8">
                            <button onClick={toggleTimer} className={`w-16 h-16 rounded-full flex items-center justify-center text-white shadow-lg btn-press ${isRunning ? 'bg-rose-500 hover:bg-rose-600' : 'bg-sky-500 hover:bg-sky-600'}`}>
                                <Icon name={isRunning ? 'pause' : 'play'} className="w-6 h-6 ml-0.5" />
                            </button>
                            <button onClick={resetTimer} className="w-12 h-12 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 btn-press">
                                <Icon name="rotate-ccw" className="w-5 h-5" />
                            </button>
                        </div>
                        <div className="w-full space-y-4 border-t border-slate-200 dark:border-slate-800 pt-6">
                            <div className="space-y-1.5">
                                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider flex justify-between">
                                    <span>Track Focus to Task</span><span>(Auto-logged)</span>
                                </label>
                                <select value={selectedTaskId} onChange={(e) => setSelectedTaskId(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-750 rounded-xl px-3 py-2.5 text-xs font-semibold">
                                    <option value="">-- No task selected --</option>
                                    {tasks.map(t => <option key={t.id} value={t.id}>{t.title}</option>)}
                                </select>
                            </div>
                            <div className="flex items-center justify-between gap-4 pt-2">
                                <div className="flex-1 space-y-1.5">
                                    <label className="text-[10px] font-bold text-slate-500 uppercase">Work Interval: {customMinutes}m</label>
                                    <input type="range" min="5" max="60" step="5" value={customMinutes} onChange={(e) => setCustomMinutes(parseInt(e.target.value, 10))} className="w-full h-1 accent-sky-500" disabled={isRunning} />
                                </div>
                                <button onClick={() => setWakeLockEnabled(!wakeLockEnabled)} className={`p-2 rounded-xl border text-xs font-bold ${wakeLockEnabled ? 'bg-amber-100 dark:bg-amber-500/20 text-amber-700 border-amber-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 border-slate-300 dark:border-slate-700'}`} title="Keep screen awake">
                                    <Icon name={wakeLockEnabled ? 'sun' : 'moon'} className="w-4 h-4" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function TaskModal({ task, projects, defaultProjectId, onClose, onOpenProjectModal, onSave, onDuplicate }) {
            const [formData, setFormData] = useState({
                id: task?.id || null,
                projectId: task?.projectId || defaultProjectId || '',
                title: task?.title || '',
                description: task?.description || '',
                quadrant: task?.quadrant || 'do-first',
                category: task?.category || 'General',
                dueDate: task?.dueDate || '',
                dueTime: task?.dueTime || '',
                focusMinutes: task?.focusMinutes || 0,
                recurring: task?.recurring || 'none',
                isPinned: task?.isPinned || false,
                color: task?.color || '#38bdf8'
            });
            const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

            return (
                <div className="fixed inset-0 z-50 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl flex flex-col max-h-[90vh] animate-fade-in-up">
                        <div className="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-800 shrink-0">
                            <h3 className="text-lg font-extrabold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                <Icon name={formData.id ? 'edit-3' : 'plus-circle'} className="w-5 h-5 text-sky-500" />
                                {formData.id ? 'Edit Task' : 'Create Task'}
                            </h3>
                            <button onClick={onClose} className="p-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-900 dark:hover:text-slate-200">
                                <Icon name="x" className="w-5 h-5" />
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto py-5 space-y-5 pr-1">
                            <div className="space-y-1.5">
                                <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Project Focus</label>
                                <div className="flex gap-2">
                                    <select name="projectId" value={formData.projectId} onChange={handleChange} className="flex-1 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-750 rounded-xl px-3 py-2.5 text-xs font-semibold">
                                        <option value="" disabled>Select Project...</option>
                                        {projects.map(p => <option key={p.id} value={p.id}>[{p.code}] {p.name}</option>)}
                                    </select>
                                    <button onClick={onOpenProjectModal} type="button" className="px-3 py-2 bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-750 rounded-xl" title="New Project">
                                        <Icon name="folder-plus" className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                            <div className="space-y-1.5">
                                <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Title <span className="text-rose-500">*</span></label>
                                <input type="text" name="title" value={formData.title} onChange={handleChange} autoFocus placeholder="What needs to be done?" className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-750 rounded-xl px-4 py-3 text-sm font-bold" />
                            </div>
                            <div className="space-y-1.5">
                                <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Details</label>
                                <textarea name="description" value={formData.description} onChange={handleChange} rows="3" placeholder="Context, links, steps..." className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-750 rounded-xl px-4 py-3 text-xs resize-none" />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1.5">
                                    <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1"><Icon name="calendar" className="w-3.5 h-3.5" /> Due Date</label>
                                    <input type="date" name="dueDate" value={formData.dueDate} onChange={handleChange} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-750 rounded-xl px-3 py-2 text-xs" />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1"><Icon name="clock" className="w-3.5 h-3.5" /> Time</label>
                                    <input type="time" name="dueTime" value={formData.dueTime} onChange={handleChange} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-750 rounded-xl px-3 py-2 text-xs" />
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1.5">
                                    <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Priority</label>
                                    <select name="quadrant" value={formData.quadrant} onChange={handleChange} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-750 rounded-xl px-3 py-2.5 text-xs font-semibold">
                                        <option value="do-first">Do First (Urgent & Important)</option>
                                        <option value="schedule">Schedule (Important)</option>
                                        <option value="delegate">Delegate (Urgent)</option>
                                        <option value="eliminate">Eliminate (Neither)</option>
                                    </select>
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Recurring</label>
                                    <select name="recurring" value={formData.recurring} onChange={handleChange} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-750 rounded-xl px-3 py-2.5 text-xs font-semibold">
                                        {RECURRING_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div className="pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between shrink-0">
                            {formData.id && (
                                <button type="button" onClick={onDuplicate} className="p-2 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-600 hover:text-sky-600 btn-press" title="Duplicate">
                                    <Icon name="copy" className="w-4 h-4" />
                                </button>
                            )}
                            <div className="flex gap-3 ml-auto">
                                <button type="button" onClick={onClose} className="px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-slate-100 dark:hover:bg-slate-800 btn-press">Cancel</button>
                                <button
                                    type="button"
                                    onClick={() => formData.title.trim() && onSave(formData)}
                                    disabled={!formData.title.trim()}
                                    className={`px-5 py-2.5 rounded-xl text-xs font-extrabold flex items-center gap-2 btn-press ${formData.title.trim() ? 'bg-sky-500 hover:bg-sky-600 text-white shadow-lg' : 'bg-slate-200 dark:bg-slate-800 text-slate-400 cursor-not-allowed'}`}
                                >
                                    <Icon name="check" className="w-4 h-4" />
                                    Save Task
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ProjectModal({ project, onClose, onSave, onDelete }) {
            const [formData, setFormData] = useState({
                id: project?.id || null,
                name: project?.name || '',
                code: project?.code || '',
                description: project?.description || '',
                status: project?.status || 'Active',
                color: project?.color || '#38bdf8'
            });
            const [confirmDelete, setConfirmDelete] = useState(false);
            const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

            return (
                <div className="fixed inset-0 z-50 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5 animate-fade-in-up">
                        <div className="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                            <h3 className="text-lg font-extrabold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                <Icon name="folder-kanban" className="w-5 h-5 text-sky-500" />
                                {formData.id ? 'Edit Project' : 'New Project'}
                            </h3>
                            <button onClick={onClose} className="p-1 rounded-lg bg-slate-100 dark:bg-slate-800">
                                <Icon name="x" className="w-5 h-5" />
                            </button>
                        </div>
                        <div className="space-y-4">
                            <div className="grid grid-cols-3 gap-3">
                                <div className="col-span-2 space-y-1.5">
                                    <label className="text-[10px] font-bold text-slate-500 uppercase">Project Name *</label>
                                    <input type="text" name="name" value={formData.name} onChange={handleChange} autoFocus className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-750 rounded-xl px-3 py-2 text-sm font-bold" />
                                </div>
                                <div className="col-span-1 space-y-1.5">
                                    <label className="text-[10px] font-bold text-slate-500 uppercase">Code</label>
                                    <input type="text" name="code" value={formData.code} onChange={handleChange} maxLength="5" className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-750 rounded-xl px-3 py-2 text-sm font-bold uppercase text-center" />
                                </div>
                            </div>
                            <div className="space-y-1.5">
                                <label className="text-[10px] font-bold text-slate-500 uppercase">Description</label>
                                <textarea name="description" value={formData.description} onChange={handleChange} rows="2" className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-750 rounded-xl px-3 py-2 text-xs resize-none" />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-bold text-slate-500 uppercase">Status</label>
                                    <select name="status" value={formData.status} onChange={handleChange} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-750 rounded-xl px-3 py-2 text-xs font-semibold">
                                        <option value="Active">Active</option>
                                        <option value="On Hold">On Hold</option>
                                        <option value="Archived">Archived</option>
                                    </select>
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-bold text-slate-500 uppercase">Color Theme</label>
                                    <div className="flex items-center gap-1.5 flex-wrap pt-1">
                                        {COLOR_PRESETS.map(c => (
                                            <button key={c.id} type="button" onClick={() => setFormData({ ...formData, color: c.hex })} className={`w-6 h-6 rounded-full ${formData.color === c.hex ? 'scale-125 ring-2 ring-offset-2 ring-slate-800 dark:ring-slate-300 ring-offset-white dark:ring-offset-slate-900' : 'hover:scale-110'}`} style={{ backgroundColor: c.hex }} title={c.label} />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="pt-2 flex items-center justify-between gap-3">
                            {onDelete ? (
                                confirmDelete ? (
                                    <div className="flex items-center gap-2">
                                        <button
                                            type="button"
                                            onClick={onDelete}
                                            className="px-3 py-2 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white btn-press"
                                        >
                                            Confirm delete
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setConfirmDelete(false)}
                                            className="px-3 py-2 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800"
                                        >
                                            Cancel
                                        </button>
                                    </div>
                                ) : (
                                    <button
                                        type="button"
                                        onClick={() => setConfirmDelete(true)}
                                        className="px-3 py-2 rounded-xl text-xs font-bold text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 flex items-center gap-1.5 btn-press"
                                    >
                                        <Icon name="trash-2" className="w-3.5 h-3.5" />
                                        Delete project
                                    </button>
                                )
                            ) : <span />}
                            <div className="flex gap-3 ml-auto">
                                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-100 dark:hover:bg-slate-800">Cancel</button>
                                <button type="button" onClick={() => formData.name.trim() && onSave(formData)} disabled={!formData.name.trim()} className={`px-4 py-2 rounded-xl text-xs font-extrabold btn-press ${formData.name.trim() ? 'bg-sky-500 hover:bg-sky-600 text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-400'}`}>Save Project</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function TaskCard({ task, project, onClick, onTogglePin, onToggleComplete, onDuplicate, onDelete, highlighted }) {
            if (!task) return null;
            const isCompleted = task.status === 'Completed';
            const todayStr = getLocalDateStr();
            const isPastDue = !!(task.dueDate && task.dueDate < todayStr && !isCompleted);
            const dateBadgeClasses = isPastDue
                ? 'text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/30'
                : 'text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800';

            return (
                <div
                    id={`task-card-${task.id}`}
                    className={`group relative bg-white dark:bg-slate-900 border ${highlighted ? 'border-sky-500 dark:border-sky-400 animate-highlight-pulse shadow-lg' : 'border-slate-200 dark:border-slate-800 shadow-sm'} rounded-xl p-3 sm:p-4 hover:border-slate-400 dark:hover:border-slate-600 transition-all card-lift flex flex-col`}
                >
                    <div className="flex justify-between items-start gap-3">
                        <div className="flex items-start gap-3 w-full min-w-0">
                            <button
                                onClick={(e) => { e.stopPropagation(); onToggleComplete(); }}
                                className={`shrink-0 w-6 h-6 rounded-md border-2 mt-0.5 flex items-center justify-center btn-press ${isCompleted ? 'bg-emerald-500 border-emerald-500 animate-check-pop' : 'border-slate-300 dark:border-slate-600 hover:border-emerald-500'}`}
                            >
                                {isCompleted && <Icon name="check" className="w-3.5 h-3.5 text-white" />}
                            </button>
                            <div className="flex-1 min-w-0 cursor-pointer" onClick={onClick}>
                                <h4 className={`text-sm font-extrabold leading-tight truncate ${isCompleted ? 'text-slate-400 line-through' : 'text-slate-900 dark:text-slate-100'}`}>{task.title}</h4>
                                <div className="flex items-center flex-wrap gap-1.5 mt-1.5">
                                    {project && (
                                        <span className="text-[9px] font-extrabold uppercase tracking-widest px-1.5 py-0.5 rounded border" style={{ backgroundColor: `${project.color || '#38bdf8'}15`, borderColor: `${project.color || '#38bdf8'}40`, color: project.color || '#38bdf8' }}>{project.code}</span>
                                    )}
                                    {task.dueDate && (
                                        <span className={`flex items-center gap-1 text-[10px] font-semibold px-1.5 py-0.5 rounded ${dateBadgeClasses}`}>
                                            <Icon name="calendar" className="w-3 h-3" /> {task.dueDate}
                                            {task.dueTime && <span className="ml-1 opacity-80">{task.dueTime}</span>}
                                        </span>
                                    )}
                                    {(task.focusMinutes || 0) > 0 && (
                                        <span className="flex items-center gap-1 text-[10px] font-semibold text-slate-500 bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded">
                                            <Icon name="timer" className="w-3 h-3" /> {task.focusMinutes}m
                                        </span>
                                    )}
                                    {task.recurring && task.recurring !== 'none' && (
                                        <Icon name="repeat" className="w-3 h-3 text-sky-500" title={`Recurs ${task.recurring}`} />
                                    )}
                                </div>
                            </div>
                        </div>
                        <div className="flex items-center gap-1 shrink-0 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onClick={(e) => { e.stopPropagation(); onTogglePin(); }} className={`p-1.5 rounded-lg btn-press ${task.isPinned ? 'text-sky-500 bg-sky-50 dark:bg-sky-950/40' : 'text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                                <Icon name="pin" className="w-3.5 h-3.5" />
                            </button>
                            {onDuplicate && (
                                <button onClick={(e) => { e.stopPropagation(); onDuplicate(); }} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hidden sm:block btn-press">
                                    <Icon name="copy" className="w-3.5 h-3.5" />
                                </button>
                            )}
                            {onDelete && (
                                <button onClick={(e) => { e.stopPropagation(); onDelete(); }} className="p-1.5 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 hidden sm:block btn-press">
                                    <Icon name="trash-2" className="w-3.5 h-3.5" />
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
